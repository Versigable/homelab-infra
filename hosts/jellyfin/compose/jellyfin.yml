name: jellyfin-hub

services:
  jellyfin:
    # PINNED (2026-09-06). Was :latest, which meant every `deploy.sh
    # jellyfin` pulled whatever was current and could bounce Jellyfin
    # mid-stream as a side effect of an unrelated change. Pinned to the
    # version that was running at the time, so adopting this recreates
    # nothing. Upgrade deliberately, in its own MR.
    #
    # jellyfin/jellyfin lives on Docker Hub, whose anonymous pull limit
    # already failed pipelines #222 and #226 on the arr stack.
    #
    # 12.2 (2026-10-12, from 10.11.11) ran a one-way database migration.
    # Rolling back means restoring /home/jf/upgrade-backups/2026-10-12/
    # jellyfin-config.tgz as well as reverting this tag. 12.x also turns
    # off legacy auth (X-Emby-Token etc.), so Seerr must stay >= v3.5.0.
    image: jellyfin/jellyfin:12.2
    container_name: jellyfin
    user: 1000:1000
    cap_drop:
      - ALL
    cap_add:
      # CUDA's cuInit needs SYS_NICE for the worker-thread priority bump.
      # Without it, ffmpeg fails with CUDA_ERROR_NO_DEVICE on cap_drop=ALL.
      - SYS_NICE
    ports:
      - "8096:8096"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    # The NVIDIA hook grants /dev/nvidiactl, /dev/nvidia0 and /dev/nvidia-uvm
    # behind systemd's back: they are missing from the container scope's
    # DeviceAllow, so when systemd rebuilds the scope's device rules (seen on jf
    # 2026-10-12 after an apt install started a service) CUDA/NVENC and NVML lose
    # the GPU until the container restarts. Listing them here puts them in
    # DeviceAllow, so they survive.
    # On 2026-10-12 h264_nvenc failed this way inside Jellyfin.
    devices:
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidia-uvm:/dev/nvidia-uvm
    volumes:
      - /home/jf/config:/config
      - /home/jf/cache:/cache
      - /home/jf/media:/media:ro
      # Movies was migrated to the Liberry pool on 2026-08-29 after
      # Twelve_TB_Mirror reached 100% and stopped accepting writes.
      # This overlays ONLY Movies, at the SAME container path Jellyfin
      # already has recorded in its library database. Keeping /media/Movies
      # byte-identical preserves watch history, resume positions and
      # favourites; repointing the library at a new path (/media2/Movies)
      # would make Jellyfin treat every film as a new item and discard all
      # per-user data. Docker orders bind mounts by destination depth, so
      # /media mounts first and /media/Movies overlays it.
      - /home/jf/media2/Movies:/media/Movies:ro
    restart: unless-stopped
