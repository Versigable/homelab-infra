name: jellyfin-hub

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: 1000:1000
    cap_drop:
      - ALL
    cap_add:
      # CUDA's cuInit needs SYS_NICE for the worker-thread priority bump.
      # Without it, ffmpeg fails with CUDA_ERROR_NO_DEVICE on cap_drop=ALL.
      - SYS_NICE
    ports:
      - "8096:8096"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    volumes:
      - /home/jf/config:/config
      - /home/jf/cache:/cache
      - /home/jf/media:/media:ro
    restart: unless-stopped
