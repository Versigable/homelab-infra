# Metrics exporters on jf, scraped by the Wolverine Prometheus
# (hosts/monitoring/config/prometheus/prometheus.yml):
#   cadvisor             per-container CPU, memory, network, disk I/O  10.0.1.8:8098
#   nvidia-gpu-exporter  RTX 3060 Ti: GPU/encoder use, VRAM, power      10.0.1.8:9835
# Host metrics come from prometheus-node-exporter (apt, :9100), installed by
# hand like on phoenix and rogue. Published on the LAN IP only.
# Deployed by scripts/deploy-exporters.sh.
name: exporters

services:
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: unless-stopped
    # jf's Docker default runtime is nvidia; cAdvisor needs no GPU.
    runtime: runc
    # cAdvisor reads every container's cgroups, Docker's storage and /dev/kmsg
    # (OOM events), which is what its docs run it privileged for.
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    command:
      - --housekeeping_interval=10s
      - --docker_only=true
      # Only the compose project/service labels, not every image label.
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      # Keep cpu, memory, network, disk and diskIO; drop the high-cardinality rest
      # (per-CPU usage alone would multiply the series by jf's 12 vCPUs).
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,hugetlb,referenced_memory,cpu_topology,resctrl,process,memory_numa,cpuset
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      # 8098, not cAdvisor's usual 8080: qBittorrent's web UI holds 8080 on jf.
      - "10.0.1.8:8098:8080"
    cpus: 0.5
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nvidia-gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.15.1
    container_name: nvidia-gpu-exporter
    restart: unless-stopped
    # The NVIDIA runtime injects nvidia-smi and NVML ("utility"), so nothing from
    # the host is mounted. Shares the 3060 Ti with Jellyfin and the webstations.
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility
    # Explicit, like webstation.yml and jellyfin.yml: hook-granted nodes vanish
    # when systemd rebuilds the scope's device rules (NVML then reports
    # "Failed to initialize NVML: Unknown Error").
    devices:
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia0:/dev/nvidia0
    cap_drop: [ALL]
    read_only: true
    ports:
      - "10.0.1.8:9835:9835"
    cpus: 0.25
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
