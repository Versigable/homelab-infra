name: arr-hub

services:

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8080:8080"
      - "8888:8888"
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=Netherlands
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
    networks: [net_arr]
    restart: unless-stopped
    volumes:
      - gluetun_data:/tmp/gluetun
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
      - WEBUI_PORT=8080
    volumes:
      - ../config/qbittorrent:/config
      - /home/jf/media:/media
    restart: unless-stopped

  qbit-port-sync:
    image: alpine:3.20
    container_name: qbit-port-sync
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
      qbittorrent:
        condition: service_started
    volumes:
      - gluetun_data:/gluetun:ro
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null 2>&1 || true
        last=""
        while true; do
          if [ -f /gluetun/forwarded_port ]; then
            port=$$(cat /gluetun/forwarded_port 2>/dev/null || echo "")
            if [ -n "$$port" ] && [ "$$port" != "$$last" ]; then
              echo "[port-sync] gluetun forwarded port: $$port"
              if curl -fsS -X POST --data-urlencode "json={\"listen_port\":$$port}" http://localhost:8080/api/v2/app/setPreferences >/dev/null; then
                echo "[port-sync] qbit listening port updated to $$port"
                last="$$port"
              else
                echo "[port-sync] qbit API call failed (auth-bypass not enabled?)"
              fi
            fi
          fi
          sleep 60
        done
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
    volumes:
      - ../config/prowlarr:/config
    ports:
      - "9696:9696"
    networks: [net_arr]
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
    volumes:
      - ../config/sonarr:/config
      - /home/jf/media:/media
    ports:
      - "8989:8989"
    networks: [net_arr]
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
    volumes:
      - ../config/radarr:/config
      - /home/jf/media:/media
    ports:
      - "7878:7878"
    networks: [net_arr]
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - TZ=America/Denver
    volumes:
      - ../config/jellyseerr:/app/config
    ports:
      - "5055:5055"
    networks: [net_arr]
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=America/Denver
    networks: [net_arr]
    restart: unless-stopped

networks:
  net_arr:
    name: net_arr
    driver: bridge

volumes:
  gluetun_data:
