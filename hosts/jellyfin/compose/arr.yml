name: arr-hub

services:

  wg-proton:
    image: alpine:3.20
    container_name: wg-proton
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - "8080:8080"
      - "8888:8888"
    environment:
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      # Public values from NL-235 .conf — not secrets, plain compose env per design
      - WIREGUARD_PEER_PUBLIC_KEY=/i7jCNpcqVBUkY07gVlILN4nFdvZHmxvreAOgLGoZGg=
      - WIREGUARD_ENDPOINT=146.70.86.114:51820
      - WIREGUARD_DNS=10.2.0.1
    networks: [net_arr]
    restart: unless-stopped
    command:
      - sh
      - -c
      - |

        echo "[wg-proton] installing wireguard-tools, libnatpmp, iptables, curl"
        apk add --no-cache wireguard-tools libnatpmp iptables curl >/dev/null 2>&1

        mkdir -p /etc/wireguard
        {
          printf '[Interface]\n'
          printf 'PrivateKey = %s\n' "$${WIREGUARD_PRIVATE_KEY}"
          printf 'Address = %s\n' "$${WIREGUARD_ADDRESSES}"
          printf 'DNS = %s\n' "$${WIREGUARD_DNS}"
          printf 'Table = off\n\n'
          printf '[Peer]\n'
          printf 'PublicKey = %s\n' "$${WIREGUARD_PEER_PUBLIC_KEY}"
          printf 'AllowedIPs = 0.0.0.0/0\n'
          printf 'Endpoint = %s\n' "$${WIREGUARD_ENDPOINT}"
          printf 'PersistentKeepalive = 25\n'
        } > /etc/wireguard/tun0.conf
        chmod 600 /etc/wireguard/tun0.conf

        echo "[wg-proton] bringing up tun0 (kernel WG)"
        wg-quick up tun0
        echo "nameserver $${WIREGUARD_DNS}" > /etc/resolv.conf
        ip route add default dev tun0 || true

        ENDPOINT_HOST=$$(echo "$${WIREGUARD_ENDPOINT}" | cut -d: -f1)
        ENDPOINT_PORT=$$(echo "$${WIREGUARD_ENDPOINT}" | cut -d: -f2)

        echo "[wg-proton] applying kill-switch (default DROP, allow lo + tun0 + handshake + LAN)"
        iptables -P INPUT ACCEPT
        iptables -P FORWARD DROP
        iptables -P OUTPUT DROP
        iptables -A OUTPUT -o lo -j ACCEPT
        iptables -A OUTPUT -o tun0 -j ACCEPT
        iptables -A OUTPUT -d "$$ENDPOINT_HOST" -p udp --dport "$$ENDPOINT_PORT" -j ACCEPT
        iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        iptables -A OUTPUT -d 10.0.0.0/8 -j ACCEPT
        iptables -A OUTPUT -d 172.16.0.0/12 -j ACCEPT
        iptables -A OUTPUT -d 192.168.0.0/16 -j ACCEPT

        echo "[wg-proton] WG endpoint: $$(wg show tun0 endpoints | head -1)"
        echo "[wg-proton] external IP: $$(curl -s --max-time 10 https://api.ipify.org || echo failed)"

        echo "[wg-proton] starting NAT-PMP renewal loop (45s interval, 60s lifetime)"
        while true; do
          OUT_TCP=$$(timeout 8 natpmpc -g 10.2.0.1 -a 1 0 tcp 60 2>&1)
          OUT_UDP=$$(timeout 8 natpmpc -g 10.2.0.1 -a 1 0 udp 60 2>&1)
          PORT=$$(echo "$$OUT_TCP" | grep -oE "Mapped public port [0-9]+" | head -1 | awk '{print $$4}')
          if [ -n "$$PORT" ]; then
            echo "[$$(date +%T)] forwarded port: $$PORT"
            if curl -fsS -X POST --data-urlencode "json={\"listen_port\":$$PORT}" http://localhost:8080/api/v2/app/setPreferences >/dev/null 2>&1; then
              echo "  -> synced to qBit"
            else
              echo "  -> qBit not ready / sync failed"
            fi
          else
            echo "[$$(date +%T)] natpmpc failed: $$OUT_TCP"
          fi
          sleep 45
        done
    healthcheck:
      test: ["CMD-SHELL", "wg show tun0 endpoints 2>/dev/null | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:wg-proton"
    depends_on:
      wg-proton:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
      - WEBUI_PORT=8080
    # Supplementary group 1002: gameroom dirs are owned 1001:1002 with mode 775.
    # Process at uid=1000 needs gid 1002 in its group set to satisfy "group rwx".
    # (PUID/PGID kept at 1000/1000 so existing /home/jf/media writes don't break.)
    group_add:
      - "1002"
    volumes:
      - ../config/qbittorrent:/config
      - /home/jf/media:/media
      # /mnt/gameroom mounted rw on the jf VM (fstab entry; was previously ro).
      # Use this for direct downloads of ROMs/BIOS into RomM's library.
      # In qBittorrent UI, set save path to /gameroom/roms/<platform>/.
      - /mnt/gameroom:/gameroom
    restart: unless-stopped

  # NOTE: qbit-port-sync sidecar removed — its role is folded into wg-proton's
  # NAT-PMP renewal loop above (which runs natpmpc directly + syncs to qBit).

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
    volumes:
      - ../config/prowlarr:/config
    ports:
      - "9696:9696"
    networks: [net_arr]
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
    volumes:
      - ../config/sonarr:/config
      - /home/jf/media:/media
    ports:
      - "8989:8989"
    networks: [net_arr]
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
    volumes:
      - ../config/radarr:/config
      - /home/jf/media:/media
    ports:
      - "7878:7878"
    networks: [net_arr]
    restart: unless-stopped

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    environment:
      - TZ=America/Denver
    volumes:
      - ../config/jellyseerr:/app/config
    ports:
      - "5055:5055"
    networks: [net_arr]
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=America/Denver
    networks: [net_arr]
    restart: unless-stopped

networks:
  net_arr:
    name: net_arr
    driver: bridge
