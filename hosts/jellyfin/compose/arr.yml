# Image tags are PINNED, not floating. See the 2026-09-06 note below.
#
# Every `docker compose pull` fetched all ten images; six were :latest, so
# each deploy was simultaneously an unintended version bump and a Docker Hub
# rate-limit gamble. Pipeline #226 failed on exactly that
# ("toomanyrequests"), and #222 the day before. Pins were taken from the
# versions actually running at the time, verified present in their
# registries, so adopting this file changes no running software.
#
# To upgrade: bump a tag here deliberately, in its own MR.
name: arr-hub

services:

  # WireGuard to ProtonVPN via a thin Alpine container. Restored 2026-09-26,
  # replacing gluetun-OVPN (MR !77, 2026-05-04). That migration rested on an
  # 85s test showing OVPN "unshaped" at 17-28 MB/s; in production it capped
  # at the same ~1.5 MB/s as WG (a burst budget, not a bypass - the BT cap is
  # account-level). What gluetun-OVPN DID bring was instability: on
  # 2026-09-26 alone it logged 107 AUTH_FAILED from ProtonVPN's OpenVPN auth
  # and 13 restarts, most of them container exits (gluetun v3.39.0's
  # port-forwarding loop crashes on an iptables delete during a VPN restart
  # and takes the container down), each one bouncing qBittorrent.
  # WireGuard is key-based (no auth round-trip) and this container has no
  # restart-on-unhealthy loop, so it only restarts if it actually dies.
  #
  # Network alias `gluetun` is kept on purpose: Sonarr and Radarr address
  # qBittorrent as host "gluetun" port 8080.
  wg-proton:
    image: alpine:3.20
    container_name: wg-proton
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - "8080:8080"   # qBittorrent WebUI (shares wg-proton netns)
      - "8001:8001"   # qbittorrent-exporter (shares wg-proton netns)
    environment:
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      # Public values from the NL-235 .conf - not secrets, plain compose env.
      # Re-verified 2026-09-26: handshake, NL exit, DNS and NAT-PMP all OK.
      - WIREGUARD_PEER_PUBLIC_KEY=/i7jCNpcqVBUkY07gVlILN4nFdvZHmxvreAOgLGoZGg=
      - WIREGUARD_ENDPOINT=146.70.86.114:51820
      - WIREGUARD_DNS=10.2.0.1
    networks:
      net_arr:
        aliases: [gluetun]
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        echo "[wg-proton] installing wireguard-tools, libnatpmp, iptables, curl"
        apk add --no-cache wireguard-tools libnatpmp iptables curl >/dev/null 2>&1

        mkdir -p /etc/wireguard
        {
          printf '[Interface]\n'
          printf 'PrivateKey = %s\n' "$${WIREGUARD_PRIVATE_KEY}"
          printf 'Address = %s\n' "$${WIREGUARD_ADDRESSES}"
          printf 'DNS = %s\n' "$${WIREGUARD_DNS}"
          printf 'Table = off\n\n'
          printf '[Peer]\n'
          printf 'PublicKey = %s\n' "$${WIREGUARD_PEER_PUBLIC_KEY}"
          printf 'AllowedIPs = 0.0.0.0/0\n'
          printf 'Endpoint = %s\n' "$${WIREGUARD_ENDPOINT}"
          printf 'PersistentKeepalive = 25\n'
        } > /etc/wireguard/tun0.conf
        chmod 600 /etc/wireguard/tun0.conf

        echo "[wg-proton] bringing up tun0 (kernel WG)"
        wg-quick up tun0
        echo "nameserver $${WIREGUARD_DNS}" > /etc/resolv.conf
        # ProtonVPN's gateway (DNS + NAT-PMP) must route via tun0, or natpmpc
        # hangs - this route is what made port forwarding work (MR !72).
        ip route add 10.2.0.0/24 dev tun0 2>/dev/null || true
        ip route add default dev tun0 || true

        ENDPOINT_HOST=$$(echo "$${WIREGUARD_ENDPOINT}" | cut -d: -f1)
        ENDPOINT_PORT=$$(echo "$${WIREGUARD_ENDPOINT}" | cut -d: -f2)

        # Fail closed. qBittorrent also binds tun0 (Network interface setting),
        # so this is the second of two layers.
        echo "[wg-proton] applying kill-switch (default DROP, allow lo + tun0 + handshake + LAN)"
        iptables -P INPUT ACCEPT
        iptables -P FORWARD DROP
        iptables -P OUTPUT DROP
        iptables -A OUTPUT -o lo -j ACCEPT
        iptables -A OUTPUT -o tun0 -j ACCEPT
        iptables -A OUTPUT -d "$$ENDPOINT_HOST" -p udp --dport "$$ENDPOINT_PORT" -j ACCEPT
        iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        iptables -A OUTPUT -d 10.0.0.0/8 -j ACCEPT
        iptables -A OUTPUT -d 172.16.0.0/12 -j ACCEPT
        iptables -A OUTPUT -d 192.168.0.0/16 -j ACCEPT

        echo "[wg-proton] WG endpoint: $$(wg show tun0 endpoints | head -1)"
        echo "[wg-proton] external IP: $$(curl -s --max-time 10 --interface tun0 https://api.ipify.org || echo failed)"

        # NAT-PMP renewal + qBit listen-port sync (replaces qbit-port-sync).
        # Re-syncs whenever the mapped port changes OR qBit's listen_port has
        # drifted from it (e.g. qBit restarted with a stale value).
        echo "[wg-proton] starting NAT-PMP renewal loop (45s interval, 60s lifetime)"
        while true; do
          OUT_TCP=$$(timeout 8 natpmpc -g 10.2.0.1 -a 1 0 tcp 60 2>&1)
          timeout 8 natpmpc -g 10.2.0.1 -a 1 0 udp 60 >/dev/null 2>&1
          PORT=$$(echo "$$OUT_TCP" | grep -oE "Mapped public port [0-9]+" | head -1 | awk '{print $$4}')
          if [ -n "$$PORT" ]; then
            CUR=$$(curl -s -m 5 http://localhost:8080/api/v2/app/preferences | grep -oE '"listen_port":[0-9]+' | cut -d: -f2)
            if [ "$$CUR" != "$$PORT" ]; then
              if curl -fsS -m 10 -X POST --data-urlencode "json={\"listen_port\":$$PORT}" http://localhost:8080/api/v2/app/setPreferences >/dev/null 2>&1; then
                echo "[$$(date +%T)] forwarded port $$PORT -> synced to qBit (was $${CUR:-unknown})"
              else
                echo "[$$(date +%T)] forwarded port $$PORT -> qBit not ready, will retry"
              fi
            fi
          else
            echo "[$$(date +%T)] natpmpc failed: $$OUT_TCP"
          fi
          sleep 45
        done
    healthcheck:
      # Healthy = a WG handshake within the last 3 minutes (rekey is every
      # 2 min while traffic flows), not merely "an endpoint is configured".
      test: ["CMD-SHELL", "hs=$$(wg show tun0 latest-handshakes | awk '{print $$2}'); [ -n \"$$hs\" ] && [ $$(( $$(date +%s) - hs )) -lt 180 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls474
    container_name: qbittorrent
    network_mode: "service:wg-proton"
    # Docker's default 10s stop timeout is too short here. On SIGTERM
    # qBittorrent must stop ~530 torrents, announce stopped to their
    # trackers, and flush 48M of .fastresume state. Overrunning 10s means
    # SIGKILL mid-flush, and any torrent whose resume data was not written
    # reverts to whatever was last persisted - which is how six Minerva
    # sets came back as missingFiles on 2026-09-06 after a gluetun flap
    # restarted this container, discarding that morning's rechecks and
    # forcing an 887 GB rehash of the Saturn set alone.
    #
    # jf-netns-reconcile.service restarts this container unconditionally
    # after every VPN-container recovery, so this path is exercised often.
    # Paired with Session\SaveResumeDataInterval=5 (was 180) set on the
    # running instance the same day.
    stop_grace_period: 120s
    depends_on:
      wg-proton:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
      - WEBUI_PORT=8080
    # Supplementary group 1002: gameroom dirs are owned 1001:1002 mode 775.
    # Process at uid=1000 needs gid 1002 in its group set to satisfy 'group rwx'.
    group_add:
      - "1002"
    volumes:
      - ../config/qbittorrent:/config
      - /home/jf/media:/media
      # Movie seed data was de-duplicated onto the Liberry pool on 2026-08-30.
      # The 207 seeded movie releases are now HARDLINKS to the library copies
      # under /media2/Movies - one physical copy on disk serving both Jellyfin
      # and qBittorrent, which is the arrangement Radarr's hardlink imports
      # gave us before Movies moved pools. Those torrents are re-pointed at
      # /media2/downloads/complete via Set Location; everything else (Minerva
      # ROM sets, TV, active downloads) still lives under /media on the mirror.
      - /home/jf/media2:/media2
      - /mnt/gameroom:/gameroom
    restart: unless-stopped

  qbittorrent-exporter:
    image: esanchezm/prometheus-qbittorrent-exporter:v1.6.0
    container_name: qbittorrent-exporter
    network_mode: "service:wg-proton"
    depends_on:
      qbittorrent:
        condition: service_started
    environment:
      - QBITTORRENT_HOST=localhost
      - QBITTORRENT_PORT=8080
      - EXPORTER_PORT=8001
    restart: unless-stopped

  # Watchdog: containers sharing the VPN container's netns via
  # 'network_mode: service:wg-proton' keep a stale reference if it restarts
  # and become unreachable until they are restarted too. Compose depends_on
  # only fires at compose-up time, not on parent state changes.
  #
  # This sidecar watches wg-proton's State.StartedAt and bounces dependents
  # whenever it changes. ~30s response time. Container name kept as
  # gluetun-watchdog so the swap leaves nothing orphaned.
  gluetun-watchdog:
    image: docker:27-cli
    container_name: gluetun-watchdog
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [net_arr]
    restart: unless-stopped
    environment:
      - VPN_CONTAINER=wg-proton
    command:
      - sh
      - -c
      - |
        LAST=""
        echo "[watchdog] starting; restarts qbittorrent + qbittorrent-exporter when $${VPN_CONTAINER} restarts"
        while true; do
          NOW=$$(docker inspect "$${VPN_CONTAINER}" --format '{{.State.StartedAt}}' 2>/dev/null || echo "")
          if [ -n "$$NOW" ] && [ -n "$$LAST" ] && [ "$$NOW" != "$$LAST" ]; then
            echo "[watchdog] $${VPN_CONTAINER} restarted at $$NOW (was $$LAST) - bouncing dependents"
            docker restart qbittorrent qbittorrent-exporter || echo "[watchdog] one or more restarts failed (continuing)"
          fi
          LAST="$$NOW"
          sleep 30
        done

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls158
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
    volumes:
      - ../config/prowlarr:/config
    ports:
      - "9696:9696"
    networks: [net_arr]
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls323
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
    volumes:
      - ../config/sonarr:/config
      - /home/jf/media:/media
    ports:
      - "8989:8989"
    networks: [net_arr]
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0.10514-ls314
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
    volumes:
      - ../config/radarr:/config
      - /home/jf/media:/media
      # Movies lives on the Liberry pool - see jellyfin.yml. Same container
      # path, so Radarr's root folder (/media/Movies) is unchanged.
      - /home/jf/media2/Movies:/media/Movies
      # Radarr's download category lands on Liberry at
      # /media2/downloads/complete/radarr (qBittorrent category save path,
      # set 2026-09-05). Radarr needs the SAME /media2 view qBittorrent has,
      # or it cannot see completed downloads and fails every import with
      # "No files found are eligible for import".
      #
      # With the download dir and /media/Movies both on Liberry they are one
      # filesystem again, so copyUsingHardlinks=true works and an import
      # costs no extra space. Sonarr deliberately does NOT get this mount:
      # its category stays on the mirror alongside /media/TV and /media/Anime.
      - /home/jf/media2:/media2
    ports:
      - "7878:7878"
    networks: [net_arr]
    restart: unless-stopped

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    container_name: jellyseerr
    environment:
      - TZ=America/Denver
    volumes:
      - ../config/jellyseerr:/app/config
    ports:
      - "5055:5055"
    networks: [net_arr]
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=America/Denver
    networks: [net_arr]
    restart: unless-stopped

networks:
  net_arr:
    name: net_arr
    driver: bridge
