name: arr-hub

services:

  gluetun:
    image: qmcgaw/gluetun:v3.39.0
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8080:8080"   # qBittorrent WebUI
      - "8888:8888"   # gluetun HTTP control server
      - "8001:8001"   # qbittorrent-exporter (8000 reserved for gluetun control server) (shares gluetun netns)
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=openvpn
      # OPENVPN_USER must include the +pmp suffix for ProtonVPN NAT-PMP port
      # forwarding to work. See [[3-Resources/runbooks/wg-proton-operations]]
      # and memory reference_protonvpn-ovpn-unshaped-recipe. The +pmp is
      # baked into the secret value, not appended here.
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=Netherlands
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
    networks: [net_arr]
    restart: unless-stopped
    volumes:
      - gluetun_data:/tmp/gluetun
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
      - WEBUI_PORT=8080
    # Supplementary group 1002: gameroom dirs are owned 1001:1002 mode 775.
    # Process at uid=1000 needs gid 1002 in its group set to satisfy 'group rwx'.
    group_add:
      - "1002"
    volumes:
      - ../config/qbittorrent:/config
      - /home/jf/media:/media
      # Movie seed data was de-duplicated onto the Liberry pool on 2026-08-30.
      # The 207 seeded movie releases are now HARDLINKS to the library copies
      # under /media2/Movies - one physical copy on disk serving both Jellyfin
      # and qBittorrent, which is the arrangement Radarr's hardlink imports
      # gave us before Movies moved pools. Those torrents are re-pointed at
      # /media2/downloads/complete via Set Location; everything else (Minerva
      # ROM sets, TV, active downloads) still lives under /media on the mirror.
      - /home/jf/media2:/media2
      - /mnt/gameroom:/gameroom
    restart: unless-stopped

  # Restored from pre-MR-68 era: polls gluetun's forwarded_port file and
  # syncs to qBit via WebUI API. Inline script (deploy.sh installs only the
  # compose file, not separate scripts).
  qbit-port-sync:
    image: alpine:3.20
    container_name: qbit-port-sync
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
      qbittorrent:
        condition: service_started
    volumes:
      - gluetun_data:/gluetun:ro
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null 2>&1 || true
        last=""
        while true; do
          if [ -f /gluetun/forwarded_port ]; then
            port=$$(cat /gluetun/forwarded_port 2>/dev/null || echo "")
            if [ -n "$$port" ] && [ "$$port" != "$$last" ]; then
              echo "[port-sync] gluetun forwarded port: $$port"
              if curl -fsS -X POST --data-urlencode "json={\"listen_port\":$$port}" http://localhost:8080/api/v2/app/setPreferences >/dev/null; then
                echo "[port-sync] qbit listening port updated to $$port"
                last="$$port"
              else
                echo "[port-sync] qbit API call failed (auth-bypass not enabled?)"
              fi
            fi
          fi
          sleep 60
        done
    restart: unless-stopped

  qbittorrent-exporter:
    image: esanchezm/prometheus-qbittorrent-exporter:v1.6.0
    container_name: qbittorrent-exporter
    network_mode: "service:gluetun"
    depends_on:
      qbittorrent:
        condition: service_started
    environment:
      - QBITTORRENT_HOST=localhost
      - QBITTORRENT_PORT=8080
      - EXPORTER_PORT=8001
    restart: unless-stopped

  # Watchdog: gluetun's network namespace gets recreated on every reconnect
  # (OVPN session refresh, ProtonVPN-side disconnect, hourly key rotation).
  # Containers sharing its netns via 'network_mode: service:gluetun' keep
  # a stale reference and become unreachable until restarted. Compose
  # depends_on only fires at compose-up time, not on parent state changes.
  #
  # This sidecar watches gluetun's State.StartedAt and bounces dependents
  # whenever it changes. ~30s response time. See decision-of-2026-05-04
  # and the wg-proton-operations runbook for context (the manual
  # 'docker restart qbittorrent' fallback works if this watchdog itself
  # fails).
  gluetun-watchdog:
    image: docker:27-cli
    container_name: gluetun-watchdog
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [net_arr]
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        LAST=""
        echo "[watchdog] starting; restarts qbittorrent + qbit-port-sync + qbittorrent-exporter on gluetun reconnect"
        while true; do
          NOW=$$(docker inspect gluetun --format '{{.State.StartedAt}}' 2>/dev/null || echo "")
          if [ -n "$$NOW" ] && [ -n "$$LAST" ] && [ "$$NOW" != "$$LAST" ]; then
            echo "[watchdog] gluetun restarted at $$NOW (was $$LAST) - bouncing dependents"
            docker restart qbittorrent qbit-port-sync qbittorrent-exporter || echo "[watchdog] one or more restarts failed (continuing)"
          fi
          LAST="$$NOW"
          sleep 30
        done

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
    volumes:
      - ../config/prowlarr:/config
    ports:
      - "9696:9696"
    networks: [net_arr]
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
    volumes:
      - ../config/sonarr:/config
      - /home/jf/media:/media
    ports:
      - "8989:8989"
    networks: [net_arr]
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
    volumes:
      - ../config/radarr:/config
      - /home/jf/media:/media
      # Movies lives on the Liberry pool - see jellyfin.yml. Same container
      # path, so Radarr's root folder (/media/Movies) is unchanged.
      - /home/jf/media2/Movies:/media/Movies
      # Radarr's download category lands on Liberry at
      # /media2/downloads/complete/radarr (qBittorrent category save path,
      # set 2026-09-05). Radarr needs the SAME /media2 view qBittorrent has,
      # or it cannot see completed downloads and fails every import with
      # "No files found are eligible for import".
      #
      # With the download dir and /media/Movies both on Liberry they are one
      # filesystem again, so copyUsingHardlinks=true works and an import
      # costs no extra space. Sonarr deliberately does NOT get this mount:
      # its category stays on the mirror alongside /media/TV and /media/Anime.
      - /home/jf/media2:/media2
    ports:
      - "7878:7878"
    networks: [net_arr]
    restart: unless-stopped

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    environment:
      - TZ=America/Denver
    volumes:
      - ../config/jellyseerr:/app/config
    ports:
      - "5055:5055"
    networks: [net_arr]
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=America/Denver
    networks: [net_arr]
    restart: unless-stopped

networks:
  net_arr:
    name: net_arr
    driver: bridge

volumes:
  gluetun_data:
