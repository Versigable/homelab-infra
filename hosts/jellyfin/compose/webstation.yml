# RomM emulator streaming: LinuxServer webstation (Selkies desktop + romm-broker).
# Three identical instances, so three games can stream at once. RomM pools them
# (same emulators and cores per platform) and a launch takes the first free one
# in config order, so instance 1 stays the warm one.
#
#   instance  container          /config     vCPUs  broker (RomM, LAN)      player path (Traefik)  media (UDP)
#   1         romm-webstation    ../config   0-3    http://10.0.1.8:3010    /streaming             7787
#   2         romm-webstation-2  ../config-2 4-7    http://10.0.1.8:3020    /streaming-2           7783
#   3         romm-webstation-3  ../config-3 8-11   http://10.0.1.8:3030    /streaming-3           7784
#
# Media goes over UDP (Selkies WebRTC mode) since 2026-11-07: vault decision
# 5-Decisions/2026-11-07_webstations-webrtc-udp. Each instance's UDP port is an idle
# GamingHub forward borrowed on X-Mansion's pfSense (WAN -> Traefik VM UDP router
# ark77xx in hosts/traefik/config/dynamic/games-udp.yml -> here).
#
# RomM calls each broker over the LAN (X-Broker-Secret, shared by all three) and
# players reach each stream same-origin through Traefik on games.* and arcade.*
# (hosts/traefik/config/dynamic/romm-streaming.yml). RomM's own list of the three
# lives in its live config.yml; see config/webstation/README.md.
# Deployed by scripts/deploy-webstation.sh, which also ships config/webstation/.
name: webstation

x-webstation-env: &webstation-env
  PUID: "1000"
  PGID: "1000"
  TZ: Etc/UTC
  BROKER_SECRET: ${BROKER_SECRET}
  HARDEN_DESKTOP: "true"
  DISABLE_TERMINALS: "true"
  DISABLE_SUDO: "true"
  # Fixed stream size; the browser scales it to the window. Unlocked, Selkies
  # follows the window (a 5K2K fullscreen asked for 5120x2160, past what
  # H.264 NVENC encodes).
  SELKIES_MANUAL_WIDTH: "1920"
  SELKIES_MANUAL_HEIGHT: "1080"
  # The client sends its devicePixelRatio as DPI (Windows 150% => 144), which
  # flips the compositor to scale 1.5 mid-session and blew up Qt emulators.
  SELKIES_SCALING_DPI: "96"
  # Capture locked at 60 fps. Emulators that pace on VSync (PCSX2 with
  # UseVSyncForTiming, Dolphin VSync, RetroArch, xemu) wait on the compositor's
  # frames, which follow this rate; unlocked, the sidebar's framerate slider
  # (8-240, saved in the browser) would change game speed. Locked, it's hidden.
  SELKIES_FRAMERATE: "60-60"
  # Encoders the sidebar offers; the first is the default. The image's own list
  # also has av1enc, vp8enc and vp9enc, which the 3060 Ti can't encode in hardware,
  # so Selkies falls back to CPU encoders on the 4 vCPUs the emulator runs on. An
  # AV1 session on instance 1 (2026-11-07) ran svt-av1 at 16 Mbps beside PPSSPP.
  # The Forge (RTX 5070 Ti, NVENC AV1) has its own template and keeps the full list.
  SELKIES_ENCODER: "h264enc,h265enc,jpeg"
  # PCSX2's patches.zip is installed by custom-cont-init.d/50-seed-emulators;
  # the broker's own refresh needs sudo, which DISABLE_SUDO blocks.
  PCSX2_PATCHES_FETCH: "false"
  # Azahar's bundled Qt picks native Wayland, where frames never reach the
  # window on NVIDIA; the wrapper forces XWayland (see config/webstation/bin).
  AZAHAR_BIN: /opt/webstation-bin/azahar-xcb
  # Keep WebRTC settings (SELKIES_RTC_CONFIG_JSON, SELKIES_TURN_*, SELKIES_STUN_*,
  # SELKIES_WEBRTC_PUBLIC_IP) out of this block; they go in webrtc-env below. The
  # image's init-selkies-config treats any of them as "WebRTC configured" and then
  # sets SELKIES_MODE=webrtc on an instance that doesn't set its own mode. See
  # config/webstation/README.md, "WebRTC over UDP".

# Merged by each instance that streams over WebRTC (all three). Each adds its own
# SELKIES_WEBRTC_UDP_MUX_PORT, which must equal its forwarded WAN port: it is the
# port the server puts in its ICE candidate. Signalling stays on the WebSocket
# through Cloudflare and Traefik; only the media moves to UDP.
x-webrtc-env: &webrtc-env
  SELKIES_MODE: webrtc
  # Host candidates only, answering the client's checks: right for forwarded ports.
  SELKIES_WEBRTC_ICE_LITE: "true"
  # Resolved to SELKIES_WEBRTC_PUBLIC_IP (IP only) at container start by
  # custom-cont-init.d/40-webrtc-public-ip, and re-checked every 5 min by
  # custom-services.d/svc-webrtc-ip-watch. A DNS-only CNAME to games-udp (DDNS).
  WEBRTC_PUBLIC_HOST: webstation-udp.ninjaprivacy.org
  # With no RTC config, WebRTC mode falls back to a public third-party TURN relay
  # (staticauth.openrelay.metered.ca, published shared secret). This file outranks
  # every other STUN/TURN source and lists no ICE servers at all.
  SELKIES_RTC_CONFIG_JSON: /seed/webrtc-rtc.json
  # Dual mode would let any controller-role player switch the instance to
  # websockets and back, restarting the stream for everyone on it; and the switch
  # outlives the session. Off. (The image turns it on for WebRTC-configured
  # instances unless it's set.)
  SELKIES_ENABLE_DUAL_MODE: "false"

x-webstation: &webstation
  image: lscr.io/linuxserver/webstation:romm-version-v0.15.0
  # GPU: jf runs NVIDIA's .run driver 595.104.02 (>= 595.80, so no kernel
  # params or dummy plug). Selkies also needs /dev/nvidia-modeset, which the
  # .run driver creates lazily; a docker.service ExecStartPre on jf
  # (nvidia-modprobe) makes it exist before containers start at boot. The image
  # already sets NVIDIA_DRIVER_CAPABILITIES=all. The 3060 Ti is shared by all
  # three instances, Jellyfin (NVENC) and Sunshine; 10 concurrent 1080p60
  # NVENC encodes were tested OK on 2026-10-12.
  runtime: nvidia
  # The NVIDIA hook grants /dev/nvidiactl, /dev/nvidia0 and /dev/nvidia-uvm
  # behind systemd's back: they are missing from the container scope's
  # DeviceAllow, so when systemd rebuilds the scope's device rules (seen on jf
  # 2026-10-12 after an apt install started a service) CUDA/NVENC and NVML lose
  # the GPU until the container restarts. Listing them here puts them in
  # DeviceAllow, so they survive.
  # Without them Selkies fell back to software x264 ("Failed to retain the
  # device's primary CUDA context") and the stream stuttered.
  devices:
    - /dev/nvidia-modeset:/dev/nvidia-modeset
    - /dev/nvidiactl:/dev/nvidiactl
    - /dev/nvidia0:/dev/nvidia0
    - /dev/nvidia-uvm:/dev/nvidia-uvm
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  restart: unless-stopped
  shm_size: "1gb"
  # Memory cap so one runaway game can't starve the other two sessions or
  # Jellyfin (jf has 16 GiB); a real xemu or Azahar session peaked at 1.86 GiB,
  # Selkies included. CPU is bounded by each instance's own cpuset below (4 of
  # jf's 12 vCPUs) instead of a CFS quota.
  mem_limit: 3g
  # No swap (memory.swap.max 0). qBittorrent's ~11 GiB of torrent page cache, and
  # ROM-ingest chdman runs on jf (11-13 GiB peaks), keep jf at its reclaim
  # watermarks, and with MGLRU even swappiness 10 swapped out ~400 MB of a running
  # xemu plus part of Selkies and labwc (2026-10-12), which came back from disk at
  # the next launch. Peak use is ~1.9 GiB with what was in swap, under the cap.
  memswap_limit: 3g
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  webstation:
    <<: *webstation
    container_name: romm-webstation
    # Each instance gets its own 4 vCPUs. Unconfined, jf's kernel moved xemu's
    # emulated-CPU thread across all 12 vCPUs ~150 times/s (cold caches every
    # hop); held to 4 it moved ~44 times/s and got 98% of a vCPU instead of 90%
    # (Halo, measured 2026-10-12). Jellyfin and arr still use all 12. On
    # phoenix, jf itself is pinned to CCD0 (VM 108 affinity 0-7,16-23).
    cpuset: "0-3"
    environment:
      <<: [*webstation-env, *webrtc-env]
      SUBFOLDER: /streaming/
      # WAN 7787/udp: borrowed from the stopped Ark Map 5 server (router ark7787).
      SELKIES_WEBRTC_UDP_MUX_PORT: "7787"
    volumes:
      - ../config:/config
      - /mnt/gameroom:/romm/library:ro
      # Seeds BIOS files and emulator config the broker expects but never provides.
      - ../custom-cont-init.d:/custom-cont-init.d:ro
      # Clears PPSSPP's stale instance counter (secondary instances mute themselves).
      - ../custom-services.d:/custom-services.d:ro
      - ../seed:/seed:ro
      - ../bin:/opt/webstation-bin:ro
    ports:
      - "10.0.1.8:3010:3000" # HTTP: RomM broker calls and the Traefik /streaming route
      - "10.0.1.8:7787:7787/udp" # WebRTC media (ICE mux), from the Traefik VM's UDP router ark7787

  webstation-2:
    <<: *webstation
    container_name: romm-webstation-2
    cpuset: "4-7"
    environment:
      <<: [*webstation-env, *webrtc-env]
      SUBFOLDER: /streaming-2/
      # WAN 7783/udp: borrowed from the never-built Ark Map 3 server (router ark7783).
      SELKIES_WEBRTC_UDP_MUX_PORT: "7783"
    volumes:
      - ../config-2:/config
      - /mnt/gameroom:/romm/library:ro
      - ../custom-cont-init.d:/custom-cont-init.d:ro
      - ../custom-services.d:/custom-services.d:ro
      - ../seed:/seed:ro
      - ../bin:/opt/webstation-bin:ro
    ports:
      - "10.0.1.8:3020:3000" # HTTP: RomM broker calls and the Traefik /streaming-2 route
      - "10.0.1.8:7783:7783/udp" # WebRTC media (ICE mux), from the Traefik VM's UDP router ark7783

  webstation-3:
    <<: *webstation
    container_name: romm-webstation-3
    cpuset: "8-11"
    environment:
      <<: [*webstation-env, *webrtc-env]
      SUBFOLDER: /streaming-3/
      # WAN 7784/udp: Ark Map 3's second port (router ark7784).
      SELKIES_WEBRTC_UDP_MUX_PORT: "7784"
    volumes:
      - ../config-3:/config
      - /mnt/gameroom:/romm/library:ro
      - ../custom-cont-init.d:/custom-cont-init.d:ro
      - ../custom-services.d:/custom-services.d:ro
      - ../seed:/seed:ro
      - ../bin:/opt/webstation-bin:ro
    ports:
      - "10.0.1.8:3030:3000" # HTTP: RomM broker calls and the Traefik /streaming-3 route
      - "10.0.1.8:7784:7784/udp" # WebRTC media (ICE mux), from the Traefik VM's UDP router ark7784
