# Installed by custom-cont-init.d/50-seed-emulators as R.ini and S.ini in Dolphin's
# GameSettings. Dolphin applies a one-letter game INI to every game whose ID starts
# with that letter, which covers all Wii discs. GameCube discs start with G and
# keep Dolphin.ini's settings.
[Controls]
# GameCube ports off in Wii games. They stay on for GameCube games (Dolphin.ini
# SIDevice = 6), and the broker binds GameCube pad 1 to the same SDL pad as Wii
# Remote 1. So Wii games that also take a GameCube controller (Brawl, Mario Kart
# Wii, Tatsunoko vs. Capcom, Muramasa, GoldenEye) would see one browser pad as two
# controllers. In Wii games the pad is the Classic Controller on Wii Remote 1
# (seed/dolphin-WiimoteNew.ini). 0 = no device.
PadType0 = 0
PadType1 = 0
PadType2 = 0
PadType3 = 0
# Wii Remotes 2-4 on (emulated), each with a Classic Controller on SDL pads 1-3.
# Dolphin connects only Wii Remote 1 by default, so co-op players' pads did nothing
# in Wii games. 1 = emulated.
WiimoteSource1 = 1
WiimoteSource2 = 1
WiimoteSource3 = 1
