name: arkse

services:
  ark-island:
    image: ich777/steamcmd:arkse
    container_name: ark-island
    restart: unless-stopped
    network_mode: "host"

    environment:
      - GAME_ID=376030
      - MAP=TheIsland
      - SERVER_NAME=NinjARK-TheIsland

      # --- CLUSTER SETTINGS ---
      # This env is mostly for the image; real magic is in GAME_PARAMS_EXTRA
      - ARKCLUSTERID=VersoCluster
      # -------------------------

      - SRV_PWD=${SERVER_PASSWORD}
      - SRV_ADMIN_PWD=${SERVER_ADMIN_PASSWORD}
      - GAME_PARAMS=?MaxPlayers=10?QueryPort=27019?Port=7783?RCONEnabled=False

      # NOTE: we append cluster flags here so Island uses the same cluster dir & ID
      - GAME_PARAMS_EXTRA=-server -log -NoBattlEye -multihome=0.0.0.0 -PublicIP=games-upd.ninjaprivacy.org -PublicPort=7783 -NoTransferFromFiltering -clusterid=VersoCluster
      
      - VALIDATE=false

    volumes:
      - ../data/TheIsland/serverdata/serverfiles:/serverdata/serverfiles
      - ../logs/TheIsland/serverdata/logs:/serverdata/logs
      - ../backups/TheIsland:/backups

      # Shared cluster directory (matches Ragnarok)
      - /home/arkse/cluster-shared:/serverdata/serverfiles/ShooterGame/Saved/clusters

    healthcheck:
      test: ["CMD-SHELL", "pgrep -f ShooterGameServer >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 30
