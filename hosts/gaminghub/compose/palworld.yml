name: palworld
services:
  palworld:
    image: thijsvanloef/palworld-server-docker:latest
    container_name: palworld
    restart: unless-stopped
    environment:
      - PUID=995
      - PGID=1003
      - SERVER_NAME=NinjaPrivacy_Palworld
      # Admin password enables RCON/REST admin + in-game admin commands. Value comes from the
      # SOPS-managed .env (secrets/palworld.env.sops -> compose/.env via deploy.sh). The image
      # env var is ADMIN_PASSWORD but the secret key is SERVER_ADMIN_PASSWORD, so map it here.
      # Deliberately ${...} interpolation, NOT env_file, so the unused SERVER_PASSWORD in .env
      # stays orphaned and player join stays open.
      - ADMIN_PASSWORD=${SERVER_ADMIN_PASSWORD}
      - SERVER_PORT=8211
      - QUERY_PORT=27015           # must match the container side of the 27018:27015 publish below
      - RCON_ENABLED=true           # toggle per preference
      - RCON_PORT=25575             # enable only if you intend to manage remotely
      - DIFFICULTY=0
      - PLAYERS=10
      - MULTITHREADING=true         # image var is MULTITHREADING (NOT MULTITHREAD, which the image silently ignored); adds -useperfthreads/-NoAsyncLoadingThread/-UseMultithreadForDS
      # Community listing: COMMUNITY=true makes start.sh append the -publiclobby launch arg so the
      # server shows in the in-game Community Servers tab. This is the ONLY way Xbox / PC Game Pass
      # players can join (they cannot direct-IP-connect; Steam/PS5 can). The old PUBLIC_LOBBY line
      # was a no-op the image never read. Intentionally passwordless/public per operator choice
      # 2026-07-10 (SERVER_PASSWORD left orphaned = open join). Requires pfSense to forward WAN
      # UDP 8211 (+ 27018 query) to Traefik 10.0.2.5; Traefik routing (pal8211 entrypoint/router/
      # service + publish) is already in main.
      - COMMUNITY=true
      - CROSSPLAY_PLATFORMS=(Steam,Xbox,PS5,Mac)  # explicit pin (previously relied on image default)
      - SHOW_PLAYER_LIST=true       # explicit pin (previously relied on image default)
      - ENABLE_PLAYER_LOGGING=true  # join/leave logging via REST API; clean now that ADMIN_PASSWORD is set
      # LOAD-BEARING pin. SteamCMD re-downloads land the server binaries as mode 0664 (no
      # execute) on this host, which trips init.sh's `[ -x PalServer.sh ]` check and crash-loops
      # the container (the process runs as the file owner uid 995, so owner-class perms apply).
      # UPDATE_ON_BOOT=false skips the on-boot SteamCMD verify so the restored exec bits persist.
      # To upgrade the game later: flip to true + redeploy, then chmod +x the launch binaries
      # (data/PalServer.sh + data/Pal/Binaries/Linux/PalServer-Linux-Shipping) and flip back.
      - UPDATE_ON_BOOT=false
    volumes:
      - ../data:/palworld
      - ../logs:/palworld/Pal/Saved/Logs
      - ../backups:/backups
    ports:
      - "8211:8211/udp"
      - "27018:27015/udp"
      # - "25575:25575/tcp"         # only if RCON enabled & needed externally
    # healthcheck: inherited from the image (`pgrep PalServer-Linux`, 300s start-period).
    # The previous custom `ss`-based check always failed — `ss` is not installed in this image,
    # so the container was flagged unhealthy even while serving.

    deploy:
      resources:
        limits:
          cpus: "4.0"      # hard cap (container sees up to 3 cores worth of time)
          memory: 12g      # hard cap; triggers OOM kill if exceeded
        reservations:
          cpus: "1.0"      # soft reservation (good hygiene)
          memory: 4g
    ulimits:               # (optional) protect against too many files
      nofile: 262144
    oom_kill_disable: false
    stop_grace_period: 30s

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  default:
    name: net_palworld
    external: true
