services:
  rust:
    image: ubuntu:22.04
    container_name: rust
    restart: unless-stopped
    
    deploy:
      resources:
        limits:
          memory: 12G

    env_file:
      - ./.env

    environment:
      TZ: "America/Denver"
      RUST_SERVER_NAME: "NinjaRust"
      RUST_SERVER_DESCRIPTION: "Rust on Ninjaprivacy"
      RUST_SERVER_URL: "https://rust.ninjaprivacy.org"
      RUST_SERVER_PORT: "8777"
      RUST_SERVER_QUERYPORT: "27017"
      RUST_RCON_PORT: "8779"
      RUST_SERVER_SEED: "123456"
      RUST_SERVER_WORLDSIZE: "3500"
      RUST_SERVER_MAXPLAYERS: "20"
      RUST_SERVER_SAVE_INTERVAL: "300"
      RUST_RCON_PASSWORD: "${RUST_RCON_PASSWORD}"
      RUST_SERVER_PASSWORD: "${RUST_SERVER_PASSWORD}"

    volumes:
      - rust-data:/srv/rust

    ports:
      - "8777:8777/udp"
      - "27017:27017/udp"

    stop_grace_period: 90s

    command: >
      bash -c '
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive

        # 1. Dependency Check
        if ! command -v tmux &> /dev/null; then
          apt-get update && apt-get install -y --no-install-recommends \
          ca-certificates curl wget lib32gcc-s1 lib32stdc++6 libc6-i386 libcurl4 libssl3 tmux locales
          rm -rf /var/lib/apt/lists/*
        fi

        # 2. SteamCMD Setup
        mkdir -p /srv/rust/steamcmd /srv/rust/server /srv/rust/servercfg /srv/rust/logs
        cd /srv/rust/steamcmd
        if [ ! -f steamcmd.sh ]; then
          wget -q https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
          tar -xzf steamcmd_linux.tar.gz && rm -f steamcmd_linux.tar.gz
        fi

        # 3. Update/Validate App
        ./steamcmd.sh +force_install_dir /srv/rust/server +login anonymous +app_update 258550 validate +quit

        # 4. CRITICAL FIX: Link the missing Steam library
        mkdir -p /root/.steam/sdk64/
        ln -sf /srv/rust/server/Linux64/steamclient.so /root/.steam/sdk64/steamclient.so

        # 5. Launch with explicit variables
        cd /srv/rust/server
        exec ./RustDedicated -batchmode -nographics \
          +server.port "$RUST_SERVER_PORT" \
          +server.queryport "$RUST_SERVER_QUERYPORT" \
          +rcon.port "$RUST_RCON_PORT" \
          +rcon.password "$RUST_RCON_PASSWORD" \
          +server.hostname "$RUST_SERVER_NAME" \
          +server.description "$RUST_SERVER_DESCRIPTION" \
          +server.url "$RUST_SERVER_URL" \
          +server.seed "$RUST_SERVER_SEED" \
          +server.worldsize "$RUST_SERVER_WORLDSIZE" \
          +server.maxplayers "$RUST_SERVER_MAXPLAYERS" \
          +server.saveinterval "$RUST_SERVER_SAVE_INTERVAL" \
          ${RUST_SERVER_PASSWORD:+ +server.password "$RUST_SERVER_PASSWORD"} \
          -logfile /dev/stdout
      '

volumes:
  rust-data: