services:
  # Kannis test 2!
  rust:
    image: didstopia/rust-server:latest
    container_name: rust
    restart: unless-stopped

    # Secrets only (passwords)
    env_file:
      - ./.env

    environment:
      # Match host rust service account
      PUID: "1005"
      PGID: "1006"

      # Identity / branding
      RUST_SERVER_IDENTITY: "rust1"
      RUST_SERVER_NAME: "NinjaRust"
      RUST_SERVER_DESCRIPTION: "Rust on Ninjaprivacy"
      RUST_SERVER_URL: "https://ninjaprivacy.org"

      # World configuration
      RUST_SERVER_SEED: "N1nJ@rUsT"
      RUST_SERVER_WORLDSIZE: "3500"
      RUST_SERVER_MAXPLAYERS: "20"
      RUST_SERVER_SAVE_INTERVAL: "300"

      # Ports (non-secrets)
      RUST_SERVER_PORT: "8777"
      RUST_SERVER_QUERYPORT: "27017"

      # RCON configured but NOT exposed publicly
      RUST_RCON_PORT: "8779"

    volumes:
      # SteamCMD + Rust binaries (exec-safe)
      - rust-data:/steamcmd/rust

      # Host-managed, human-editable data
      - ../config:/steamcmd/rust/servercfg
      - ../logs:/steamcmd/rust/logs

    ports:
      # Gameplay
      - "8777:8777/udp"
      # Steam query / server browser
      - "27017:27017/udp"

    stop_grace_period: 90s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  rust-data:
