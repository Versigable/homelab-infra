services:
  rust:
    image: pfeiffermax/rust-game-server:latest-oxide
    container_name: rust
    restart: unless-stopped
    command: >
      +server.ip 0.0.0.0
      +server.port ${SERVER_PORT}
      +server.queryport ${QUERY_PORT}
      +rcon.ip 0.0.0.0
      +rcon.port ${RCON_PORT}
      +rcon.password "${RCON_PASSWORD}"
      +rcon.web 1
      +server.hostname "${SERVER_HOSTNAME}"
      +server.description "${SERVER_DESCRIPTION}"
      +server.url "${SERVER_URL}"
      +server.identity "${SERVER_IDENTITY}"
      +server.seed ${SERVER_SEED}
      +server.worldsize ${WORLD_SIZE}
      +server.maxplayers ${MAX_PLAYERS}
      +server.saveinterval ${SAVE_INTERVAL}
      +server.secure 1
      +server.password "${SERVER_PASSWORD}"
    volumes:
      - /srv/rust/server:/persistance
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}/udp"
      - "${SERVER_PORT}:${SERVER_PORT}/tcp"
      - "${QUERY_PORT}:${QUERY_PORT}/udp"
      - "${RCON_PORT}:${RCON_PORT}/tcp"
    deploy:
      resources:
        limits:
          memory: 20G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"