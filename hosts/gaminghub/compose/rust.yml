services:
  rust:
    image: didstopia/rust-server:latest
    container_name: rust
    restart: unless-stopped
    environment:
      # --- Entrypoint Variables (Satisfies start_rust.sh) ---
      - RUST_SERVER_NAME=${SERVER_HOSTNAME}
      - RUST_SERVER_IDENTITY=${SERVER_IDENTITY}
      - RUST_SERVER_SEED=${SERVER_SEED}
      - RUST_SERVER_WORLDSIZE=${WORLD_SIZE}
      - RUST_SERVER_MAXPLAYERS=${MAX_PLAYERS}
      - RUST_SERVER_SAVE_INTERVAL=${SAVE_INTERVAL}
      - RUST_SERVER_PORT=${SERVER_PORT}
      - RUST_SERVER_QUERYPORT=${QUERY_PORT}
      - RUST_RCON_PORT=${RCON_PORT}
      - RUST_RCON_PASSWORD=${RCON_PASSWORD}
      - RUST_RCON_WEB=1
      
      # --- Security & Plugins ---
      - RUST_OXIDE_ENABLED=1  # Set to 1 to allow the password plugin to work
      - RUST_SERVER_PASSWORD=${SERVER_PASSWORD}
      
      # --- Logic Fixes ---
      - STEAM_UPDATE_ON_START=1
    volumes:
      - /srv/rust/server:/steamcmd/rust
      - /srv/rust/backup:/steamcmd/rust/backup
      - /srv/rust/server/RustDedicated_Data/Plugins/x86_64/steamclient.so:/root/.steam/sdk64/steamclient.so
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}/udp"
      - "${SERVER_PORT}:${SERVER_PORT}/tcp"
      - "${QUERY_PORT}:${QUERY_PORT}/udp"
      - "${RCON_PORT}:${RCON_PORT}/tcp"
    deploy:
      resources:
        limits:
          memory: 20G # Essential for GamingHub LXC (109) stability