services:
  # Kannis test 3!
  rust:
    image: ubuntu:22.04
    container_name: rust
    restart: unless-stopped

    # Secrets only
    env_file:
      - ./.env

    environment:
      TZ: "America/Denver"

      # Non-secrets
      RUST_SERVER_NAME: "NinjaRust"
      RUST_SERVER_DESCRIPTION: "Rust on Ninjaprivacy"
      RUST_SERVER_URL: "https://ninjaprivacy.org"

      RUST_SERVER_PORT: "8777"
      RUST_SERVER_QUERYPORT: "27017"
      RUST_RCON_PORT: "8779"

      RUST_SERVER_SEED: "123456"
      RUST_SERVER_WORLDSIZE: "3500"
      RUST_SERVER_MAXPLAYERS: "20"
      RUST_SERVER_SAVE_INTERVAL: "300"

    volumes:
      # Named volume holds the full Rust install + saves + config
      - rust-data:/srv/rust

    ports:
      - "8777:8777/udp"
      - "27017:27017/udp"
      # NOT exposing RCON publicly (leave this commented)
      # - "8779:8779/tcp"

    stop_grace_period: 90s

    command: >
      bash -lc '
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive

        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl wget lib32gcc-s1 lib32stdc++6 libc6-i386 libcurl4 libssl3 tmux locales
        rm -rf /var/lib/apt/lists/*

        mkdir -p /srv/rust/steamcmd
        cd /srv/rust/steamcmd
        if [ ! -f steamcmd.sh ]; then
          wget -q https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
          tar -xzf steamcmd_linux.tar.gz
          rm -f steamcmd_linux.tar.gz
        fi

        mkdir -p /srv/rust/server
        ./steamcmd.sh +force_install_dir /srv/rust/server +login anonymous +app_update 258550 validate +quit

        mkdir -p /srv/rust/servercfg /srv/rust/logs

        cd /srv/rust/server
        exec ./RustDedicated -batchmode -nographics \
          +server.port 8777 \
          +server.queryport 27017 \
          +rcon.port 8779 \
          +rcon.password "chodegarglingmonkey" \
          +server.hostname "NinjaRust" \
          +server.description "Rust on NinjaPrivacy" \
          +server.url "https://rust.ninjaprivacy.org" \
          +server.seed 123456 \
          +server.worldsize 3500 \
          +server.maxplayers 20 \
          +server.saveinterval 300 \
          ${RUST_SERVER_PASSWORD:+ +server.password "chodegargler"} \
          -logfile /srv/rust/logs/server.log
      '

volumes:
  rust-data:
