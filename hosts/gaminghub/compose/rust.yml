services:
  rust:
    image: ubuntu:22.04
    container_name: rust
    restart: unless-stopped

    # Secrets only
    env_file:
      - ./.env

    environment:
      TZ: "America/Denver"

      # Non-secrets
      RUST_SERVER_NAME: "NinjaRust"
      RUST_SERVER_DESCRIPTION: "Rust on Ninjaprivacy"
      RUST_SERVER_URL: "https://ninjaprivacy.org"

      RUST_SERVER_PORT: "8777"
      RUST_SERVER_QUERYPORT: "27017"
      RUST_RCON_PORT: "8779"

      RUST_SERVER_SEED: "123456"
      RUST_SERVER_WORLDSIZE: "3500"
      RUST_SERVER_MAXPLAYERS: "20"
      RUST_SERVER_SAVE_INTERVAL: "300"

    volumes:
      # Named volume holds the full Rust install + saves + config
      - rust-data:/srv/rust

    ports:
      - "8777:8777/udp"
      - "27017:27017/udp"
      # NOT exposing RCON publicly (leave this commented)
      # - "8779:8779/tcp"

    stop_grace_period: 90s

    command: >
      bash -lc '
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive

        apt-get update
        apt-get install -y --no-install-recommends
          ca-certificates curl wget
          lib32gcc-s1 lib32stdc++6 libc6-i386
          libcurl4 libssl3
          tmux locales
        rm -rf /var/lib/apt/lists/*

        # SteamCMD install (official method)
        mkdir -p /srv/rust/steamcmd
        cd /srv/rust/steamcmd
        if [ ! -f steamcmd.sh ]; then
          wget -q https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
          tar -xzf steamcmd_linux.tar.gz
          rm -f steamcmd_linux.tar.gz
        fi

        # Install/Update Rust Dedicated (app 258550)
        mkdir -p /srv/rust/server
        ./steamcmd.sh +force_install_dir /srv/rust/server +login anonymous +app_update 258550 validate +quit

        # Ensure directories exist
        mkdir -p /srv/rust/servercfg /srv/rust/logs

        # Launch RustDedicated
        cd /srv/rust/server
        exec ./RustDedicated -batchmode -nographics \
          +server.port ${RUST_SERVER_PORT} \
          +server.queryport ${RUST_SERVER_QUERYPORT} \
          +rcon.port ${RUST_RCON_PORT} \
          +rcon.password "${RUST_RCON_PASSWORD}" \
          +server.hostname "${RUST_SERVER_NAME}" \
          +server.description "${RUST_SERVER_DESCRIPTION}" \
          +server.url "${RUST_SERVER_URL}" \
          +server.seed ${RUST_SERVER_SEED} \
          +server.worldsize ${RUST_SERVER_WORLDSIZE} \
          +server.maxplayers ${RUST_SERVER_MAXPLAYERS} \
          +server.saveinterval ${RUST_SERVER_SAVE_INTERVAL} \
          ${RUST_SERVER_PASSWORD:+ +server.password "${RUST_SERVER_PASSWORD}"} \
          -logfile /srv/rust/logs/server.log
      '

volumes:
  rust-data:
