# ARK: Survival Evolved -- Lost Island
# Free official DLC map; ships inside app 376030 as ShooterGame/Content/Mods/LostIsland,
# so no extra download, no mod id, and no extra launch flags are needed.
#
# NOTE: `name:` is set explicitly. Without it, Compose derives the project name from the
# live directory (always ".../compose"), which lands this stack in the shared "compose"
# project alongside ark-ragnarok, ark-fjordur and rust -- a `docker compose down` in any
# one of those dirs can then reach across and take the others with it.
name: ark-lostisland

services:
  ark-lostisland:
    image: ich777/steamcmd:arkse
    container_name: ark-lostisland
    restart: unless-stopped
    network_mode: "host"

    ulimits:
      core: 0

    environment:
      - GAME_ID=376030
      - MAP=LostIsland
      - SERVER_NAME=NinjARK-LostIsland

      # --- CLUSTER SETTINGS ---
      # Mostly for consistency; real cluster magic is in GAME_PARAMS_EXTRA
      - ARKCLUSTERID=VersoCluster
      # -------------------------

      # PUBLIC SERVER: no join password. The image interpolates SRV_PWD straight into
      # `?ServerPassword=${SRV_PWD}?` on the launch command line, and an empty value there
      # means "no password". The command line WINS over GameUserSettings.ini, so the stale
      # ServerPassword= still sitting in that ini is overridden at every launch.
      # SERVER_PASSWORD is intentionally left in the SOPS env, unused, so re-gating the
      # server later is a one-line revert.
      - SRV_PWD=
      # NOT a join gate -- this is the admin/cheat password (`enablecheats <pw>` in console)
      # and, now that RCON is on below, it is also the RCON password. Never blank it.
      - SRV_ADMIN_PWD=${SERVER_ADMIN_PASSWORD}

      # Ports that don't collide with the rest of GamingHub:
      #   Island 7783/7784 q27019 | Ragnarok 7781/7782 q27021 | Fjordur 7785/7786 q27025
      #   Satisfactory holds 27027, so the "Map 5" query port in Traefik is NOT usable.
      # Lost Island: game 7787, raw 7788 (Port+1), query 27023
      # All three already have Traefik entryPoints + routers in hosts/traefik.
      # RCON: enabled on TCP 27024 for graceful `saveworld` before restarts + broadcasts.
      # Port scheme is query+1 so each map gets its own, collision-free:
      #   Island 27019->27020 | Ragnarok 27021->27022 | LostIsland 27023->27024 | Fjordur 27025->27026
      # Verified LAN-only: every ARK entryPoint published by Traefik is UDP, and the edge
      # publishes NO TCP in the 27xxx range at all, so 27024/tcp is not internet-reachable.
      # Keep it that way -- RCON auth is plaintext on the wire.
      - GAME_PARAMS=?MaxPlayers=20?QueryPort=27023?Port=7787?RCONEnabled=True?RCONPort=27024?SessionName=NinjARK-LostIsland?AltSaveDirectoryName=SavedArksLostIsland

      # Extra raw command-line flags
      # - cluster id for transfers
      # - NoTransferFromFiltering so uploads are allowed
      - GAME_PARAMS_EXTRA=-server -log -NoBattlEye -NoTransferFromFiltering -clusterid=VersoCluster -PublicIP=184.99.18.57 -PublicPort=7787

      # Skip SteamCMD's full file validation on every boot (parity with Island, which already
      # sets this). The image runs `app_update` unconditionally at each start either way --
      # there is no SKIPUPDATE in ich777/steamcmd:arkse -- so an ARK patch still lands on
      # restart and can break the 4 workshop mods in ActiveMods. Nothing here prevents that.
      - VALIDATE=false

      # -PublicIP / -PublicPort are REQUIRED here -- this was wrong when it was left unset.
      #
      # The earlier reasoning was "leave it unset and Steam uses the observed source IP".
      # That holds for a plainly NATed server, but NOT for this topology: inbound game UDP is
      # full-proxied by Traefik, so the server sees every query arriving from 10.0.2.5 (a
      # private LAN address) on a random ephemeral port. Confirmed by tcpdump on the host --
      # an external query from a WAN client landed as `10.0.2.5.57271 > 10.0.1.9.27023`.
      #
      # Direct A2S queries still answer fine, which is why the server looks healthy from the
      # outside. Steam LISTING is the part that breaks: the registration heartbeat egresses
      # the default route (not Traefik) and reaches Steam from 184.99.18.57:<random NAT port>,
      # which does not match the :27023 endpoint clients would query, so the server never gets
      # validated into the master list. Symptom: joinable by direct connect / favourites,
      # invisible in the in-game browser, and absent from third-party trackers.
      #
      # Use the WAN IP, NOT games-upd.ninjaprivacy.org -- that name is Cloudflare-proxied
      # (104.21.x / 172.67.x) and Cloudflare does not carry game UDP, so advertising it would
      # publish an address that cannot accept traffic.
      #
      # CAVEAT: 184.99.18.57 is a residential WAN IP and can change. If the server vanishes
      # from the browser again, re-check it first. The durable fix is a DNS-only (grey-cloud)
      # record, or removing Traefik from the game-UDP path entirely so no proxy rewrites the
      # source and -PublicIP stops being necessary at all.

    volumes:
      # Main ARK files for Lost Island
      - ../data/LostIsland/serverdata/serverfiles:/serverdata/serverfiles
      - ../logs/LostIsland/serverdata/logs:/serverdata/logs
      - ../backups/LostIsland:/backups

      # Shared cluster directory (same as Island / Ragnarok / Fjordur)
      - /home/arkse/cluster-shared:/serverdata/serverfiles/ShooterGame/Saved/clusters

    healthcheck:
      test: ["CMD-SHELL", "pgrep -f ShooterGameServer >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 30
