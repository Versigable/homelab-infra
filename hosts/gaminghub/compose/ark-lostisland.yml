# ARK: Survival Evolved -- Lost Island
# Free official DLC map; ships inside app 376030 as ShooterGame/Content/Mods/LostIsland,
# so no extra download, no mod id, and no extra launch flags are needed.
#
# NOTE: `name:` is set explicitly. Without it, Compose derives the project name from the
# live directory (always ".../compose"), which lands this stack in the shared "compose"
# project alongside ark-ragnarok, ark-fjordur and rust -- a `docker compose down` in any
# one of those dirs can then reach across and take the others with it.
name: ark-lostisland

services:
  ark-lostisland:
    image: ich777/steamcmd:arkse
    container_name: ark-lostisland
    restart: unless-stopped
    network_mode: "host"

    ulimits:
      core: 0

    environment:
      - GAME_ID=376030
      - MAP=LostIsland
      - SERVER_NAME=NinjARK-LostIsland

      # --- CLUSTER SETTINGS ---
      # Mostly for consistency; real cluster magic is in GAME_PARAMS_EXTRA
      - ARKCLUSTERID=VersoCluster
      # -------------------------

      # Same passwords as Island / Ragnarok / Fjordur
      - SRV_PWD=${SERVER_PASSWORD}
      - SRV_ADMIN_PWD=${SERVER_ADMIN_PASSWORD}

      # Ports that don't collide with the rest of GamingHub:
      #   Island 7783/7784 q27019 | Ragnarok 7781/7782 q27021 | Fjordur 7785/7786 q27025
      #   Satisfactory holds 27027, so the "Map 5" query port in Traefik is NOT usable.
      # Lost Island: game 7787, raw 7788 (Port+1), query 27023
      # All three already have Traefik entryPoints + routers in hosts/traefik.
      - GAME_PARAMS=?MaxPlayers=10?QueryPort=27023?Port=7787?RCONEnabled=False?SessionName=NinjARK-LostIsland?AltSaveDirectoryName=SavedArksLostIsland

      # Extra raw command-line flags
      # - cluster id for transfers
      # - NoTransferFromFiltering so uploads are allowed
      - GAME_PARAMS_EXTRA=-server -log -NoBattlEye -NoTransferFromFiltering -clusterid=VersoCluster

    volumes:
      # Main ARK files for Lost Island
      - ../data/LostIsland/serverdata/serverfiles:/serverdata/serverfiles
      - ../logs/LostIsland/serverdata/logs:/serverdata/logs
      - ../backups/LostIsland:/backups

      # Shared cluster directory (same as Island / Ragnarok / Fjordur)
      - /home/arkse/cluster-shared:/serverdata/serverfiles/ShooterGame/Saved/clusters

    healthcheck:
      test: ["CMD-SHELL", "pgrep -f ShooterGameServer >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 30
