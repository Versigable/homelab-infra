services:
  ark-ragnarok:
    image: ich777/steamcmd:arkse
    container_name: ark-ragnarok
    restart: unless-stopped
    network_mode: "host"

    environment:
      - GAME_ID=376030
      - MAP=Ragnarok
      - SERVER_NAME=NinjARK-Ragnarok

      # --- CLUSTER SETTINGS ---
      # Mostly for consistency; real cluster magic is in GAME_PARAMS_EXTRA
      - ARKCLUSTERID=VersoCluster
      # -------------------------

      # Same passwords as Island (change if you want)
      - SRV_PWD=${SERVER_PASSWORD}
      - SRV_ADMIN_PWD=${SERVER_ADMIN_PASSWORD}

      # Use ports that don't collide with Island / other games
      # (Island is on 7777 / 27019; SOTF is using 27016; so 7779 / 27021 are safe)
      - GAME_PARAMS=?MaxPlayers=10?QueryPort=27021?Port=7781?RCONEnabled=False?SessionName=NinjARK-Ragnarok?AltSaveDirectoryName=SavedArksRagnarok

      # Extra raw command-line flags
      # - cluster id for transfers
      # - NoTransferFromFiltering so uploads are allowed
      - GAME_PARAMS_EXTRA=-server -log -NoBattlEye -NoTransferFromFiltering -clusterid=VersoCluster

    volumes:
      # Main ARK files for Ragnarok
      - ../data/Ragnarok/serverdata/serverfiles:/serverdata/serverfiles
      - ../logs/Ragnarok/serverdata/logs:/serverdata/logs
      - ../backups/Ragnarok:/backups

      # Shared cluster directory (same as Island)
      - /home/arkse/cluster-shared:/serverdata/serverfiles/ShooterGame/Saved/clusters

    healthcheck:
      test: ["CMD-SHELL", "pgrep -f ShooterGameServer >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 30
