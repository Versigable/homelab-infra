# ninjaprivacy_org replica config. Keep in step with hosts/traefik/data/cloudflared/config.yml:
# a replica with different ingress serves different answers for the share of requests
# Cloudflare sends it. The only intended differences:
#   - service is https://10.0.2.5 (the Traefik VM), not https://traefik1, since these
#     guests don't share Traefik's Docker network;
#   - no credentials-file: the container authenticates with TUNNEL_TOKEN.
# Proxmox gets disableChunkedEncoding (fixed 2026-11-21 on both files together: the key
# used to be spelled noChunkedEncoding, which cloudflared ignored, so the console setting
# never applied). Both files keep warp-routing.enabled, which cloudflared has ignored
# since 2023.9 (the tunnel's private routes decide); `ingress validate` lists it as
# unused, and it's harmless.
tunnel: 37111c6c-064b-4381-9065-9313b50dffb3

ingress:
  - hostname: proxmox.ninjaprivacy.org
    service: https://10.0.2.5
    originRequest:
      noTLSVerify: true
      disableChunkedEncoding: true    # only for proxmox
  - hostname: proxmox-wolverine.ninjaprivacy.org
    service: https://10.0.2.5
    originRequest:
      noTLSVerify: true
      disableChunkedEncoding: true    # only for proxmox
  - hostname: "*.ninjaprivacy.org"
    service: https://10.0.2.5
    originRequest:
      noTLSVerify: true
  - service: http_status:404

warp-routing:
  enabled: true
