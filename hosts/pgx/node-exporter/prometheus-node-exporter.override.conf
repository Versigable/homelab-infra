# /etc/systemd/system/prometheus-node-exporter.service.d/pgx.conf
# The exporter binds 10.1.0.4, which only exists once the wired LAB link is up.
# Wait for the network and keep retrying, so a slow link at boot doesn't leave
# the exporter dead.
[Unit]
After=network-online.target
Wants=network-online.target

[Service]
Restart=always
RestartSec=10
