http:
  routers:
    jellyfin-router:
      rule: "Host(`jellyfin.ninjaprivacy.org`)"
      service: jellyfin-svc
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
  services:
    jellyfin-svc:
      loadbalancer:
        servers:
          - url: http://10.0.1.8:8096
        passHostHeader: true
