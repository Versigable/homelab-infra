http:
  middlewares:
    authentik-forward:
      forwardAuth:
        address: "https://10.0.1.3:9443/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
        tls:
          insecureSkipVerify: true
