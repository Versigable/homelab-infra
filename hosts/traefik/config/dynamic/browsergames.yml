http:
  routers:
    browsergames-router:
      rule: "Host(`games.ninjaprivacy.org`)"
      service: browsergames-svc
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
      middlewares:
        - authentik-forward
        - browsergames-coop-coep

  services:
    browsergames-svc:
      loadbalancer:
        servers:
          - url: http://10.0.1.5:8090
        passHostHeader: true

  middlewares:
    # EmulatorJS needs cross-origin isolation for SharedArrayBuffer (WASM threading,
    # WebGL, audio). The upstream nginx in the linuxserver/emulatorjs image sends
    # COOP+COEP, but Authentik's proxy outpost strips them on the way back. Re-add
    # them here so the browser keeps cross-origin isolation enabled. Without this,
    # the player loads but renders black.
    browsergames-coop-coep:
      headers:
        customResponseHeaders:
          Cross-Origin-Opener-Policy: "same-origin"
          Cross-Origin-Embedder-Policy: "require-corp"
