http:
  routers:
    browsergames-router:
      rule: "Host(`games.ninjaprivacy.org`)"
      service: browsergames-svc
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
      middlewares:
        - authentik-forward

  services:
    browsergames-svc:
      loadbalancer:
        servers:
          - url: http://10.0.1.5:8090
        passHostHeader: true
