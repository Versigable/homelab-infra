http:
  routers:
    gitlab-router:
      rule: "Host(`gitlab.ninjaprivacy.org`)"
      entryPoints: [websecure]
      tls: {}
      service: gitlab-svc
      # no forwardAuth here; GitLab handles OIDC itself
      # Constant background traffic: kept out of the access log (who page).
      observability:
        accessLogs: false

  services:
    gitlab-svc:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://10.0.1.13:8081
