http:
  routers:
    n8n-router:
      rule: "Host(`n8n.ninjaprivacy.org`)"
      service: n8n-svc
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
      middlewares:
        - authentik-forward

  services:
    n8n-svc:
      loadbalancer:
        servers:
          - url: http://10.0.1.5:5678
        passHostHeader: true
