http:
  routers:
    games-router:
      rule: "Host(`games.ninjaprivacy.org`)"
      service: games-svc
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
      # No authentik-forward — RomM has its own native login (bcrypt
      # passwords, session cookies, CSRF). Same pattern as jellyfin
      # and jellyseerr (see reference_jf-vm). Friend access via RomM
      # invite tokens (admin generates an invite link in the UI;
      # /api/users/register requires the token, no anonymous signup).
      # Operator paths /api/admin/* etc. are still gated by RomM's
      # own ADMIN role check.
      middlewares:
        - games-coop-coep

  services:
    # games.ninjaprivacy.org is intentionally NOT its own service.
    # It points at RomM (10.0.1.5:8080) and uses RomM's bundled
    # EmulatorJS player at /rom/<id>/ejs as the single-player
    # browser play surface. RomM here serves as the "platform" off
    # which users load games and play in their own browsers (all
    # WASM, all client-side rendering).
    #
    # arcade.ninjaprivacy.org points at the same RomM today, but is
    # earmarked for the future arcade-netplay-stack project (multiplayer,
    # server-side / GPU-rendered). When that project lands, RomM admin
    # will move to a dedicated hostname (likely library.ninjaprivacy.org)
    # and arcade.* will get its own backend. games.* stays here.
    games-svc:
      loadbalancer:
        servers:
          - url: http://10.0.1.5:8080
        passHostHeader: true

  middlewares:
    # EmulatorJS embedded in RomM needs cross-origin isolation for
    # SharedArrayBuffer + WASM threading. RomM's nginx doesn't set
    # COOP/COEP, and Authentik wouldn't preserve them anyway.
    #
    # COEP value choice: credentialless, NOT require-corp.
    # require-corp blocks RomM's bundle entirely because RomM's
    # index.html declares <script crossorigin src="/assets/...">
    # and RomM's nginx doesn't emit Cross-Origin-Resource-Policy
    # on its static asset responses, so the browser refuses to load
    # the bundle and the page renders a blank white screen with a
    # couple of broken image icons. credentialless still gives full
    # cross-origin isolation (SharedArrayBuffer works) but allows
    # cross-origin no-cors fetches (RomM's bundle, IGDB box art,
    # etc.) without requiring CORP, at the cost of stripping
    # credentials on those fetches — fine for public assets.
    #
    # Cross-Origin-Resource-Policy: same-origin is set as
    # belt-and-suspenders so RomM's own same-origin assets
    # are explicitly allowed under any future stricter COEP.
    games-coop-coep:
      headers:
        customResponseHeaders:
          Cross-Origin-Opener-Policy: "same-origin"
          Cross-Origin-Embedder-Policy: "credentialless"
          Cross-Origin-Resource-Policy: "same-origin"
