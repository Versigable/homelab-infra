http:
  routers:
    romm-router:
      rule: "Host(`arcade.ninjaprivacy.org`)"
      service: romm-svc
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
      # No authentik-forward — RomM uses its own native login (bcrypt
      # passwords, session cookies, CSRF). Same pattern as jellyfin
      # and jellyseerr (see reference_jf-vm). The same RomM also
      # serves games.ninjaprivacy.org via games.yml; that route adds
      # a games-coop-coep middleware for the EJS player. arcade.* is
      # the library/admin door, so no COOP/COEP needed here.
      # Admin paths still gated by RomM's own ADMIN role check.

  services:
    romm-svc:
      loadbalancer:
        servers:
          - url: http://10.0.1.5:8080
        passHostHeader: true
