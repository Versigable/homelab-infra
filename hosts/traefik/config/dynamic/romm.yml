http:
  routers:
    romm-router:
      rule: "Host(`arcade.ninjaprivacy.org`)"
      service: romm-svc
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
      # No authentik-forward — RomM uses its own native login (bcrypt
      # passwords, session cookies, CSRF). Same pattern as jellyfin
      # and jellyseerr (see reference_jf-vm).
      # Admin paths still gated by RomM's own ADMIN role check.
      #
      # COOP/COEP (2026-09-06): this route deliberately had no COOP/COEP,
      # on the reasoning that arcade.* is only the library/admin door.
      # That was wrong. The same
      # RomM backend serves the EmulatorJS player at /rom/<id>/ejs on
      # BOTH hostnames, so a game launched from arcade.* loaded without
      # SharedArrayBuffer and the threaded PPSSPP build silently fell
      # back to single-threaded. PSP ran slow and choppy while the
      # lighter PS1/Saturn cores still felt fine - which looked like a
      # ROM-format problem rather than a missing-header problem.
      # Reuses the middleware defined in games.yml.
      middlewares:
        - games-coop-coep@file

  services:
    romm-svc:
      loadbalancer:
        servers:
          - url: http://10.0.1.5:8080
        passHostHeader: true
