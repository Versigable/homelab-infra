http:
  routers:
    # RomM emulator streaming: the webstation container (Selkies desktop +
    # romm-broker) on jf, served under /streaming on RomM's own hostnames.
    # Same origin is what lets RomM's player iframe it: both RomM hosts send
    # COEP credentialless, and a cross-origin iframe without COEP of its own
    # is blocked. The webstation's SUBFOLDER is /streaming/, so no path rewrite.
    #
    # Access layers, outermost first:
    #   1. romm-session-auth: only browsers signed in to RomM get through.
    #   2. The broker refuses stream/desktop/file sockets without the
    #      per-session stream_token RomM hands the claiming user at launch.
    #   3. The broker API wants RomM's X-Broker-Secret. RomM calls it over the
    #      LAN (broker_host http://10.0.1.8:3010), not through this route.
    games-streaming-router:
      rule: "Host(`games.ninjaprivacy.org`) && PathPrefix(`/streaming`)"
      service: romm-webstation-svc
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
      middlewares:
        - romm-session-auth
        - games-coop-coep@file

    arcade-streaming-router:
      rule: "Host(`arcade.ninjaprivacy.org`) && PathPrefix(`/streaming`)"
      service: romm-webstation-svc
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
      middlewares:
        - romm-session-auth
        - games-coop-coep@file

  services:
    # 2026-10-12: CPU-only spike, run by hand at /opt/romm-webstation on jf.
    romm-webstation-svc:
      loadbalancer:
        servers:
          - url: http://10.0.1.8:3010
        passHostHeader: true

  middlewares:
    # Traefik replays each request's headers (cookies included) as a GET to
    # RomM. /api/users/me answers 200 for a signed-in session and 401
    # otherwise, so RomM's own login gates the webstation. Friends have RomM
    # accounts, not Authentik ones, which is why this isn't authentik-forward.
    romm-session-auth:
      forwardAuth:
        address: "http://10.0.1.5:8080/api/users/me"
