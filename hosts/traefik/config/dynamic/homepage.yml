http:
  routers:
    homepage-router:
      rule: "Host(`hub.ninjaprivacy.org`)"
      service: homepage-svc
      entrypoints: [websecure]
      tls: {}
      # Operators only: the Authentik wildcard application behind this
      # middleware is bound to the operators group. Homepage also has its own
      # Authentik login (OIDC application `hub`), which covers the LAN port
      # that bypasses Traefik. Keep both; never remove the middleware here.
      middlewares:
        - authentik-forward

  services:
    homepage-svc:
      loadbalancer:
        servers:
          - url: http://10.0.1.5:3003
        passHostHeader: true
