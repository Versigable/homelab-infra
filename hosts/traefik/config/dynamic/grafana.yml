http:
  routers:
    grafana-router:
      rule: "Host(`grafana.ninjaprivacy.org`)"
      service: grafana-svc
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
      middlewares:
        - authentik-forward

  services:
    grafana-svc:
      loadbalancer:
        servers:
          # Monitoring LXC 302 on wolverine — cross-site via WG tunnel
          - url: http://10.1.0.5:3000
        passHostHeader: true
