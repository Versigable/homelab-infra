name: nextcloud

# Nextcloud + Collabora on VM 116 (phoenix), which replaced LXC 110. The guest is built by
# iac/ (Terraform + Ansible); this stack is deployed by hosts/nextcloud/scripts/deploy.sh,
# which writes NC_BIND_IP and NC_DATA_DIR for the host into .env.
# Vault: 1-Projects/nextcloud. Routes: hosts/traefik/config/dynamic/nextcloud.yml
#   cloud.ninjaprivacy.org  -> web        10.0.1.16:8080
#   office.ninjaprivacy.org -> collabora  10.0.1.16:9980
#
# User files live on TrueNAS (Twelve_TB_RAIDZ1/nextcloud), NFS-mounted inside the VM at
# /srv/nextcloud-data (not through phoenix: 5-Decisions/2026-10-23_nextcloud-vm-instead-of-lxc).
# Everything else (app code, config.php, Postgres) is under ../data on the VM disk, which
# PBS backs up nightly.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-nextcloud: &nextcloud
  image: nextcloud:35.0.1-fpm
  restart: unless-stopped
  logging: *logging
  networks: [nextcloud-net1]
  volumes:
    - ../data/html:/var/www/html
    - ${NC_DATA_DIR:?}:/var/www/data
  # The entrypoint copies the app into /var/www/html as root, then drops to www-data.
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]

services:
  db:
    image: postgres:18.6-alpine
    container_name: nextcloud-db
    restart: unless-stopped
    logging: *logging
    networks: [nextcloud-net1]
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Postgres 18 images keep data in /var/lib/postgresql/18/docker; mount the parent.
      - ../data/postgres:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 10
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]

  redis:
    image: redis:7.4.11-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    logging: *logging
    networks: [nextcloud-net1]
    # Cache and file locking only, nothing to persist. Running as the image's redis
    # user skips the entrypoint's chown/su-exec, so no capabilities are needed.
    user: "999"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no"]
    cap_drop: [ALL]

  app:
    <<: *nextcloud
    container_name: nextcloud-app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      collabora:
        condition: service_started
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # The break-glass admin (/login?direct=1). The first install creates it; the
      # settings hook puts the user in the breakglass group, which must use TOTP.
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_DATA_DIR: /var/www/data
      # trusted_domains comes from the settings hook only.
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
      PHP_MEMORY_LIMIT: 1G
      PHP_UPLOAD_LIMIT: 16G
      # Read by config/hooks/before-starting/10-settings.sh
      NEXTCLOUD_OIDC_CLIENT_ID: ${NEXTCLOUD_OIDC_CLIENT_ID}
      NEXTCLOUD_OIDC_CLIENT_SECRET: ${NEXTCLOUD_OIDC_CLIENT_SECRET}
    volumes:
      - ../data/html:/var/www/html
      - ${NC_DATA_DIR:?}:/var/www/data
      - ../config/hooks:/docker-entrypoint-hooks.d:ro

  cron:
    <<: *nextcloud
    container_name: nextcloud-cron
    entrypoint: /cron.sh
    depends_on: [app]

  web:
    image: nginxinc/nginx-unprivileged:1.30.5-alpine
    container_name: nextcloud-web
    restart: unless-stopped
    logging: *logging
    networks: [nextcloud-net1]
    depends_on: [app]
    ports:
      - "${NC_BIND_IP:?}:8080:8080"
    volumes:
      - ../config/nginx/nextcloud.conf:/etc/nginx/conf.d/default.conf:ro
      - ../data/html:/var/www/html:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]

  collabora:
    image: collabora/code:26.04.4.2.1
    container_name: nextcloud-collabora
    restart: unless-stopped
    logging: *logging
    networks: [nextcloud-net1]
    ports:
      - "${NC_BIND_IP:?}:9980:9980"
    environment:
      aliasgroup1: https://cloud.ninjaprivacy.org:443
      server_name: office.ninjaprivacy.org
      username: ${COLLABORA_ADMIN_USER}
      password: ${COLLABORA_ADMIN_PASSWORD}
      dictionaries: en_US
      extra_params: --o:ssl.enable=false --o:ssl.termination=true
    # coolforkit builds a chroot jail per document; these are the capabilities it
    # reports using (checked in this LXC on 2026-10-17).
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SYS_CHROOT]

networks:
  nextcloud-net1:
    name: nextcloud-net1
    ipam:
      config:
        # Fixed so the settings hook can list it as a trusted proxy.
        - subnet: 172.30.110.0/24
