# Mosquitto for Home Assistant (LXC 112). Installed by deploy.sh; a change here restarts
# the broker. The password file is generated from SOPS on every deploy.

# Inside the container. Published on 127.0.0.1 only, and Zigbee2MQTT reaches it on the
# compose network.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Retained messages (Home Assistant discovery, device state) survive a restart.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S
