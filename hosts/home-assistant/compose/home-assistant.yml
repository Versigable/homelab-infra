name: home-assistant

# Home Assistant + Mosquitto (+ Zigbee2MQTT once the radio is in), one stack per house:
# X-Mansion on LXC 112 (phoenix), Wolverine on LXC 303 (wolverine). The LXCs are built by
# iac/ (Terraform + Ansible); this stack is deployed by hosts/home-assistant/scripts/deploy.sh
# with the house's instances/<house>/ settings. Vault: 1-Projects/home-assistant.
#   Home Assistant   <HA_IP>:8123    host network
#   Mosquitto        127.0.0.1:1883  Home Assistant only; Zigbee2MQTT uses the bridge
#   Zigbee2MQTT UI   <HA_IP>:8080    profile "zigbee", off until the house's zigbee.env names the radio
#   Parakeet (STT)   127.0.0.1:10300 profile "voice", Wyoming speech-to-text, on CPU
#   Kokoro (TTS)     127.0.0.1:10210 profile "voice", Wyoming text-to-speech, on CPU
# HA_IP comes from the house's instance.env, which deploy.sh installs as this project's .env;
# HA_VOICE there switches the voice profile on per house.
#
# Everything lives under ../data on the LXC disk, which PBS backs up nightly (all guests).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.2
    container_name: home-assistant
    restart: unless-stopped
    logging: *logging
    # Home Assistant opens connections to devices (the Voice PEs' ESPHome API) and hands
    # them URLs on its own address, so it shares the LXC's network.
    network_mode: host
    depends_on: [mosquitto]
    volumes:
      - ../data/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    # Root in the container, but with no capabilities: no raw sockets or interface changes
    # on the host network. (DHCP discovery needs NET_RAW and stays off; the lab has no DHCP.)
    cap_drop: [ALL]

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: home-assistant-mosquitto
    restart: unless-stopped
    logging: *logging
    networks: [home-assistant-net]
    # The image's own uid, so its entrypoint skips the chown and needs no capabilities.
    user: "1883:1883"
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      # mosquitto.conf, acl and passwd, written by deploy.sh
      - ../config/mosquitto:/mosquitto/config:ro
      - ../data/mosquitto:/mosquitto/data
    cap_drop: [ALL]

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:2.14.2
    container_name: home-assistant-zigbee2mqtt
    profiles: [zigbee]
    restart: unless-stopped
    logging: *logging
    networks: [home-assistant-net]
    depends_on: [mosquitto]
    # No user in this LXC has 1884 (1000 is ansible). The radio is on the network, so no
    # device or dialout group is needed.
    user: "1884:1884"
    ports:
      - "${HA_IP:?HA_IP comes from instances/<house>/instance.env, installed as .env by deploy.sh}:8080:8080"
    volumes:
      - ../data/zigbee2mqtt:/app/data
    cap_drop: [ALL]

  # Local voice, on CPU next to Home Assistant and not on the PGX, so a PGX hang can't take
  # out "lights off" (vault: 5-Decisions/2026-10-18_home-assistant-platform). Home Assistant
  # reaches both on loopback through its Wyoming integration; deploy.sh waits for them to answer.
  # Both run ONNX Runtime, which counts the host's CPUs instead of the LXC's, so both load
  # config/onnxruntime/sitecustomize.py (via PYTHONPATH) to size its thread pool to the LXC.
  # Measured 2026-10-25: Kokoro went from about 2x to 0.6x real time on 2 cores.
  parakeet:
    image: ghcr.io/tboby/wyoming-onnx-asr:v0.5.0
    container_name: home-assistant-parakeet
    profiles: [voice]
    restart: unless-stopped
    logging: *logging
    networks: [home-assistant-net]
    # NVIDIA Parakeet TDT 0.6B v2 (English), int8: about 0.7 GB, small enough for the LXC's RAM.
    command: ["--uri", "tcp://0.0.0.0:10300", "--model-en", "nemo-parakeet-tdt-0.6b-v2", "--quantization", "int8"]
    # The image runs as root by default; a fixed uid owns only its data dir. HOME points
    # there too, so the model download's cache has somewhere to write.
    user: "1886:1886"
    environment:
      HOME: /data
      PYTHONPATH: /opt/onnxruntime-threads
    ports:
      - "127.0.0.1:10300:10300"
    volumes:
      - ../data/parakeet:/data
      - ../config/onnxruntime:/opt/onnxruntime-threads:ro
    cap_drop: [ALL]

  # Kokoro-82M through kokoro-onnx; streams sentence by sentence. Voice af_bella, picked by
  # MetaVersig by ear on 2026-10-25 (over Piper's voices). A small community image, so it's
  # pinned by digest; the model is baked in, checksum-verified at build time.
  kokoro:
    image: nordwestt/kokoro-wyoming:v1.1.0@sha256:5071dfe6a7c2c599c51677da698aebecdf8bd8dbab2d5345e99bb50d878a33f9
    container_name: home-assistant-kokoro
    profiles: [voice]
    restart: unless-stopped
    logging: *logging
    networks: [home-assistant-net]
    command: ["--voice", "af_bella"]
    # Root in the container, because the image's model file is root-only (0600); no
    # capabilities, and the LXC is unprivileged.
    environment:
      PYTHONPATH: /opt/onnxruntime-threads
    ports:
      - "127.0.0.1:10210:10210"
    volumes:
      - ../config/onnxruntime:/opt/onnxruntime-threads:ro
    cap_drop: [ALL]

networks:
  home-assistant-net:
    name: home-assistant-net
    ipam:
      config:
        - subnet: 172.30.112.0/24
