global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    monitor: 'homelab'
    site: 'wolverine'

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # ============================================================
  # Self-scrape (Phase 1.3 — minimum viable; everything else is
  # added in Phase 1.4 once node_exporter is on phoenix/rogue/
  # wolverine and pve-exporter is wired to the Proxmox API.)
  # ============================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: /metrics

  # ============================================================
  # Host-level node metrics (Phase 1.4 — phoenix + rogue)
  #
  # Wolverine (10.1.0.2:9100) is intentionally NOT scraped here.
  # node_exporter is installed on wolverine and listens on *:9100,
  # but TCP from the monitoring LXC (10.1.0.5) to wolverine over
  # vmbr1 is asymmetrically dropped — SYN goes out, SYN+ACK is
  # generated but never reaches the LXC's eth0. ICMP works fine,
  # cross-site (phoenix/rogue) works fine. Diagnosed but not yet
  # rooted; see the wolverine-LXC-intra-lab feedback memory.
  # Wolverine basic state IS visible via the pve-exporter job
  # below (PVE API path, which goes through pfSense, not vmbr1).
  # ============================================================
  - job_name: 'node'
    static_configs:
      - targets: ['10.0.1.2:9100']
        labels:
          instance: phoenix
          site: x-mansion
      - targets: ['10.0.2.1:9100']
        labels:
          instance: rogue
          site: x-mansion

  # ============================================================
  # Per-app exporters (Phase 2)
  # ============================================================
  - job_name: 'authentik-server'
    static_configs:
      - targets: ['10.0.1.3:9300']
        labels:
          instance: authentik-server
          site: x-mansion

  # Note: Authentik 2025.2.4's worker doesn't expose Prometheus metrics by
  # default (Celery process, no native endpoint on 9301). Server's metrics
  # cover the meaningful auth-flow signals. Revisit with a celery-exporter
  # sidecar if queue/task visibility becomes useful.

  - job_name: 'traefik'
    static_configs:
      - targets: ['10.0.2.5:8082']
        labels:
          instance: traefik
          site: x-mansion

  # qBittorrent metrics via esanchezm/prometheus-qbittorrent-exporter sidecar
  # in wg-proton's netns (see hosts/jellyfin/compose/arr.yml). Exporter port
  # 8000 is published through wg-proton, so the scrape target is the jf VM's
  # IP on its LAN-side interface, not the VPN exit IP.
  - job_name: 'qbittorrent'
    static_configs:
      - targets: ['10.0.1.8:8000']
        labels:
          instance: qbittorrent
          site: x-mansion

  # ============================================================
  # Proxmox VE cluster metrics via pve-exporter (Phase 1.5)
  # Cluster query: target each PVE node; results flow through the
  # pve-exporter container and are labeled with the queried node.
  # ============================================================
  - job_name: 'pve'
    metrics_path: /pve
    params:
      module: [default]
      cluster: ['1']
      node: ['1']
    static_configs:
      - targets:
          - 10.0.1.2  # phoenix
          - 10.0.2.1  # rogue
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221
