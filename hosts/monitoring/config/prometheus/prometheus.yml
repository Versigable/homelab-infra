global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    monitor: 'homelab'
    site: 'wolverine'

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # ============================================================
  # Self-scrape (Phase 1.3 — minimum viable; everything else is
  # added in Phase 1.4 once node_exporter is on phoenix/rogue/
  # wolverine and pve-exporter is wired to the Proxmox API.)
  # ============================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # ntfy metrics listener (separate port from the public API). If ntfy goes
  # down, ScrapeTargetDown reports it to Discord.
  - job_name: 'ntfy'
    static_configs:
      - targets: ['ntfy:9095']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: /metrics

  # ============================================================
  # Host-level node metrics (phoenix, rogue, wolverine, jf, PGX)
  #
  # Wolverine (10.1.0.2) was left out from 2026-05 to 2026-11: TCP from
  # this LXC to wolverine's own LAB IP stalled while ping worked. Cause
  # (fixed 2026-11-21): wolverine's policy-routing table 100 held only
  # `default via 10.1.0.1`, so the host's replies to LAB guests went to
  # pfSense, which dropped them (no state). Table 100 now has an on-link
  # 10.1.0.0/16 route on vmbr1. See infrastructure-overview, wolverine.
  # ============================================================
  - job_name: 'node'
    static_configs:
      - targets: ['10.0.1.2:9100']
        labels:
          instance: phoenix
          site: x-mansion
      - targets: ['10.0.2.1:9100']
        labels:
          instance: rogue
          site: x-mansion
      - targets: ['10.1.0.2:9100']
        labels:
          instance: wolverine
          site: wolverine
      # jf (VM 108): prometheus-node-exporter from apt, like phoenix and rogue.
      - targets: ['10.0.1.8:9100']
        labels:
          instance: jf
          site: x-mansion
      # ThinkStation PGX (co-owned with Emilio and Dave; installed by hand from
      # hosts/pgx/node-exporter/, no CI).
      # Besides host metrics it carries a textfile from pgx-metrics.sh: GB10
      # GPU (pgx_gpu_*) and vLLM's own counters (vllm:*, pgx_vllm_up).
      # Being in this job, it gets the host-health alerts too (MemoryHigh is
      # the one that matters on unified memory).
      - targets: ['10.1.0.4:9100']
        labels:
          instance: pgx
          site: wolverine

  # ============================================================
  # Per-app exporters (Phase 2)
  # ============================================================
  - job_name: 'authentik-server'
    static_configs:
      - targets: ['10.0.1.3:9300']
        labels:
          instance: authentik-server
          site: x-mansion

  # Note: Authentik 2025.2.4's worker doesn't expose Prometheus metrics by
  # default (Celery process, no native endpoint on 9301). Server's metrics
  # cover the meaningful auth-flow signals. Revisit with a celery-exporter
  # sidecar if queue/task visibility becomes useful.

  - job_name: 'traefik'
    static_configs:
      - targets: ['10.0.2.5:8082']
        labels:
          instance: traefik
          site: x-mansion

  # qBittorrent metrics via esanchezm/prometheus-qbittorrent-exporter sidecar
  # in gluetun's netns (see hosts/jellyfin/compose/arr.yml). Exporter port is
  # 8001 (not 8000 — that's gluetun's HTTP control server). Published through
  # gluetun's `ports:` so the scrape target is the jf VM's LAN IP, not the VPN
  # exit IP.
  - job_name: 'qbittorrent'
    static_configs:
      - targets: ['10.0.1.8:8001']
        labels:
          instance: qbittorrent
          site: x-mansion

  # Containers on jf via cAdvisor (hosts/jellyfin/compose/exporters.yml):
  # Jellyfin, the arr stack and the three RomM webstations. Port 8098 because
  # qBittorrent's web UI holds 8080 on jf. Series carry `name` (container) and
  # the compose project/service labels.
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['10.0.1.8:8098']
        labels:
          instance: jf
          site: x-mansion

  # jf's RTX 3060 Ti via nvidia_gpu_exporter (same compose file): GPU and
  # NVENC use, VRAM, encoder sessions, power, temperature. Shared by Jellyfin,
  # the RomM webstations and Sunshine.
  - job_name: 'nvidia-gpu'
    static_configs:
      - targets: ['10.0.1.8:9835']
        labels:
          instance: jf
          site: x-mansion

  # ============================================================
  # Proxmox VE cluster metrics via pve-exporter (Phase 1.5)
  # Cluster query: target each PVE node; results flow through the
  # pve-exporter container and are labeled with the queried node.
  # ============================================================
  - job_name: 'pve'
    metrics_path: /pve
    params:
      module: [default]
      cluster: ['1']
      node: ['1']
    static_configs:
      - targets:
          - 10.0.1.2  # phoenix
          - 10.0.2.1  # rogue
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221
