name: monitoring

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.external-url=http://10.1.0.5:9090"
    volumes:
      # Directory bind-mount (not per-file) to avoid Docker's stale-inode
      # caching when deploy.sh atomically replaces config files via `install`.
      # File-level bind mounts hold a reference to the original inode and
      # don't see post-deploy file replacements until the container restarts.
      - ../config/prometheus:/etc/prometheus:ro
      - ../data/prometheus:/prometheus
    ports:
      - "10.1.0.5:9090:9090"
    networks: [monitoring-net]
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: alertmanager
    restart: unless-stopped
    user: "65534:65534"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=http://10.1.0.5:9093"
    volumes:
      # Directory bind-mount (see prometheus block for rationale).
      - ../config/alertmanager:/etc/alertmanager:ro
      - ../data/alertmanager:/alertmanager
    ports:
      - "10.1.0.5:9093:9093"
    networks: [monitoring-net]
    logging: *logging

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped
    user: "472:472"
    environment:
      GF_SERVER_ROOT_URL: "https://grafana.ninjaprivacy.org"
      GF_SERVER_DOMAIN: grafana.ninjaprivacy.org
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Authentik forward-auth via Traefik mw-authentik (Phase 1.9).
      # Headers populated by the authentik-forward middleware.
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-authentik-username
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_HEADERS: "Email:X-authentik-email Name:X-authentik-name Groups:X-authentik-groups"
      # CRITICAL: only accept proxy auth from Traefik's IP. Without this,
      # any LAN host could spoof X-authentik-username and bypass auth on
      # the Grafana port (10.1.0.5:3000 is LAN-reachable).
      GF_AUTH_PROXY_WHITELIST: 10.0.2.5
      # Disable signup for non-proxy auth (defense in depth).
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Auto-signup gives Viewer (safe default — your Authentik covers
      # *.ninjaprivacy.org so anyone with Jellyfin etc. access could sign
      # into Grafana too). Promote MetaVersig to Admin once via the
      # Grafana UI (log in as the local `admin` with the random password
      # in monitoring.env.sops, then Server Admin → Users → promote).
      GF_AUTH_PROXY_AUTO_SIGN_UP_ROLE: Viewer
    volumes:
      - ../data/grafana:/var/lib/grafana
      # Provisioning configs (datasources, dashboard providers) — picked up
      # at startup. See ../config/grafana/provisioning/ for what's here.
      - ../config/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "10.1.0.5:3000:3000"
    networks: [monitoring-net]
    depends_on:
      prometheus:
        condition: service_started
    logging: *logging

  # Proxmox VE exporter — queries the PVE API for cluster/node/guest metrics.
  # Token auth: monitoring@pve!monitoring with PVEAuditor role (read-only).
  # Scrape pattern: prometheus targets the PVE node IPs and uses
  # ?target=<ip> param; pve-exporter queries that node's API and translates.
  pve-exporter:
    image: prompve/prometheus-pve-exporter:3.5.5
    container_name: pve-exporter
    restart: unless-stopped
    environment:
      PVE_USER: ${PVE_USER}
      PVE_TOKEN_NAME: ${PVE_TOKEN_NAME}
      PVE_TOKEN_VALUE: ${PVE_TOKEN_VALUE}
      PVE_VERIFY_SSL: "false"
    ports:
      - "10.1.0.5:9221:9221"
    networks: [monitoring-net]
    logging: *logging

  # External heartbeat sidecar — the "monitor of last resort". See
  # 5-Decisions/2026-05-02_monitoring-stack-shape for the rationale.
  #
  # It now VERIFIES THE STACK before pinging. The previous version claimed to ping
  # "while the stack is healthy" but never checked anything — it pinged
  # unconditionally, so it only ever proved itself alive. That is exactly how
  # prometheus and alertmanager stayed dead for 74 days (2026-06-25 → 2026-09-07)
  # while Healthchecks.io showed a continuous green: the heartbeat container was
  # up and happily reporting "ping ok" the entire time.
  #
  # Now: ping only when prometheus AND alertmanager both answer /-/healthy, and
  # actively hit the /fail endpoint when they do not, so the alert fires
  # immediately rather than waiting out the grace period.
  heartbeat:
    image: curlimages/curl:8.11.0
    container_name: heartbeat
    restart: unless-stopped
    environment:
      HEALTHCHECKS_PING_URL: ${HEALTHCHECKS_PING_URL}
    entrypoint:
      - sh
      - -c
      - |
        echo "heartbeat starting; verifying stack health every 5 min"
        while true; do
          if curl -fsS --max-time 10 -o /dev/null "http://prometheus:9090/-/healthy" && curl -fsS --max-time 10 -o /dev/null "http://alertmanager:9093/-/healthy"; then
            if curl -fsS --max-time 30 -o /dev/null "$$HEALTHCHECKS_PING_URL"; then
              echo "$(date -u +%FT%TZ) stack healthy; ping ok"
            else
              echo "$(date -u +%FT%TZ) stack healthy; ping FAILED"
            fi
          else
            echo "$(date -u +%FT%TZ) stack UNHEALTHY (prometheus/alertmanager not answering) -- signalling failure"
            curl -fsS --max-time 30 -o /dev/null "$$HEALTHCHECKS_PING_URL/fail" || true
          fi
          sleep 300
        done
    networks: [monitoring-net]
    logging: *logging

networks:
  monitoring-net:
    driver: bridge
