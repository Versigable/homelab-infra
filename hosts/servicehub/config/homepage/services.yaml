# ------------------------------- Infra tab -------------------------------

- Health:
    - Disks:
        icon: mdi-harddisk
        href: https://grafana.ninjaprivacy.org
        description: SMART, 8 disks on phoenix and rogue
        widget:
          type: prometheusmetric
          url: http://10.1.0.5:9090
          refreshInterval: 60000
          metrics:
            - label: Failing
              query: sum(1 - smartmon_device_smart_healthy)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Pending
              query: sum(smartmon_current_pending_sector_raw_value) + sum(smartmon_offline_uncorrectable_raw_value)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Realloc 7d
              query: sum(max_over_time(smartmon_reallocated_sector_ct_raw_value[7d]) - min_over_time(smartmon_reallocated_sector_ct_raw_value[7d]))
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: NVMe wear
              query: max(nvme_percentage_used_ratio)
              format:
                type: percent
                scale: 100
                options:
                  maximumFractionDigits: 0
          highlight:
            Failing:
              numeric:
                - level: danger
                  when: gte
                  value: 1
                - level: good
                  when: eq
                  value: 0
              string:
                - level: warn
                  when: equals
                  value: "-"
            Pending:
              numeric:
                - level: danger
                  when: gte
                  value: 1
                - level: good
                  when: eq
                  value: 0
              string:
                - level: warn
                  when: equals
                  value: "-"
            Realloc 7d:
              numeric:
                - level: warn
                  when: gte
                  value: 1
                - level: good
                  when: eq
                  value: 0
              string:
                - level: warn
                  when: equals
                  value: "-"
            NVMe wear:
              numeric:
                - level: danger
                  when: gte
                  value: 90
                - level: warn
                  when: gte
                  value: 70
              string:
                - level: warn
                  when: equals
                  value: "-"
    - Temps:
        icon: mdi-thermometer
        href: https://grafana.ninjaprivacy.org
        description: Hottest sensor of each kind
        widget:
          type: prometheusmetric
          url: http://10.1.0.5:9090
          refreshInterval: 30000
          metrics:
            - label: phoenix CPU
              query: max(node_hwmon_temp_celsius{instance="phoenix"} * on (instance, chip) group_left node_hwmon_chip_names{chip_name="k10temp"})
              format:
                type: number
                suffix: " °C"
                options:
                  maximumFractionDigits: 0
            - label: rogue CPU
              query: max(node_hwmon_temp_celsius{instance="rogue"} * on (instance, chip) group_left node_hwmon_chip_names{chip_name="k10temp"})
              format:
                type: number
                suffix: " °C"
                options:
                  maximumFractionDigits: 0
            - label: NVMe
              query: max(nvme_temperature_celsius)
              format:
                type: number
                suffix: " °C"
                options:
                  maximumFractionDigits: 0
            - label: HDD
              query: max(smartmon_temperature_celsius_raw_value)
              format:
                type: number
                suffix: " °C"
                options:
                  maximumFractionDigits: 0
          highlight:
            phoenix CPU:
              numeric:
                - level: danger
                  when: gte
                  value: 95
                - level: warn
                  when: gte
                  value: 85
              string:
                - level: warn
                  when: equals
                  value: "-"
            rogue CPU:
              numeric:
                - level: danger
                  when: gte
                  value: 95
                - level: warn
                  when: gte
                  value: 85
              string:
                - level: warn
                  when: equals
                  value: "-"
            NVMe:
              numeric:
                - level: danger
                  when: gte
                  value: 80
                - level: warn
                  when: gte
                  value: 70
              string:
                - level: warn
                  when: equals
                  value: "-"
            HDD:
              numeric:
                - level: danger
                  when: gte
                  value: 55
                - level: warn
                  when: gte
                  value: 50
              string:
                - level: warn
                  when: equals
                  value: "-"
    - Backups:
        icon: mdi-backup-restore
        href: https://proxmox.ninjaprivacy.org
        description: Proxmox Backup Server, every guest daily
        widget:
          type: prometheusmetric
          url: http://10.1.0.5:9090
          refreshInterval: 60000
          metrics:
            - label: Oldest
              query: (time() - min(max by (vmid) (pve_backup_last_success_timestamp_seconds))) / 3600
              format:
                type: number
                suffix: " h"
                options:
                  maximumFractionDigits: 0
            - label: Missing
              query: sum(max by (vmid) (pve_backup_guest_without_backup))
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Guests
              query: count(max by (vmid) (pve_backup_last_success_timestamp_seconds))
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Checked
              query: (time() - max(pve_backup_metrics_last_run_timestamp_seconds)) / 60
              format:
                type: number
                suffix: " min ago"
                options:
                  maximumFractionDigits: 0
          highlight:
            Oldest:
              numeric:
                - level: danger
                  when: gte
                  value: 60
                - level: warn
                  when: gte
                  value: 36
                - level: good
                  when: lt
                  value: 36
              string:
                - level: warn
                  when: equals
                  value: "-"
            Missing:
              numeric:
                - level: danger
                  when: gte
                  value: 1
                - level: good
                  when: eq
                  value: 0
              string:
                - level: warn
                  when: equals
                  value: "-"
            Guests:
              string:
                - level: warn
                  when: equals
                  value: "-"
            Checked:
              numeric:
                - level: danger
                  when: gte
                  value: 180
                - level: warn
                  when: gte
                  value: 60
              string:
                - level: warn
                  when: equals
                  value: "-"
    - Certificate:
        icon: mdi-certificate
        href: https://traefik.ninjaprivacy.org/dashboard/
        description: "*.ninjaprivacy.org, Let's Encrypt via Traefik"
        widget:
          type: prometheusmetric
          url: http://10.1.0.5:9090
          refreshInterval: 300000
          metrics:
            - label: Days left
              query: (min(traefik_tls_certs_not_after) - time()) / 86400
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Expires
              query: min(traefik_tls_certs_not_after)
              format:
                type: date
                scale: 1000
                options:
                  dateStyle: medium
          highlight:
            Days left:
              numeric:
                - level: danger
                  when: lt
                  value: 10
                - level: warn
                  when: lt
                  value: 25
                - level: good
                  when: gte
                  value: 25
              string:
                - level: warn
                  when: equals
                  value: "-"
    - VPN:
        icon: mdi-vpn
        href: https://qbit.ninjaprivacy.org
        description: qBittorrent's ProtonVPN path
        widget:
          type: prometheusmetric
          url: http://10.1.0.5:9090
          refreshInterval: 30000
          metrics:
            - label: Firewalled
              query: max(qbittorrent_firewalled)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Connected
              query: max(qbittorrent_connected)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Peers
              query: sum(qbittorrent_total_peer_connections)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: DHT nodes
              query: max(qbittorrent_dht_nodes)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
          highlight:
            Firewalled:
              numeric:
                - level: danger
                  when: eq
                  value: 1
                - level: good
                  when: eq
                  value: 0
              string:
                - level: warn
                  when: equals
                  value: "-"
            Connected:
              numeric:
                - level: danger
                  when: eq
                  value: 0
                - level: good
                  when: eq
                  value: 1
              string:
                - level: warn
                  when: equals
                  value: "-"
            Peers:
              string:
                - level: warn
                  when: equals
                  value: "-"
            DHT nodes:
              numeric:
                - level: danger
                  when: eq
                  value: 0
              string:
                - level: warn
                  when: equals
                  value: "-"

- Cluster:
    - Proxmox:
        icon: proxmox.png
        href: https://proxmox.ninjaprivacy.org
        description: X-Mansion cluster, all three nodes
        siteMonitor: https://10.0.1.2:8006
        widget:
          type: prometheusmetric
          url: http://10.1.0.5:9090
          refreshInterval: 30000
          metrics:
            - label: Nodes up
              query: count(max by (id) (pve_up{id=~"node/.*"}) == 1) or vector(0)
              format:
                type: number
                suffix: " / 3"
            - label: Guests running
              query: count(max by (id) (pve_up{id=~"(qemu|lxc)/.*"}) == 1) or vector(0)
              format:
                type: number
            - label: Guests stopped
              query: count(max by (id) (pve_up{id=~"(qemu|lxc)/.*"}) == 0 and on (id) max by (id) (pve_guest_info{template="0"})) or vector(0)
              format:
                type: number
            - label: Locked
              query: count(max by (id) (pve_lock_state) == 1) or vector(0)
              format:
                type: number
          highlight:
            Guests stopped:
              numeric:
                - level: warn
                  when: gte
                  value: 1
            Locked:
              numeric:
                - level: warn
                  when: gte
                  value: 1
