        siteMonitor: http://10.1.0.5:9093/-/healthy
        widget:
          type: prometheusmetric
          url: http://10.1.0.5:9090
          refreshInterval: 30000
          metrics:
            - label: Firing
              query: count(ALERTS{alertstate="firing"}) or vector(0)
              format:
                type: number
            - label: Pending
              query: count(ALERTS{alertstate="pending"}) or vector(0)
              format:
                type: number
            - label: Last backup
              query: min(time() - pve_backup_last_success_timestamp_seconds)
              format:
                type: duration
                suffix: " ago"
