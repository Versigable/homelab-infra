- Games:
    - RomM:
        icon: romm.png
        href: https://arcade.ninjaprivacy.org
        description: ROM library and browser play (also games.ninjaprivacy.org)
        siteMonitor: http://10.0.1.5:8080/api/heartbeat
    - Webstation 1:
        icon: mdi-controller
        href: https://arcade.ninjaprivacy.org/streaming/
        description: Emulator stream, jf
        siteMonitor: http://10.0.1.8:3010
        widget:
          type: customapi
          url: http://10.1.0.5:9090/api/v1/query
          method: POST
          headers:
            Content-Type: application/x-www-form-urlencoded
          # 1 while the container uses more than 8% of a core over 5 minutes.
          # Idle is under 1%; a game session runs from 10% to 200%.
          requestBody: query=sum(rate(container_cpu_usage_seconds_total{name="romm-webstation"}[5m])) > bool 0.08
          refreshInterval: 30000
          mappings:
            - field: data.result.0.value.1
              label: Status
              remap:
                - value: "0"
                  to: Free
                - value: "1"
                  to: In use
                - any: true
                  to: Unknown
    - Webstation 2:
        icon: mdi-controller
        href: https://arcade.ninjaprivacy.org/streaming-2/
