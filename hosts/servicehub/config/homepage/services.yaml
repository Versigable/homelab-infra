---
# Services on the hub: https://gethomepage.dev/configs/services/
#
# href        = what a click opens (the public name where there is one).
# siteMonitor = what the status dot checks. Homepage calls it from ServiceHub,
#               so it must be an address ServiceHub can reach without a login.
#               A service with no siteMonitor has no dot (ServiceHub cannot
#               reach it; its own firewall only lets Traefik in).
# Numbers come from Prometheus (10.1.0.5:9090, no credentials). A widget shows
# four metrics at most.
#
# API keys: two, and each one was a yes from MetaVersig. They live in
# homepage.env.sops and appear here only as {{HOMEPAGE_VAR_...}}. Homepage
# calls those APIs from the server and never sends keys or headers to the
# browser; the page itself sits behind its own Authentik login.
#   HOMEPAGE_VAR_GITLAB_TOKEN  project access token "hub-read" on homelab-infra:
#                              Reporter, read_api only, expires 2027-11-17.
#                              GitLab lets any signed-in account read
#                              "internal" projects, so it can read those too.
#   HOMEPAGE_VAR_SEERR_KEY     Seerr's API key. Seerr has only this one key, and
#                              it has admin rights; the widget only reads counts.
#
# prometheusmetric widgets can colour a value with `highlight`, keyed by the
# metric label. The first matching rule wins, so list danger, then warn, then
# good. A value of "-" means the query returned nothing (exporter down) and is
# shown amber.
# customapi widgets call the Prometheus API directly. They are used where a
# number should read as a word (Free / In use) or where a card lists several
# series (dynamic-list). They cannot be highlighted.
#
# Guest numbers (CPU, RAM, Up) sit on cards whose service has a guest of its
# own. RAM is shown for containers only: for a VM, Proxmox reports the host
# memory the VM holds, page cache included, so it reads near 100% when the VM
# is healthy.
#
# Group names are also used in settings.yaml (layout) and must stay unique.

# ----------------------------- Services tab -----------------------------

# Things waiting on an operator. "No items found" in a list means nothing is
# waiting.
- Needs you:
    - Alerts:
        icon: mdi-alert-decagram-outline
        href: http://10.1.0.5:9093
        description: Firing now and not silenced (LAN link)
        widget:
          type: customapi
          url: http://10.1.0.5:9093/api/v2/alerts?active=true&silenced=false&inhibited=false
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            name: labels.alertname
            label: labels.severity
            limit: 6
    - Merge requests:
        icon: mdi-source-merge
        href: https://gitlab.ninjaprivacy.org/gitops/homelab-infra/-/merge_requests
        description: Open on homelab-infra
        widget:
          type: customapi
          url: http://10.0.1.13:8081/api/v4/projects/1/merge_requests?state=opened&order_by=created_at&sort=desc&per_page=6
          headers:
            PRIVATE-TOKEN: "{{HOMEPAGE_VAR_GITLAB_TOKEN}}"
          refreshInterval: 60000
          display: dynamic-list
          mappings:
            name: title
            label: references.short
            limit: 6
            target: https://gitlab.ninjaprivacy.org/gitops/homelab-infra/-/merge_requests/{iid}
    - Pipeline:
        icon: mdi-pipe
        href: https://gitlab.ninjaprivacy.org/gitops/homelab-infra/-/pipelines
        description: Latest on main, homelab-infra
        widget:
          type: customapi
          url: http://10.0.1.13:8081/api/v4/projects/1/pipelines?ref=main&per_page=1
          headers:
            PRIVATE-TOKEN: "{{HOMEPAGE_VAR_GITLAB_TOKEN}}"
          refreshInterval: 60000
          mappings:
            # Any other status (manual, skipped, ...) shows as GitLab names it.
            - field: 0.status
              label: Status
              remap:
                - value: success
                  to: Passed
                - value: failed
                  to: Failed
                - value: running
                  to: Running
                - value: pending
                  to: Pending
                - value: canceled
                  to: Canceled
            - field: 0.id
              label: Pipeline
              format: text
            - field: 0.updated_at
              label: Updated
              format: relativeDate
    - Requests:
        icon: jellyseerr.png
        href: https://requests.ninjaprivacy.org
        description: Seerr. Pending = waiting for approval
        widget:
          type: seerr
          url: http://10.0.1.8:5055
          key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
          fields: [pending, issues, processing, completed]

