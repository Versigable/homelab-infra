    - Prowlarr:
        icon: prowlarr.png
        href: https://prowlarr.ninjaprivacy.org
        description: Indexers
        siteMonitor: http://10.0.1.8:9696/ping
    - qBittorrent:
        icon: qbittorrent.png
        href: https://qbit.ninjaprivacy.org
        description: Downloads, behind the VPN
        siteMonitor: http://10.0.1.8:8080
        widget:
          type: prometheusmetric
          url: http://10.1.0.5:9090
          refreshInterval: 15000
          metrics:
            - label: Down
              query: sum(rate(qbittorrent_dl_info_data_total[2m]))
              format:
                type: byterate
            - label: Up
              query: sum(rate(qbittorrent_up_info_data_total[2m]))
              format:
                type: byterate
            - label: Downloading
              query: sum(qbittorrent_torrents_count{status="downloading"}) or vector(0)
              format:
                type: number
            - label: Errored
              query: sum(qbittorrent_torrents_count{status=~"error|missingFiles"}) or vector(0)
              format:
                type: number
