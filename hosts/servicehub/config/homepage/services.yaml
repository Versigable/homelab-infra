          type: prometheusmetric
          url: http://10.1.0.5:9090
          refreshInterval: 30000
          metrics:
            - label: CPU
              query: max(pve_cpu_usage_ratio{id="lxc/114"})
              format:
                type: percent
                scale: 100
                options:
                  maximumFractionDigits: 0
            - label: RAM
              query: max(pve_memory_usage_bytes{id="lxc/114"}) / max(pve_memory_size_bytes{id="lxc/114"})
              format:
                type: percent
                scale: 100
                options:
                  maximumFractionDigits: 0
            - label: Up
              query: max(pve_uptime_seconds{id="lxc/114"})
