- Guests:
    - Busiest guests:
        icon: mdi-speedometer
        href: https://proxmox.ninjaprivacy.org
        description: CPU, as a share of each guest's own cores
        widget:
          type: customapi
          url: http://10.1.0.5:9090/api/v1/query
          method: POST
          headers:
            Content-Type: application/x-www-form-urlencoded
          requestBody: query=sort_desc(topk(8, max by (id) (pve_cpu_usage_ratio{id=~"(qemu|lxc)/.*"}) * on (id) group_left (name) max by (id, name) (pve_guest_info)))
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: data.result
            name: metric.name
            label: value.1
            format: percent
            scale: 100
            limit: 8
    - Container memory:
        icon: mdi-memory
        href: https://proxmox.ninjaprivacy.org
        description: LXC memory use, fullest first
        widget:
          type: customapi
          url: http://10.1.0.5:9090/api/v1/query
          method: POST
          headers:
            Content-Type: application/x-www-form-urlencoded
          requestBody: query=sort_desc(topk(8, max by (id) (pve_memory_usage_bytes{id=~"lxc/.*"}) / max by (id) (pve_memory_size_bytes{id=~"lxc/.*"}) * on (id) group_left (name) max by (id, name) (pve_guest_info)))
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: data.result
            name: metric.name
            label: value.1
            format: percent
            scale: 100
            limit: 8
    - Storage:
        icon: mdi-database
        href: https://proxmox.ninjaprivacy.org
        description: Proxmox storage, fullest first
        widget:
          type: customapi
          url: http://10.1.0.5:9090/api/v1/query
          method: POST
          headers:
            Content-Type: application/x-www-form-urlencoded
          requestBody: query=sort_desc(max by (name) (label_join((max by (id) (pve_disk_usage_bytes{id=~"storage/.*"}) / max by (id) (pve_disk_size_bytes{id=~"storage/.*"}) * on (id) group_left (node, storage) max by (id, node, storage) (pve_storage_info)) and on (id) (max by (id) (pve_storage_shared) == 0), "name", " ", "node", "storage")) or max by (name) (label_replace(max by (storage) ((max by (id) (pve_disk_usage_bytes{id=~"storage/.*"}) / max by (id) (pve_disk_size_bytes{id=~"storage/.*"}) * on (id) group_left (node, storage) max by (id, node, storage) (pve_storage_info)) and on (id) (max by (id) (pve_storage_shared) == 1)), "name", "$1 (shared)", "storage", "(.*)")))
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: data.result
            name: metric.name
            label: value.1
            format: percent
            scale: 100
            limit: 8

