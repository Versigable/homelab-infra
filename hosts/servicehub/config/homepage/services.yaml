---
# Services on the hub: https://gethomepage.dev/configs/services/
#
# href        = what a click opens (the public name where there is one).
# siteMonitor = what the status dot checks. Homepage calls it from ServiceHub,
#               so it must be an address ServiceHub can reach without a login.
#               A service with no siteMonitor has no dot (ServiceHub cannot
#               reach it; its own firewall only lets Traefik in).
# Numbers come from Prometheus (10.1.0.5:9090, no credentials). A widget shows
# four metrics at most. No API keys are used in this file.
#
# Group names are also used in settings.yaml (layout) and must stay unique.

