- Platform:
    - TrueNAS:
        icon: truenas.png
        href: https://truenas.ninjaprivacy.org
        description: NAS, VM 107 on phoenix
        siteMonitor: http://10.0.1.7
    - Traefik:
        icon: traefik.png
        href: https://traefik.ninjaprivacy.org/dashboard/
        description: Reverse proxy and Cloudflare tunnel
        siteMonitor: http://10.0.2.5:8082/metrics
        widget:
          type: prometheusmetric
          url: http://10.1.0.5:9090
          refreshInterval: 15000
          metrics:
            - label: Requests
              query: sum(rate(traefik_service_requests_total[5m])) or vector(0)
              format:
                type: number
                suffix: " /s"
                options:
                  maximumFractionDigits: 1
            - label: 5xx
              query: sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) or vector(0)
              format:
                type: number
                suffix: " /s"
                options:
                  maximumFractionDigits: 2
            - label: Last reload
              query: time() - max(traefik_config_last_reload_success)
              format:
                type: duration
                suffix: " ago"
    - Authentik:
        icon: authentik.png
        href: https://auth.ninjaprivacy.org
        description: Single sign-on
        siteMonitor: https://10.0.1.3:9443/-/health/live/
    - jf GPU (3060 Ti):
        icon: nvidia.png
        href: https://grafana.ninjaprivacy.org
        description: Jellyfin transcodes and emulator streams
        widget:
          type: prometheusmetric
          url: http://10.1.0.5:9090
          refreshInterval: 15000
          metrics:
            - label: Temp
              query: max(nvidia_smi_temperature_gpu{instance="jf"})
              format:
                type: number
                suffix: " C"
            - label: Load
              query: max(nvidia_smi_utilization_gpu_ratio{instance="jf"})
              format:
                type: percent
                scale: 100
                options:
                  maximumFractionDigits: 0
            - label: VRAM
              query: max(nvidia_smi_memory_used_bytes{instance="jf"})
              format:
                type: bbytes
            - label: Power
              query: max(nvidia_smi_power_draw_watts{instance="jf"})
              format:
                type: number
                suffix: " W"
                options:
                  maximumFractionDigits: 0

