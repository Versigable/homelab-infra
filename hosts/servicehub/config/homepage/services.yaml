# ------------------------------- Infra tab -------------------------------

- Cluster:
    - Proxmox:
        icon: proxmox.png
        href: https://proxmox.ninjaprivacy.org
        description: X-Mansion cluster, all three nodes
        siteMonitor: https://10.0.1.2:8006
        widget:
          type: prometheusmetric
          url: http://10.1.0.5:9090
          refreshInterval: 30000
          metrics:
            - label: Nodes up
              query: count(max by (id) (pve_up{id=~"node/.*"}) == 1) or vector(0)
              format:
                type: number
                suffix: " / 3"
            - label: Guests running
              query: count(max by (id) (pve_up{id=~"(qemu|lxc)/.*"}) == 1) or vector(0)
              format:
                type: number
            - label: Guests stopped
              query: count(max by (id) (pve_up{id=~"(qemu|lxc)/.*"}) == 0) or vector(0)
              format:
                type: number
            - label: No backup
              query: count(max by (vmid) (pve_backup_guest_without_backup) == 1) or vector(0)
              format:
                type: number
    - phoenix:
        icon: mdi-server
        href: https://10.0.1.2:8006
        description: Edge, storage, studio (LAN only)
        siteMonitor: https://10.0.1.2:8006
        widget:
          type: prometheusmetric
          url: http://10.1.0.5:9090
          refreshInterval: 15000
          metrics:
            - label: CPU
              query: max(pve_cpu_usage_ratio{id="node/phoenix"})
              format:
                type: percent
                scale: 100
                options:
                  maximumFractionDigits: 0
            - label: RAM
              query: max(pve_memory_usage_bytes{id="node/phoenix"}) / max(pve_memory_size_bytes{id="node/phoenix"})
              format:
                type: percent
                scale: 100
                options:
                  maximumFractionDigits: 0
            - label: Guests up
              query: count(max by (id) (pve_up == 1) * on (id) group_left(node) max by (id, node) (pve_guest_info{node="phoenix"})) or vector(0)
              format:
                type: number
            - label: Uptime
              query: max(pve_uptime_seconds{id="node/phoenix"})
              format:
                type: duration
    - rogue:
