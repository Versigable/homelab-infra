---
# Homepage settings: https://gethomepage.dev/configs/settings/
# Edited in git only. The container mounts this directory read-only.

title: X-Mansion Hub
description: One page for every homelab service, with live status
theme: dark
color: slate
headerStyle: boxedWidgets
statusStyle: dot
target: _blank
fullWidth: true
useEqualHeights: true
hideVersion: true
disableUpdateCheck: true
disableIndexing: true

quicklaunch:
  searchDescriptions: true
  hideInternetSearch: true
  hideVisitURL: true

# Group order here is the order on the page. Two tabs: Services and Infra.
layout:
  Media:
    tab: Services
    style: row
    columns: 4
  Games:
    tab: Services
    style: row
    columns: 4
  Apps:
    tab: Services
    style: row
    columns: 4
  Dev & Studio:
    tab: Services
    style: row
    columns: 4
  Health:
    tab: Infra
    style: row
    columns: 5
  Cluster:
    tab: Infra
    style: row
    columns: 4
  Guests:
    tab: Infra
    style: row
    columns: 3
  Platform:
    tab: Infra
    style: row
    columns: 4
  Monitoring:
    tab: Infra
    style: row
    columns: 4
  Outside:
    tab: Infra
    style: row
    columns: 4
  Wolverine site:
    tab: Infra
    style: row
    columns: 4
