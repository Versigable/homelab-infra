name: browsergames-hub

services:
  browsergames:
    image: lscr.io/linuxserver/emulatorjs:1.9.2
    container_name: browsergames
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      SUBFOLDER: /
    volumes:
      - ../config:/config
      - ../data:/data
      # Share the canonical library with RomM (RO).
      # EmulatorJS scans /data/<system>/roms/ per system (verified in
      # /emulatorjs/index.js: `var romPath = dataRoot + emu.name + '/roms/';`),
      # so each gameroom platform-slug subdir gets its own mount line.
      # RomM uses /mnt/gameroom/roms/<platform>/<rom>; map per-platform.
      # Add a mount line below for each new system as it gets ROMs.
      - /mnt/gameroom/roms/doom:/data/doom/roms:ro
      - /mnt/gameroom/roms/arcade:/data/arcade/roms:ro
      # BIOS files share the same per-system pattern under /data/<system>/bios.
      - /mnt/gameroom/bios/arcade:/data/arcade/bios:ro
    ports:
      # Player frontend — Traefik routes games.ninjaprivacy.org here
      - "10.0.1.5:8090:80"
      # Admin / ROM management UI — LAN only via ServiceHub IP
      - "10.0.1.5:3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
