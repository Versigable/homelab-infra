name: browsergames-hub

services:
  browsergames:
    image: lscr.io/linuxserver/emulatorjs:1.9.2
    container_name: browsergames
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      SUBFOLDER: /
    volumes:
      - ../config:/config
      - ../data:/data
      # Share the canonical library with RomM (RO).
      # RomM remains the sole writer; EmulatorJS scans /data/<system>/<rom>,
      # so /mnt/gameroom/roms maps to /data/roms (subdirs are platform slugs).
      - /mnt/gameroom/roms:/data/roms:ro
      - /mnt/gameroom/bios:/data/bios:ro
    ports:
      # Player frontend — Traefik routes games.ninjaprivacy.org here
      - "10.0.1.5:8090:80"
      # Admin / ROM management UI — LAN only via ServiceHub IP
      - "10.0.1.5:3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
