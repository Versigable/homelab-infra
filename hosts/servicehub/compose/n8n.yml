services:
  db:
    image: postgres:16-alpine
    container_name: n8n-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    networks:
      - n8n-net1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    depends_on:
      - db
    environment:
      # --- DB ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5442
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      # --- URLs / TLS behind Traefik ---
      N8N_HOST: n8n.ninjaprivacy.org
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://n8n.ninjaprivacy.org/
      WEBHOOK_URL: https://n8n.ninjaprivacy.org/

      # --- Misc ---
      GENERIC_TIMEZONE: America/Denver
      N8N_SECURE_COOKIE: "true"

    volumes:
      - ../data/n8n:/home/node/.n8n
    ports:
      # Expose only on ServiceHub IP, for Traefik to reach
      - "10.0.1.5:5678:5678"
    networks:
      - n8n-net1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  n8n-net1:
    driver: bridge
