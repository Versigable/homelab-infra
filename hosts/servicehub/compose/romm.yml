name: romm

services:
  romm-db:
    image: mariadb:11
    container_name: romm-db
    restart: unless-stopped
    user: "5999:5999"
    environment:
      MYSQL_DATABASE: romm
      MYSQL_USER: romm
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ../data/db:/var/lib/mysql
    networks: [romm-net1]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  romm:
    image: rommapp/romm:4.8.1
    container_name: romm
    restart: unless-stopped
    depends_on:
      romm-db:
        condition: service_healthy
    environment:
      DB_HOST: romm-db
      DB_PORT: 3306
      DB_NAME: romm
      DB_USER: romm
      DB_PASSWD: ${MYSQL_PASSWORD}
      ROMM_AUTH_SECRET_KEY: ${ROMM_AUTH_SECRET_KEY}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}
      # Reminder: Docker Compose's `.env` file is parse-time substitution only,
      # NOT auto-injected into containers. Every var RomM should see needs an
      # explicit ${VAR} line here. Adding a var to romm.env.sops alone has no
      # effect on the running container.
      # Metadata providers (each enabled by presence of credentials):
      STEAMGRIDDB_API_KEY: ${STEAMGRIDDB_API_KEY:-}
      SCREENSCRAPER_USER: ${SCREENSCRAPER_USER:-}
      SCREENSCRAPER_PASSWORD: ${SCREENSCRAPER_PASSWORD:-}
      MOBYGAMES_API_KEY: ${MOBYGAMES_API_KEY:-}
      RETROACHIEVEMENTS_API_KEY: ${RETROACHIEVEMENTS_API_KEY:-}
      ENABLE_SCHEDULED_RETROACHIEVEMENTS_PROGRESS_SYNC: ${ENABLE_SCHEDULED_RETROACHIEVEMENTS_PROGRESS_SYNC:-false}
      # Hasheous: public, just a toggle:
      HASHEOUS_API_ENABLED: ${HASHEOUS_API_ENABLED:-false}
      # Scan automation:
      ENABLE_SCHEDULED_RESCAN: ${ENABLE_SCHEDULED_RESCAN:-false}
      ENABLE_RESCAN_ON_FILESYSTEM_CHANGE: ${ENABLE_RESCAN_ON_FILESYSTEM_CHANGE:-false}
    volumes:
      - ../data/resources:/romm/resources
      - ../data/redis:/romm/redis-data
      - ../data/assets:/romm/assets
      - ../config/app:/romm/config
      - /mnt/gameroom:/romm/library:ro
    ports:
      - "10.0.1.5:8080:8080"
    networks: [romm-net1]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  romm-net1:
    driver: bridge
