name: homepage

# Homepage (gethomepage.dev): the operators' hub at hub.ninjaprivacy.org.
# One page of links to every service, with a status dot per service and
# infra numbers read from Prometheus.
#
# Routing: Traefik (10.0.2.5) -> http://10.0.1.5:3003 -> container :3000,
# behind the authentik-forward middleware (the wildcard gate, operators only).
#
# Two gates. The middleware only guards requests that come through Traefik;
# anything on the LAN can reach 10.0.1.5:3003 directly and set its own Host
# header. So Homepage also has its own login: OIDC against the Authentik
# application `hub`, bound to the Hokagis group (the operators). Every page and
# /api route needs a session, whichever way the request arrives; only
# /api/healthcheck and custom.css stay open. Signing in is one bounce, since
# the operator already has an Authentik session from the middleware.
# Break-glass view of the login page: /auth/signin?autologin=0.
#
# Config lives in git at hosts/servicehub/config/homepage/ and deploy.sh
# copies it to ../config, mounted read-only. Homepage re-reads it on page
# load, so a config-only change needs no restart.
#
# Secrets (homepage.env.sops): the OIDC client ID and secret, and
# HOMEPAGE_AUTH_SECRET, which signs the session cookie (changing it signs
# everyone out). To give a widget an API key, add HOMEPAGE_VAR_<NAME> to
# homepage.env.sops AND an explicit line under `environment:` below (compose's
# .env is parse-time substitution only), then use {{HOMEPAGE_VAR_<NAME>}} in
# the config.

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.8.0
    container_name: homepage
    restart: unless-stopped
    # The image's own unprivileged user (it owns /app/.next). Setting `user:`
    # skips the entrypoint's chown + su-exec path, which would need
    # capabilities that cap_drop removes.
    user: "1000:1000"
    environment:
      # Homepage rejects API calls whose Host header is not listed here.
      HOMEPAGE_ALLOWED_HOSTS: hub.ninjaprivacy.org
      # The config mount is read-only, so log to stdout only (json-file below).
      LOG_TARGETS: stdout
      TZ: ${TZ}
      # Login (see the header). The callback registered in Authentik is
      # https://hub.ninjaprivacy.org/api/auth/callback/homepage-oidc.
      HOMEPAGE_AUTH_ENABLED: "true"
      HOMEPAGE_EXTERNAL_URL: https://hub.ninjaprivacy.org
      HOMEPAGE_OIDC_ISSUER: https://auth.ninjaprivacy.org/application/o/hub/
      HOMEPAGE_OIDC_NAME: Authentik
      HOMEPAGE_OIDC_AUTO_LOGIN: "true"
      HOMEPAGE_OIDC_CLIENT_ID: ${HOMEPAGE_OIDC_CLIENT_ID}
      HOMEPAGE_OIDC_CLIENT_SECRET: ${HOMEPAGE_OIDC_CLIENT_SECRET}
      HOMEPAGE_AUTH_SECRET: ${HOMEPAGE_AUTH_SECRET}
    volumes:
      - ../config:/app/config:ro
    ports:
      # Published on the ServiceHub LAN IP for Traefik to reach. Other LAN
      # hosts can reach it too; Homepage's own login (above) gates them.
      - "10.0.1.5:3003:3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks: [homepage-net1]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  homepage-net1:
    driver: bridge
