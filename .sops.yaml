creation_rules:
  # ============================================================
  # Docker / Compose host secrets (per-host keys)
  # ONE key per host, multiple services per host
  # Pattern: hosts/<host>/secrets/*.env.sops (any name)
  # ============================================================

  # Traefik host (10.0.2.5)
  - path_regex: ^hosts/traefik/secrets/.*\.env\.sops$
    age: ["age1L53qjaf89q76dragageg4e4yr3na04maxems9fptt2288x9t4edscawufa"]

  # ServiceHub host (10.0.1.5)
  # Matches: wiki.env.sops, n8n.env.sops, etc.
  - path_regex: '(^|.*/)hosts/servicehub/secrets/.*\.env\.sops$'
    age: ["age1sxssf0cce0ccuf2ym77m8q66mgzhdcdede5l7cqqpv6z0nf9cymsd3u260"]

  # Authentik host (10.0.1.3)
  # Matches: authentik.env.sops, bitwarden.env.sops
  - path_regex: ^hosts/authentik/secrets/.*\.env\.sops$
    age: ["age1lcaqm5xr2wa66slg5jtxhk6gyjmxf79gfm7nkanarnmrp5dsvakqgry8uj"]

  # GamingHub host (10.0.1.9)
  # Matches: minecraft.env.sops, ark-island.env.sops, etc.
  - path_regex: ^hosts/gaminghub/secrets/.*\.env\.sops$
    age: ["age1j8s7twwpfzw8c67cc4nw85tr0h4cnm33ne8su8uefkvmsdq423fqsfadsm"]


  # Jellyfin host (10.0.1.8)
  - path_regex: ^hosts/jellyfin/secrets/.*\.env\.sops$
    age: ["age12hnehmn3swcw97med3jvjrh82qkgdfgnnt9t9kwj37ctt32ae46s8a30yn"]

  # Monitoring host (Wolverine LXC 302, 10.1.0.5)
  - path_regex: ^hosts/monitoring/secrets/.*\.env\.sops$
    age: ["age1ln833f9r64gjahe6ktjz968frcxkk7l0sgech65m7xac57f9eqsqa7ghek"]

  # Nextcloud hosts, built by iac/: LXC 110 (live until the cutover) and VM 116 (the
  # move, 1-Projects/nextcloud/notes/vm-migration-plan). iac/ansible role sops_age
  # makes each key on its host; a rebuilt guest gets a new one, so after a rebuild
  # update its key and run `sops updatekeys` on a host that can still decrypt.
  # LXC 110's key comes out in the cutover cleanup.
  - path_regex: ^hosts/nextcloud/secrets/.*\.env\.sops$
    age: >-
      age1ugx3aytf7cvpdd4ratn06l4sh2p5t7hxnu2tcm7rhgat4vf3zs7q3kge5l,
      age15awta4pt3vp6r4swn7psu7qjdx8n80rlhanf6ckm72uujzdz8yaq2ql2zn

  # Home Assistant, one secrets file per house (hosts/home-assistant/instances), each
  # encrypted only to its own guest, so neither house can read the other's. Both guests
  # are built by iac/. Same as Nextcloud: after a rebuild, update that house's key and
  # re-encrypt its file from the operator copies. A new house needs its own rule here.
  # X-Mansion (Firekube's house): LXC 112 on phoenix.
  - path_regex: ^hosts/home-assistant/secrets/xmansion\.env\.sops$
    age: ["age1sdmvge7wd0j823ex6ljp84r9cjnyhcypvt0xy26mggpnlc3l0e4qfdfqj6"]
  # Wolverine (MetaVersig's house): LXC 303 on wolverine.
  - path_regex: ^hosts/home-assistant/secrets/wolverine\.env\.sops$
    age: ["age10ah95t9n3c8j2qxemymm5msd7r6l98q88r2lst000v3jef42ryas85vgfm"]
  # Navidrome host (LXC 114 on phoenix, built by iac/). Same as Home Assistant: after a
  # rebuild, update this key and make a new hosts/navidrome/secrets/navidrome.env.sops
  # (no operator copy; a new ND_PASSWORDENCRYPTIONKEY means users reset their passwords).
  - path_regex: ^hosts/navidrome/secrets/.*\.env\.sops$
    age: ["age184nehpc5mxw5r9pl5mrc7tjlmxkguvpk7tdrxn4lz0rpyq9ke99sug8u3p"]
  # ============================================================
  # Future: Kubernetes / Argo secrets
  # ============================================================
  - path_regex: ^k8s/.*/secrets/.*\.(yaml|yml|json)\.sops$
    age: ["age1L53qjaf89q76dragageg4e4yr3na04maxems9fptt2288x9t4edscawufa"]

  - path_regex: ^clusters/.*/secrets/.*\.(yaml|yml|json)\.sops$
    age: ["age1L53qjaf89q76dragageg4e4yr3na04maxems9fptt2288x9t4edscawufa"]
