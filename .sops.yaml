creation_rules:
  # ============================================================
  # Docker / Compose host secrets (per-host keys)
  # ONE key per host, multiple services per host
  # Pattern: hosts/<host>/secrets/*.env.sops (any name)
  # ============================================================

  # Traefik host (10.0.2.5)
  - path_regex: ^hosts/traefik/secrets/.*\.env\.sops$
    age: ["age1L53qjaf89q76dragageg4e4yr3na04maxems9fptt2288x9t4edscawufa"]

  # ServiceHub host (10.0.1.5)
  # Matches: wiki.env.sops, n8n.env.sops, etc.
  - path_regex: ^hosts/servicehub/secrets/.*\.env\.sops$
    age: ["age1sxssf0cce0ccuf2ym77m8q66mgzhdcdede5l7cqqpv6z0nf9cymsd3u260"]

  # Authentik host (10.0.1.3)
  # Matches: authentik.env.sops, bitwarden.env.sops
  - path_regex: ^hosts/authentik/secrets/.*\.env\.sops$
    age: ["age1lcaqm5xr2wa66slg5jtxhk6gyjmxf79gfm7nkanarnmrp5dsvakqgry8uj"]

  # GamingHub host (10.0.1.9)
  # Matches: minecraft.env.sops, ark-island.env.sops, etc.
  - path_regex: ^hosts/gaminghub/secrets/.*\.env\.sops$
    age: ["age1j8s7twwpfzw8c67cc4nw85tr0h4cnm33ne8su8uefkvmsdq423fqsfadsm"]

  # ============================================================
  # Future: Kubernetes / Argo secrets
  # ============================================================
  - path_regex: ^k8s/.*/secrets/.*\.(yaml|yml|json)\.sops$
    age: ["age1L53qjaf89q76dragageg4e4yr3na04maxems9fptt2288x9t4edscawufa"]

  - path_regex: ^clusters/.*/secrets/.*\.(yaml|yml|json)\.sops$
    age: ["age1L53qjaf89q76dragageg4e4yr3na04maxems9fptt2288x9t4edscawufa"]
