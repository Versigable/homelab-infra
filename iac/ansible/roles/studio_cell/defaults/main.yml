# A person's cell. The pins live in inventory/group_vars/studio_cell.yml and the owner in
# host_vars/<cell>.yml.

# Packages every cell needs: Git (with LFS, for game assets), a virtual display for Editor
# runs that want one, the libraries the Linux Editor loads, nftables for egress per user, and
# bubblewrap, the sandbox Codex runs unattended jobs in.
# ICU is for Unity's licensing client, a .NET program that stops at start without it
# ("Couldn't find a valid ICU package"), which the CLI reports as "Can't reach the Unity
# licensing client".
studio_cell_packages:
  - git
  - git-lfs
  - bubblewrap
  - nftables
  - unzip
  - xvfb
  - libicu76
  - tmux
  - libasound2t64
  - libegl1
  - libgbm1
  - libgl1
  - libgtk-3-0t64
  - libnss3
  - libvulkan1
  - libxcursor1
  - libxi6
  - libxrandr2
  - libxss1
  - libxtst6

# Egress per user. Each user listed here reaches the outside only through its own Squid port
# on studio-gw, whose class says what that user may reach (cells_agent and cells_unity in
# group_vars/studio_gw.yml): agent the open web over HTTPS, unity only Unity. Everyone else,
# root and the owner included, uses the default port (class cells). The cell's nftables
# enforces it (templates/nftables.conf.j2).
studio_cell_user_proxy_ports:
  agent: 3129
  unity: 3130
# Loopback ports a pinned user may not reach; the rest of loopback is open to it (the Unity
# CLI, for one, sends its web requests through a helper of its own on a random loopback port).
# 7800-7999 are Pipeline's servers in editors and players: agent reaches an editor only
# through the broker's verbs (the servers also want a bearer token only unity can read).
studio_cell_loopback_deny:
  agent: [7800-7999]
studio_cell_proxy_host: "{{ studio_proxy_url | urlsplit('hostname') }}"

# The owner's browser terminal (term.yml): ttyd on this port, a tmux session as the owner, at
# https://studio.ninjaprivacy.org/term/<owner>/. Traefik reaches it through studio-gw (its
# ingress term-<owner>), after Authentik and the hub's owner check (/auth/term), and the
# cell's firewall takes the port from Traefik's address only, never from studio0 or loopback.
studio_cell_term_port: 7681
studio_cell_term_from: 10.0.2.5

# Group shared by agent and unity for job worktrees: agents edit the code, the editor writes
# Library/ and the scenes and prefabs the kit generates.
studio_cell_work_group: studio-work

# The person's agent account on GitLab, reached the way the internet does. Its token comes
# from the control node's environment (iac.sh exports GITLAB_TOKEN_STUDIO_AGENT_<OWNER> from
# the secrets env file); without it, the cell's copy is left as it is.
studio_cell_gitlab_url: https://gitlab.ninjaprivacy.org
studio_cell_gitlab_agent: "agent-{{ studio_cell_owner }}"
studio_cell_gitlab_token: >-
  {{ lookup('ansible.builtin.env', 'GITLAB_TOKEN_STUDIO_AGENT_' ~ (studio_cell_owner | upper | replace('-', '_'))) }}

# Where the control node keeps the Codex archive it checks before copying it to cells.
studio_cell_codex_cache: "{{ lookup('ansible.builtin.env', 'HOME') }}/.cache/homelab-iac/studio-cell"

# The pinned Editor, installed by the Unity CLI as root, read-only to everyone else.
studio_cell_unity_editor_dir: "/opt/unity/{{ studio_cell_unity_editor_version }}"

# studio-agentd (the runtime): whose agent-request labels this cell takes as approvals (until
# the member register, step 6: the person's GitLab account), and its jobs' limits.
#   ceilings: a job doesn't start when the vendor's last known usage is at or above these
#   (decision 2026-10-17: queued work never spends credits or extra usage).
#   home_paths: what of agent's home a job's unit sees (the sign-ins); the rest is a tmpfs.
studio_cell_agentd:
  approvers: ["{{ studio_cell_owner }}"]
  poll_seconds: 60
  max_jobs: 1
  job_hours: 3
  job_memory_max: 4G
  ceilings: {five_hour: 0.6, seven_day: 0.7}
  home_paths: [.claude, .claude.json, .codex]
  review_after_implement: true
  keep_worktrees: false
# A job's environment: agent's own Squid port; Claude's auto memory and updater off, so one
# job's notes never reach the next and apt keeps the version.
studio_cell_agent_job_env:
  CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
  DISABLE_AUTOUPDATER: "1"
  http_proxy: "http://{{ studio_cell_proxy_host }}:{{ studio_cell_user_proxy_ports.agent }}"
  https_proxy: "http://{{ studio_cell_proxy_host }}:{{ studio_cell_user_proxy_ports.agent }}"
  HTTP_PROXY: "http://{{ studio_cell_proxy_host }}:{{ studio_cell_user_proxy_ports.agent }}"
  HTTPS_PROXY: "http://{{ studio_cell_proxy_host }}:{{ studio_cell_user_proxy_ports.agent }}"
  no_proxy: localhost,127.0.0.1
  NO_PROXY: localhost,127.0.0.1

# Claude's settings for unattended jobs (--settings, with --permission-mode dontAsk): anything
# these don't allow is denied, never asked. Ordinary development tools and `studio`; edits only
# under /srv/studio, which the job's unit narrows to its own worktree. Interactive sessions the
# owner pairs in don't use this file.
studio_cell_claude_job_settings:
  autoMemoryEnabled: false
  permissions:
    allow:
      - Bash(studio *)
      - Bash(git *)
      - Bash(ls *)
      - Bash(cat *)
      - Bash(head *)
      - Bash(tail *)
      - Bash(grep *)
      - Bash(rg *)
      - Bash(find *)
      - Bash(wc *)
      - Bash(diff *)
      - Bash(sort *)
      - Bash(uniq *)
      - Bash(cut *)
      - Bash(tr *)
      - Bash(sed *)
      - Bash(awk *)
      - Bash(jq *)
      - Bash(file *)
      - Bash(stat *)
      - Bash(du *)
      - Bash(mkdir *)
      - Bash(cp *)
      - Bash(mv *)
      - Bash(rm *)
      - Bash(touch *)
      - Bash(echo *)
      - Bash(printf *)
      - Bash(python3 *)
      - Bash(curl *)
      - Bash(sleep *)
      - Bash(date *)
      - Bash(pwd)
      - Bash(which *)
      - Bash(test *)
      - Bash(true)
      - Bash(for *)
      - Bash(while *)
      - Bash(if *)
      - Edit(//srv/studio/**)
      - Edit(//tmp/**)
      - Read(//srv/studio/**)
      - Read(//opt/unity/**)
      - Read(//tmp/**)
      - WebFetch
      - WebSearch
    deny:
      - Bash(sudo *)

# studio-unityd (the runtime): memory caps for a warm editor and for a cold gate or build run
# (a 12 GiB cell holds two warm editors and a gate), and when an unused warm editor stops.
studio_cell_editor_memory_max: 6G
studio_cell_gate_memory_max: 7G
studio_cell_editor_idle_minutes: 30

# The Unity CLI's settings for every run on a cell (the IaC's and the person's): no
# self-update checks (apt updates it), no crash reports, no first-run analytics prompt, no
# pager or banner in agents' output. The proxy depends on who runs it (below).
studio_cell_unity_env:
  UNITY_NO_UPDATE_CHECK: "1"
  UNITY_NO_CRASH_REPORT: "1"
  UNITY_NO_CONSENT_PROMPT: "1"
  UNITY_NO_BANNER: "1"
  UNITY_NO_PAGER: "1"
# For tasks run as the user unity: its own Squid port.
studio_cell_unity_proxy_url: "http://{{ studio_cell_proxy_host }}:{{ studio_cell_user_proxy_ports.unity }}"
studio_cell_unity_user_env: >-
  {{ studio_cell_unity_env | combine({
       'UNITY_PROXY': studio_cell_unity_proxy_url,
       'http_proxy': studio_cell_unity_proxy_url, 'https_proxy': studio_cell_unity_proxy_url,
       'HTTP_PROXY': studio_cell_unity_proxy_url, 'HTTPS_PROXY': studio_cell_unity_proxy_url}) }}
