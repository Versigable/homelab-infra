- name: Reload nftables
  ansible.builtin.service:
    name: nftables
    state: reloaded

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# Warm editors are their own units and keep running across a broker restart (it adopts them).
# Not in a check-mode run that would install the unit file for the first time.
- name: Restart studio-unityd
  ansible.builtin.systemd_service:
    name: studio-unityd
    state: restarted
  when: not (ansible_check_mode and (studio_cell_unityd_unit.changed | default(false)))

# Running jobs are their own units; the daemon picks them up again from its journal.
- name: Restart studio-agentd
  ansible.builtin.systemd_service:
    name: studio-agentd
    state: restarted
  when:
    - studio_cell_token_file.stat.exists | default(false)
    - not (ansible_check_mode and (studio_cell_agentd_unit.changed | default(false)))

# Open terminals drop and reconnect; the tmux session (and anything running in it) survives.
- name: Restart studio-term
  ansible.builtin.systemd_service:
    name: studio-term
    state: restarted
  when: not ansible_check_mode
