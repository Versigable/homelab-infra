# Unity licences are per machine, so a rebuilt cell must look like the same machine. Its
# identity comes from Terraform alone: the fixed MAC and SMBIOS UUID in studio.tf. On this
# Debian 13 image systemd (257) sets the machine-id from the SMBIOS UUID at every boot
# ("Initializing machine ID from SMBIOS/DMI UUID", seen on all boots of VM 160, even right
# after a different id was written), so the machine-id follows the UUID. This only checks it.

- name: Read the SMBIOS UUID and the machine-id
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - /sys/class/dmi/id/product_uuid
    - /etc/machine-id
  register: studio_cell_ids

- name: The machine-id is the SMBIOS UUID
  ansible.builtin.assert:
    that: >-
      (studio_cell_ids.results[1].content | b64decode | trim)
      == (studio_cell_ids.results[0].content | b64decode | trim | lower | replace('-', ''))
    fail_msg: >-
      /etc/machine-id isn't this cell's SMBIOS UUID, so the cell's machine identity has
      changed (Unity would see a new machine). Check smbios_uuid in terraform/xmansion/studio.tf.
    quiet: true
