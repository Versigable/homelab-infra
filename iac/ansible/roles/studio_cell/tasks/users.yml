- name: The cell has an owner
  ansible.builtin.assert:
    that:
      - studio_cell_owner is defined
      - studio_cell_owner is match('^[a-z][a-z0-9-]*$')
    fail_msg: "Set studio_cell_owner in host_vars/{{ inventory_hostname }}.yml"
    quiet: true

- name: Service users (no password, no sudo)
  ansible.builtin.user:
    name: "{{ item }}"
    shell: /bin/bash
    create_home: true
    password: "!"
  loop: [agent, unity]

- name: The owner's account
  ansible.builtin.user:
    name: "{{ studio_cell_owner }}"
    shell: /bin/bash
    create_home: true
    password: "!"

# Owners on the LAN may also come in over SSH through studio-gw's jump account, with their own
# keys. An owner with no keys (anyone outside: no WARP, no tailnet) has no SSH login at all.
- name: The owner logs in with their own keys, nothing else
  ansible.posix.authorized_key:
    user: "{{ studio_cell_owner }}"
    key: "{{ studio_cell_owner_keys | join('\n') }}"
    exclusive: true
  when: studio_cell_owner_keys | default([]) | length > 0

- name: No keys, no SSH login for the owner
  ansible.builtin.file:
    path: "/home/{{ studio_cell_owner }}/.ssh/authorized_keys"
    state: absent
  when: studio_cell_owner_keys | default([]) | length == 0

# The owner acts as agent or unity to sign in and to work with their agents. No root.
- name: The owner may act as agent and unity
  ansible.builtin.copy:
    dest: /etc/sudoers.d/studio-cell-owner
    content: |
      # Managed by Ansible (role studio_cell).
      {{ studio_cell_owner }} ALL=(agent,unity) NOPASSWD: ALL
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

# Logins on the cell: a user pinned to its own Squid port (studio_cell_user_proxy_ports; the
# firewall allows it no other way out) gets that port as its proxy. Claude Code, Codex, Git
# and the Unity Editor read the proxy variables, the Unity CLI UNITY_PROXY. Everyone else has
# the internet directly and gets no proxy; agent gets its Git settings
# (studio_cell_agent_git_env). The Editor's folder is on the PATH for batch runs
# (`Unity -batchmode ...`).
- name: Proxy and tool settings for every login
  ansible.builtin.copy:
    dest: /etc/profile.d/studio-cell.sh
    content: |
      # Managed by Ansible (role studio_cell).
      case "$(id -un)" in
      {% for user, port in studio_cell_user_proxy_ports | dictsort %}
        {{ user }})
          studio_proxy=http://{{ studio_cell_proxy_host }}:{{ port }}
          export http_proxy=$studio_proxy https_proxy=$studio_proxy HTTP_PROXY=$studio_proxy HTTPS_PROXY=$studio_proxy
          export UNITY_PROXY=$studio_proxy
          unset studio_proxy
          export no_proxy={{ studio_proxy_env.no_proxy }} NO_PROXY={{ studio_proxy_env.NO_PROXY }}
          ;;
      {% endfor %}
        agent)
      {% for k, v in studio_cell_agent_git_env | dictsort %}
          export {{ k }}={{ v | quote }}
      {% endfor %}
          ;;
      esac
      {% for k, v in studio_cell_unity_env | dictsort %}
      export {{ k }}={{ v }}
      {% endfor %}
      export PATH="{{ studio_cell_unity_editor_dir }}/Editor:$PATH"
    mode: "0644"
