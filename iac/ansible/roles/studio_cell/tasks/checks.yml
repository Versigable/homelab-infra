# Egress per user, shown on every run. curl's exit code says who refused: 7 is the cell's
# firewall (connection reset), anything else non-zero after connecting is Squid refusing
# the name, 0 is a tunnel that went through.

- name: Egress checks (user, proxy port, URL, expected outcome)
  ansible.builtin.command:
    argv: >-
      {{ ['curl', '-sS', '-m', '15', '-o', '/dev/null']
         + (['--noproxy', '*'] if item.port == 0 else ['-x', 'http://' ~ studio_cell_proxy_host ~ ':' ~ item.port])
         + [item.url] }}
  become: true
  become_user: "{{ item.user }}"
  register: studio_cell_egress
  changed_when: false
  failed_when: >-
    (item.expect == 'through' and studio_cell_egress.rc != 0)
    or (item.expect == 'firewall' and studio_cell_egress.rc != 7)
    or (item.expect == 'squid' and studio_cell_egress.rc in [0, 7])
  loop:
    - {user: agent, port: 3129, url: "https://api.anthropic.com/", expect: through}
    - {user: agent, port: 3129, url: "https://chatgpt.com/", expect: through}
    # The open web over HTTPS (Unity's docs, GitHub), but nothing private: ServiceHub stands in.
    - {user: agent, port: 3129, url: "https://docs.unity.com/", expect: through}
    - {user: agent, port: 3129, url: "https://github.com/", expect: through}
    - {user: agent, port: 3129, url: "https://10.0.1.5/", expect: squid}
    - {user: agent, port: 3128, url: "https://deb.debian.org/debian/", expect: firewall}
    - {user: agent, port: 3130, url: "https://unity.com/", expect: firewall}
    # An editor's command port is loopback TCP: agent can't reach it (sshd stands in here).
    - {user: agent, port: 0, url: "http://127.0.0.1:22/", expect: firewall}
    - {user: unity, port: 3130, url: "https://unity.com/", expect: through}
    - {user: unity, port: 3130, url: "https://api.anthropic.com/", expect: squid}
    - {user: unity, port: 3128, url: "https://deb.debian.org/debian/", expect: firewall}
    - {user: root, port: 3128, url: "{{ studio_cell_gitlab_url }}/api/v4/version", expect: through}
  loop_control:
    label: "{{ item.user }} :{{ item.port }} {{ item.url }} -> {{ item.expect }}"
  when: not ansible_check_mode

# The broker answers agent and refuses anyone else (13), whatever the socket's mode.
- name: The broker admits agent and refuses unity
  ansible.builtin.command: studio status
  become: true
  become_user: "{{ item.user }}"
  register: studio_cell_broker
  changed_when: false
  failed_when: studio_cell_broker.rc != item.rc
  loop:
    - {user: agent, rc: 0}
    - {user: unity, rc: 13}
  loop_control:
    label: "{{ item.user }} -> {{ item.rc }}"
  when: not ansible_check_mode
