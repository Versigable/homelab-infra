# A person's cell (design: engine-and-agent-runtime §2): their agents, their games, their
# Unity editor. Users:
#   <owner>  the person: logs in through studio-gw's jump account, and may act as agent and
#            unity (sudo -iu) to sign in, but has no root here (root belongs to the IaC and,
#            from step 2c-2, to studio-agentd and the Unity broker)
#   agent    runs Claude Code and Codex; holds the person's AI sign-ins and nothing else
#   unity    runs the Unity CLI and Editor; holds the person's Unity sign-in and licence
# Separate users so game code running in the editor can't read the AI sign-ins, and an agent
# can't read the Unity licence (design: engine-and-agent-runtime §2).

- name: Machine identity
  ansible.builtin.import_tasks: identity.yml

- name: Cell packages
  ansible.builtin.apt:
    name: "{{ studio_cell_packages }}"

- name: Users and the owner's login
  ansible.builtin.import_tasks: users.yml

- name: Claude Code
  ansible.builtin.import_tasks: claude.yml

- name: Codex
  ansible.builtin.import_tasks: codex.yml

- name: Unity CLI and Editor
  ansible.builtin.import_tasks: unity.yml
