# Settings every guest on the studio network needs, because studio-gw is its only way out.
# Runs before base: base's first task installs packages.

- name: Apt goes through Squid on studio-gw
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/90studio-proxy
    content: |
      // Managed by Ansible (role studio_guest). The studio network's only way out.
      Acquire::http::Proxy "{{ studio_proxy_url }}";
      Acquire::https::Proxy "{{ studio_proxy_url }}";
    mode: "0644"

# cloud-init's first-boot apt update runs before this proxy exists and fails, but leaves the
# cache looking fresh, so base's cache_valid_time would skip the refresh (2026-10-25).
- name: Fresh apt lists
  ansible.builtin.apt:
    update_cache: true
  changed_when: false

- name: Timesyncd installed
  ansible.builtin.apt:
    name: systemd-timesyncd

- name: Timesyncd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/timesyncd.conf.d
    state: directory
    mode: "0755"

- name: Time from studio-gw
  ansible.builtin.copy:
    dest: /etc/systemd/timesyncd.conf.d/studio.conf
    content: |
      # Managed by Ansible (role studio_guest). studio-gw runs chrony for the studio network.
      [Time]
      NTP={{ studio_guest_ntp }}
      FallbackNTP=
    mode: "0644"
  notify: Restart timesyncd

- name: Timesyncd running
  ansible.builtin.service:
    name: systemd-timesyncd
    state: started
    enabled: true

# --- Names, for a guest with the internet directly (studio_guest_direct_internet) ------------
# systemd-resolved, from the cloud image. netplan (cloud-init) gives the link studio-gw as its
# DNS server; a drop-in for the .network file netplan generates keeps that server to .studio
# names (a routing domain, and no default route for DNS), and every other name goes to the
# public resolvers.

- name: The link's .network file, as netplan generates it
  ansible.builtin.stat:
    path: "/run/systemd/network/10-netplan-{{ ansible_facts.default_ipv4.interface }}.network"
  register: studio_guest_netplan_network
  when: studio_guest_direct_internet

- name: The link is netplan's
  ansible.builtin.assert:
    that: studio_guest_netplan_network.stat.exists
    fail_msg: "No netplan .network file for {{ ansible_facts.default_ipv4.interface }}: where does this guest's DNS come from?"
    quiet: true
  when: studio_guest_direct_internet

- name: Drop-in directories for resolved and the link
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/systemd/resolved.conf.d
    - "/etc/systemd/network/10-netplan-{{ ansible_facts.default_ipv4.interface }}.network.d"
  when: studio_guest_direct_internet

- name: The link's DNS server, studio-gw, answers .studio names only
  ansible.builtin.copy:
    dest: "/etc/systemd/network/10-netplan-{{ ansible_facts.default_ipv4.interface }}.network.d/studio-dns.conf"
    content: |
      # Managed by Ansible (role studio_guest). netplan's file gives this link studio-gw as its
      # DNS server, which answers .studio names and nothing else.
      [Network]
      Domains=~studio
      DNSDefaultRoute=false
    mode: "0644"
  notify: Reload networkd
  when: studio_guest_direct_internet

- name: Public resolvers for every other name
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/studio.conf
    content: |
      # Managed by Ansible (role studio_guest). Outside names, reached directly through
      # studio-gw like the rest of the internet.
      [Resolve]
      DNS={{ studio_guest_public_dns | join(' ') }}
      FallbackDNS=
      LLMNR=no
      MulticastDNS=no
    mode: "0644"
  notify: Restart resolved
  when: studio_guest_direct_internet

- name: Names settled before the checks
  ansible.builtin.meta: flush_handlers

# Checks: allowed through Squid, refused by Squid, and nothing out without it (a guest with
# the internet directly: out without it too).
- name: An allowed name is reachable through Squid
  ansible.builtin.command:
    argv: [curl, -sS, -m, "15", -o, /dev/null, -w, "%{http_code}", -x, "{{ studio_proxy_url }}", "{{ studio_guest_check_allowed }}"]
  register: studio_guest_check_ok
  changed_when: false
  failed_when: studio_guest_check_ok.rc != 0 or studio_guest_check_ok.stdout is not match('^[23]')

- name: An unlisted name is refused by Squid
  ansible.builtin.command:
    argv: [curl, -sS, -m, "15", -o, /dev/null, -x, "{{ studio_proxy_url }}", "{{ studio_guest_check_refused }}"]
  register: studio_guest_check_refused_result
  changed_when: false
  failed_when: studio_guest_check_refused_result.rc == 0

- name: Out without Squid only with the internet directly (studio_guest_direct_internet)
  ansible.builtin.command:
    argv: [curl, -sS, -m, "10", -o, /dev/null, --noproxy, "*", "{{ studio_guest_check_allowed }}"]
  register: studio_guest_check_direct
  changed_when: false
  failed_when: (studio_guest_check_direct.rc == 0) != (studio_guest_direct_internet | bool)
