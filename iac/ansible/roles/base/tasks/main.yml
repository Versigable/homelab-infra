- name: Base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    update_cache: true
    cache_valid_time: 3600

- name: Time zone
  community.general.timezone:
    name: "{{ base_timezone }}"

- name: Admin user for Ansible
  ansible.builtin.user:
    name: "{{ base_admin_user }}"
    shell: /bin/bash
    create_home: true

- name: Operators' public keys
  ansible.builtin.set_fact:
    base_admin_pubkey_files: "{{ query('ansible.builtin.fileglob', base_admin_keys_dir ~ '/*.pub') | sort }}"

# exclusive: true below drops every key not listed, so an empty list would lock Ansible out.
- name: There is at least one operator key
  ansible.builtin.assert:
    that: base_admin_pubkey_files | length > 0
    fail_msg: "No *.pub files in {{ base_admin_keys_dir }}"

- name: Admin user's keys (the operators' keys in iac/keys, nothing else)
  ansible.posix.authorized_key:
    user: "{{ base_admin_user }}"
    key: "{% for f in base_admin_pubkey_files %}{{ lookup('ansible.builtin.file', f) }}\n{% endfor %}"
    exclusive: true

- name: Admin user can sudo without a password
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ base_admin_user }}"
    content: "{{ base_admin_user }} ALL=(ALL) NOPASSWD: ALL\n"
    mode: "0440"
    validate: visudo -cf %s

# The Proxmox Debian 13 template enables ssh.socket (Accept=no), which hands port 22 to
# ssh.service. Stopping the socket doesn't take the port back from the running daemon,
# and a reload (a re-exec that keeps the inherited port) can't bind it again and exits.
# Keep one listener, the plain service, and restart it rather than reload it: with
# KillMode=process, open sessions (including Ansible's) survive a restart.
- name: SSH is not socket-activated
  ansible.builtin.systemd_service:
    name: ssh.socket
    state: stopped
    enabled: false
  notify: Restart ssh

- name: SSH runs as a plain service
  ansible.builtin.systemd_service:
    name: ssh.service
    state: started
    enabled: true

# Applied last, after the admin user works: from here on nobody logs in as root over SSH.
- name: SSH keys only, no root login
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-iac.conf
    content: |
      # Managed by homelab-infra iac/ansible (role base).
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Daily package lists and unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"
