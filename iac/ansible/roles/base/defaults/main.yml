base_admin_user: ansible
# Every operator's public key (iac/keys/*.pub). The admin user accepts exactly these.
base_admin_keys_dir: "{{ role_path }}/../../../keys"
base_timezone: America/Denver
base_packages:
  - acl
  - ca-certificates
  - curl
  - gnupg
  - python3
  - python3-debian
  - sudo
  - unattended-upgrades
