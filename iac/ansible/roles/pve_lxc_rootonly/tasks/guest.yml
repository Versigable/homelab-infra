# Create only. Once the share is mounted, this path is the dataset's root on TrueNAS,
# and Mapall makes root its owner, so a mode set here would chmod the share itself.
- name: NFS mount points on the node for {{ guest.inventory_hostname }}
  ansible.builtin.command: "mkdir -p {{ item.path }}"
  args:
    creates: "{{ item.path }}"
  loop: "{{ guest.lxc_node_nfs_mounts | default([]) }}"

# Same options as the gameroom mount: automount, so a node boot never waits on TrueNAS
# (which boots on the same node), and a hard mount, so a NAS restart pauses I/O instead
# of failing it. A mount with `ro: true` is read-only on the node: a node-side NFS client holding
# dirty pages for TrueNAS (a VM on the same node) can deadlock it, as on 2026-10-23, so mounts
# the node never needs to write are read-only.
- name: NFS mounts in fstab for {{ guest.inventory_hostname }}
  ansible.posix.mount:
    src: "{{ item.src }}"
    path: "{{ item.path }}"
    fstype: nfs4
    opts: "{{ 'ro' if item.ro | default(false) else 'rw' }},relatime,vers=4.2,hard,proto=tcp,_netdev,nofail,x-systemd.automount"
    state: present
  loop: "{{ guest.lxc_node_nfs_mounts | default([]) }}"
  notify: Activate new automounts

- name: Flush handlers so new automounts exist before the container uses them
  ansible.builtin.meta: flush_handlers

- name: Mounts the hookscript waits for, for {{ guest.inventory_hostname }}
  ansible.builtin.copy:
    dest: "/etc/iac/lxc-wait-mounts/{{ guest.vmid }}"
    content: "{{ guest.lxc_wait_mounts | join('\n') }}\n"
    mode: "0644"
  when: guest.lxc_wait_mounts | default([]) | length > 0

- name: Read the container config of {{ guest.inventory_hostname }}
  ansible.builtin.command: "pct config {{ guest.vmid }}"
  register: pve_lxc_rootonly_config
  changed_when: false

- name: Feature flags of {{ guest.inventory_hostname }}
  ansible.builtin.command: "pct set {{ guest.vmid }} --features {{ guest.lxc_features }}"
  vars:
    current: "{{ pve_lxc_rootonly_config.stdout | regex_search('^features: (\\S+)', '\\1', multiline=True) | default([''], true) | first }}"
  when:
    - guest.lxc_features is defined
    - (current.split(',') | sort) != (guest.lxc_features.split(',') | sort)
  register: pve_lxc_rootonly_features
  changed_when: true

- name: Bind mounts of {{ guest.inventory_hostname }}
  ansible.builtin.command: "pct set {{ guest.vmid }} --{{ item.id }} {{ desired }}"
  vars:
    desired: "{{ item.host_path ~ ',mp=' ~ item.guest_path ~ ((',' ~ item.options) if item.options is defined else '') }}"
    current: "{{ pve_lxc_rootonly_config.stdout | regex_search('^' ~ item.id ~ ': (\\S+)', '\\1', multiline=True) | default([''], true) | first }}"
  loop: "{{ guest.lxc_bind_mounts | default([]) }}"
  # Proxmox stores the options in its own order (ro=1,shared=1), so compare them as a set;
  # comparing strings rewrote mp0 and restarted the container on every run.
  when: (current.split(',') | sort) != (desired.split(',') | sort)
  register: pve_lxc_rootonly_mounts
  changed_when: true

- name: Tags of {{ guest.inventory_hostname }}
  ansible.builtin.command: "pct set {{ guest.vmid }} --tags {{ guest.pve_tags | join(';') }}"
  vars:
    current: "{{ pve_lxc_rootonly_config.stdout | regex_search('^tags: (\\S+)', '\\1', multiline=True) | default([''], true) | first }}"
  when:
    - guest.pve_tags is defined
    - (current.split(';') | reject('equalto', '') | sort) != (guest.pve_tags | sort)
  changed_when: true

- name: Hookscript of {{ guest.inventory_hostname }}
  ansible.builtin.command: "pct set {{ guest.vmid }} --hookscript local:snippets/iac-lxc-wait-mounts.sh"
  vars:
    current: "{{ pve_lxc_rootonly_config.stdout | regex_search('^hookscript: (\\S+)', '\\1', multiline=True) | default([''], true) | first }}"
  when:
    - guest.lxc_wait_mounts | default([]) | length > 0
    - current != 'local:snippets/iac-lxc-wait-mounts.sh'
  changed_when: true

- name: Restart so the changes take effect for {{ guest.inventory_hostname }}
  ansible.builtin.command: "pct reboot {{ guest.vmid }}"
  when: pve_lxc_rootonly_features is changed or pve_lxc_rootonly_mounts is changed
  changed_when: true
