service_layout_name: "{{ inventory_hostname }}"
service_layout_subdirs:
  - compose
  - config
  - data
  - logs
  - backups
service_layout_runner_user: gitlab-runner
# What deploy.sh may run as root: install root-owned files (.env is root 0600), run
# docker compose, and set ACLs. The same set as the monitoring host.
service_layout_runner_sudo:
  - /usr/bin/docker
  - /usr/bin/install
  - /usr/bin/setfacl
