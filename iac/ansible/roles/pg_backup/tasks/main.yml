- name: Backup script
  ansible.builtin.copy:
    src: pg-container-backup
    dest: /usr/local/sbin/pg-container-backup
    mode: "0755"

- name: Backup service units
  ansible.builtin.template:
    src: pg-backup.service.j2
    dest: "/etc/systemd/system/pg-backup-{{ item.name }}.service"
    mode: "0644"
  loop: "{{ pg_backup_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd

- name: Backup timers
  ansible.builtin.template:
    src: pg-backup.timer.j2
    dest: "/etc/systemd/system/pg-backup-{{ item.name }}.timer"
    mode: "0644"
  loop: "{{ pg_backup_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd

- name: Load new units before enabling them
  ansible.builtin.meta: flush_handlers

- name: Timers enabled and running
  ansible.builtin.systemd_service:
    name: "pg-backup-{{ item.name }}.timer"
    state: started
    enabled: true
  loop: "{{ pg_backup_jobs }}"
  loop_control:
    label: "{{ item.name }}"
