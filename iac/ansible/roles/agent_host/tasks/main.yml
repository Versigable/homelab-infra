- name: Packages
  ansible.builtin.apt:
    name: "{{ agent_host_packages }}"
    state: present
    update_cache: true

- name: Extra hosts entries
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ item }}"
    regexp: "^{{ item.split()[0] | regex_escape }}\\s+{{ item.split()[1] | regex_escape }}(\\s|$)"
  loop: "{{ agent_host_extra_hosts }}"

# --- The agent user -------------------------------------------------------------------------

- name: The agent user (no sudo, no password)
  ansible.builtin.user:
    name: "{{ agent_host_user }}"
    shell: /bin/bash
    create_home: true
    password: "!"
    groups: []
    append: false

- name: The agent user's SSH directory
  ansible.builtin.file:
    path: "/home/{{ agent_host_user }}/.ssh"
    state: directory
    owner: "{{ agent_host_user }}"
    group: "{{ agent_host_user }}"
    mode: "0700"

# Exact list: a key removed from host_vars is removed here.
- name: Keys that may log in as the agent user
  ansible.builtin.copy:
    dest: "/home/{{ agent_host_user }}/.ssh/authorized_keys"
    content: |
      # Managed by Ansible (role agent_host, host_vars agent_host_login_keys).
      {% for k in agent_host_login_keys %}
      {{ k }}
      {% endfor %}
    owner: "{{ agent_host_user }}"
    group: "{{ agent_host_user }}"
    mode: "0600"

# --- Claude Code ----------------------------------------------------------------------------

- name: Claude Code repository key
  ansible.builtin.get_url:
    url: https://downloads.claude.ai/keys/claude-code.asc
    dest: /etc/apt/keyrings/claude-code.asc
    checksum: "sha256:{{ agent_host_claude_key_sha256 }}"
    mode: "0644"

- name: Claude Code repository
  ansible.builtin.deb822_repository:
    name: claude-code
    types: deb
    uris: https://downloads.claude.ai/claude-code/apt/stable
    suites: stable
    components: main
    signed_by: /etc/apt/keyrings/claude-code.asc

- name: Claude Code, pinned
  ansible.builtin.apt:
    name: "claude-code={{ agent_host_claude_version }}"
    update_cache: true
    allow_change_held_packages: true

- name: Hold Claude Code
  ansible.builtin.dpkg_selections:
    name: claude-code
    selection: hold

- name: Managed settings directory
  ansible.builtin.file:
    path: /etc/claude-code
    state: directory
    mode: "0755"

# apt owns the binary, so Claude Code's own updater stays off. Everything else (permissions,
# hooks) is the agent's own ~/.claude/settings.json.
- name: Managed settings
  ansible.builtin.copy:
    dest: /etc/claude-code/managed-settings.json
    content: "{{ agent_host_managed_settings | to_nice_json }}\n"
    mode: "0644"

- name: Claude Code runs
  ansible.builtin.command: claude --version
  become: true
  become_user: "{{ agent_host_user }}"
  register: agent_host_claude_check
  changed_when: false
  failed_when: >-
    agent_host_claude_check.rc != 0
    or agent_host_claude_version.split('-')[0] not in agent_host_claude_check.stdout

# --- The session: tmux + Claude Code with Remote Control -------------------------------------

- name: The tmux settings
  ansible.builtin.copy:
    dest: /etc/tmux.conf
    content: |
      # Managed by Ansible (role agent_host). Mouse on, so the browser's wheel scrolls history.
      set -g mouse on
      set -g history-limit 50000
      set -g default-terminal "tmux-256color"
    mode: "0644"

# Picks the last conversation back up after a crash, a network give-up or /exit, so the Claude
# app keeps finding the same session. First run (no conversation yet) starts a new one. The
# first start asks to trust the folder and to sign in: the owner answers once in the browser
# terminal.
- name: The session's Claude loop
  ansible.builtin.copy:
    dest: /usr/local/bin/agent-host-claude
    content: |
      #!/bin/bash
      # Managed by Ansible (role agent_host). Runs inside tmux session {{ agent_host_session }}.
      cd "$HOME/homelab-brain" 2>/dev/null || cd "$HOME"
      while :; do
        claude --continue --remote-control {{ agent_host_rc_name | quote }} \
          || claude --remote-control {{ agent_host_rc_name | quote }}
        echo "claude exited at $(date -u +%FT%TZ); starting again in 5 s (Ctrl-C twice to stop)"
        sleep 5
      done
    mode: "0755"

- name: The session's unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/agent-host-claude.service
    content: |
      # Managed by Ansible (role agent_host). Not restarted by Ansible: a restart ends the
      # agent's live session. Restart by hand when it's idle.
      [Unit]
      Description=Claude Code for {{ agent_host_user }} in tmux session {{ agent_host_session }} (Remote Control on)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=forking
      User={{ agent_host_user }}
      Group={{ agent_host_user }}
      WorkingDirectory=/home/{{ agent_host_user }}
      Environment=HOME=/home/{{ agent_host_user }} TERM=xterm-256color LANG=C.UTF-8
      ExecStart=/usr/bin/tmux new-session -d -s {{ agent_host_session }} /usr/local/bin/agent-host-claude
      ExecStop=/usr/bin/tmux kill-session -t {{ agent_host_session }}
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  notify: Reload systemd

- name: The session runs
  ansible.builtin.systemd_service:
    name: agent-host-claude
    enabled: true
    state: started
    daemon_reload: true

# --- New chats from the Claude app (Remote Control server mode) -----------------------------
# `claude remote-control` waits for "new session" from the app and starts each one as its own
# Claude in the vault folder (--spawn same-dir). Those chats live inside this process, not in
# tmux: reach them from the app, or later with `claude --resume`. In its own tmux session
# ({{ agent_host_session }}-rc) so its status and prompts can be seen and answered from SSH:
#   tmux -L {{ agent_host_session }}-rc attach
# It has its own tmux server (-L): on the default socket the session would be created inside
# agent-host-claude's tmux server, this unit would see its process exit at once, and its
# ExecStop would kill the new session (found 2026-11-22, right after !273).
# --no-create-session-in-dir: the main session above is already the "somewhere to type".
- name: The Remote Control server's loop
  ansible.builtin.copy:
    dest: /usr/local/bin/agent-host-rc-server
    content: |
      #!/bin/bash
      # Managed by Ansible (role agent_host). Runs inside tmux session {{ agent_host_session }}-rc.
      cd "$HOME/homelab-brain" 2>/dev/null || cd "$HOME"
      while :; do
        claude remote-control --spawn same-dir --capacity {{ agent_host_rc_capacity }} \
          --no-create-session-in-dir \
          --remote-control-session-name-prefix {{ agent_host_rc_name | quote }}
        echo "remote-control exited at $(date -u +%FT%TZ); starting again in 10 s (Ctrl-C twice to stop)"
        sleep 10
      done
    mode: "0755"
  when: agent_host_rc_server

- name: The Remote Control server's unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/agent-host-rc-server.service
    content: |
      # Managed by Ansible (role agent_host). Not restarted by Ansible: a restart ends every
      # chat started from the app (they can be resumed). Restart by hand when they're idle.
      [Unit]
      Description=Remote Control server for {{ agent_host_user }}: new chats from the Claude app
      After=network-online.target agent-host-claude.service
      Wants=network-online.target

      [Service]
      Type=forking
      User={{ agent_host_user }}
      Group={{ agent_host_user }}
      WorkingDirectory=/home/{{ agent_host_user }}
      Environment=HOME=/home/{{ agent_host_user }} TERM=xterm-256color LANG=C.UTF-8
      ExecStart=/usr/bin/tmux -L {{ agent_host_session }}-rc new-session -d -s {{ agent_host_session }}-rc /usr/local/bin/agent-host-rc-server
      ExecStop=/usr/bin/tmux -L {{ agent_host_session }}-rc kill-session -t {{ agent_host_session }}-rc
      Restart=on-failure
      RestartSec=10

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  notify: Reload systemd
  when: agent_host_rc_server

- name: The Remote Control server runs
  ansible.builtin.systemd_service:
    name: agent-host-rc-server
    enabled: true
    state: started
    daemon_reload: true
  when: agent_host_rc_server

# --- The browser terminal -------------------------------------------------------------------

- name: The download cache on the control node
  ansible.builtin.file:
    path: "{{ agent_host_cache }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  run_once: true
  become: false
  check_mode: false

- name: The ttyd release binary, checked, on the control node
  ansible.builtin.get_url:
    url: "https://github.com/tsl0922/ttyd/releases/download/{{ agent_host_ttyd_version }}/ttyd.x86_64"
    dest: "{{ agent_host_cache }}/ttyd-{{ agent_host_ttyd_version }}.x86_64"
    checksum: "sha256:{{ agent_host_ttyd_sha256 }}"
    mode: "0600"
  delegate_to: localhost
  run_once: true
  become: false
  check_mode: false

- name: The ttyd binary
  ansible.builtin.copy:
    src: "{{ agent_host_cache }}/ttyd-{{ agent_host_ttyd_version }}.x86_64"
    dest: /usr/local/bin/ttyd
    owner: root
    group: root
    mode: "0755"
  notify: Restart agent-host-term

# Attaches to the session's tmux (never a second session): closing the tab leaves it running.
# Who gets in is decided before ttyd: Authentik at Traefik, then this guest's firewall, which
# takes the port from Traefik only.
- name: The browser terminal's unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/agent-host-term.service
    content: |
      # Managed by Ansible (role agent_host). Reached only through Traefik + Authentik.
      [Unit]
      Description=Browser terminal on tmux session {{ agent_host_session }} (ttyd)
      After=agent-host-claude.service
      Wants=agent-host-claude.service

      [Service]
      User={{ agent_host_user }}
      Group={{ agent_host_user }}
      WorkingDirectory=/home/{{ agent_host_user }}
      Environment=HOME=/home/{{ agent_host_user }} TERM=xterm-256color LANG=C.UTF-8
      ExecStart=/usr/local/bin/ttyd --port {{ agent_host_term_port }} --writable --check-origin \
        --client-option titleFixed={{ agent_host_rc_name }} \
        /usr/bin/tmux new-session -A -s {{ agent_host_session }}
      Restart=always
      RestartSec=2

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  notify:
    - Reload systemd
    - Restart agent-host-term

- name: The browser terminal runs
  ansible.builtin.systemd_service:
    name: agent-host-term
    enabled: true
    state: started
    daemon_reload: true

# --- The owner check (Traefik forwardAuth, after Authentik) ---------------------------------

- name: The owner check's program
  ansible.builtin.copy:
    dest: /usr/local/bin/agent-host-authz
    content: |
      #!/usr/bin/python3 -I
      # Managed by Ansible (role agent_host). Traefik's forwardAuth after Authentik: 204 only
      # when X-authentik-username (set by the authentik-forward middleware) is an owner.
      import http.server, json, sys
      OWNERS = set(json.loads(sys.argv[2]))
      class H(http.server.BaseHTTPRequestHandler):
          def do_GET(self):
              user = self.headers.get("X-authentik-username", "")
              ok = bool(user) and user in OWNERS
              self.send_response(204 if ok else 403)
              self.end_headers()
              self.log_message("%s %s", "allow" if ok else "deny", user or "-")
          do_HEAD = do_GET
      http.server.ThreadingHTTPServer(("0.0.0.0", int(sys.argv[1])), H).serve_forever()
    mode: "0755"
  notify: Restart agent-host-authz

- name: The owner check's unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/agent-host-authz.service
    content: |
      # Managed by Ansible (role agent_host). Reached only by Traefik (firewall).
      [Unit]
      Description=Owner check for the browser terminal (Traefik forwardAuth)
      After=network-online.target

      [Service]
      DynamicUser=yes
      ExecStart=/usr/local/bin/agent-host-authz {{ agent_host_authz_port }} {{ agent_host_term_owners | to_json | quote }}
      Restart=always
      RestartSec=2
      NoNewPrivileges=yes
      ProtectSystem=strict
      ProtectHome=yes
      PrivateTmp=yes

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  notify:
    - Reload systemd
    - Restart agent-host-authz

- name: The owner check runs
  ansible.builtin.systemd_service:
    name: agent-host-authz
    enabled: true
    state: started
    daemon_reload: true

# --- The vault --------------------------------------------------------------------------------

- name: The vault (livesync-bridge, snapshots, Claude's memory path)
  ansible.builtin.import_tasks: vault.yml
  when: agent_host_vault_sync | bool

# --- Firewall -------------------------------------------------------------------------------

- name: Firewall rules
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0644"
    validate: nft -c -f %s
  notify: Reload nftables

- name: Firewall on at boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
