- name: Reload nftables
  ansible.builtin.service:
    name: nftables
    state: reloaded

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart agent-host-authz
  ansible.builtin.systemd_service:
    name: agent-host-authz
    state: restarted

- name: Restart agent-host-term
  ansible.builtin.systemd_service:
    name: agent-host-term
    state: restarted

# No handler restarts agent-host-claude: that would end the agent's live session mid-task.
# After a change to its unit or script, restart it by hand when the agent is idle:
#   sudo systemctl restart agent-host-claude
