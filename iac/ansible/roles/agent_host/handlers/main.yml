- name: Reload nftables
  ansible.builtin.service:
    name: nftables
    state: reloaded

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart agent-host-authz
  ansible.builtin.systemd_service:
    name: agent-host-authz
    state: restarted

# The bridge picks up from its saved positions, so a restart is safe. Not before it has a config.
- name: Restart agent-host-bridge
  ansible.builtin.systemd_service:
    name: agent-host-bridge
    state: restarted
  when: agent_host_bridge_config_file.stat.exists | default(false)

- name: Restart agent-host-term
  ansible.builtin.systemd_service:
    name: agent-host-term
    state: restarted

# No handler restarts agent-host-claude: that would end the agent's live session mid-task.
# After a change to its unit or script, restart it by hand when the agent is idle:
#   sudo systemctl restart agent-host-claude
