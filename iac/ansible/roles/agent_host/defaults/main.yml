# An agent's own guest (vault: 1-Projects/wintermute). One Linux user runs Claude Code in one
# tmux session with Remote Control on, so the same conversation is reachable three ways:
#   - the Claude app / claude.ai/code (Remote Control: outbound HTTPS only, the owner's account)
#   - a browser terminal (ttyd attached to the session) behind Traefik + Authentik
#   - SSH as the agent user, then `tmux attach -t <session>`
# The agent user has no sudo here: it holds lab credentials, and this role (run by an operator)
# is the only way its own guest changes.

agent_host_user: agent
agent_host_session: agent
# The session's name in the Claude app's list.
agent_host_rc_name: "{{ inventory_hostname }}"
# Managed Claude Code settings (/etc/claude-code/managed-settings.json; users can't override).
# remoteControlAtStartup: every Claude started on this guest (a second tmux window, an SSH
# shell, VS Code) shows up in the Claude app too, not just the main session.
agent_host_managed_settings:
  env:
    DISABLE_AUTOUPDATER: "1"
  remoteControlAtStartup: true
# Remote Control server mode (tasks/main.yml): "new session" in the Claude app starts a fresh
# Claude here, in the vault folder. Capacity caps how many run at once (~270 MB each).
agent_host_rc_server: true
agent_host_rc_capacity: 4
# Public keys that may log in as the agent user. Exact list; empty means SSH as the agent user
# is closed (operators still reach the guest as `ansible`).
agent_host_login_keys: []

# Claude Code from Anthropic's signed apt repository, pinned and held (bumped by MR), the same
# pin as the studio cells (group_vars/studio_cell.yml).
agent_host_claude_version: "2.1.308-1"
agent_host_claude_key_sha256: bd70a5e4a268002704024ceba7f8446024114e94f3f0bdd11c23a9e592be81c6

# ttyd's release binary, checked against its SHA256SUMS (Debian 13 doesn't package it); the
# same pin as the studio cells.
agent_host_ttyd_version: "1.7.7"
agent_host_ttyd_sha256: 8a217c968aba172e0dbf3f34447218dc015bc4d5e59bf51db2f2cd12b7be4f55
agent_host_cache: "{{ lookup('ansible.builtin.env', 'HOME') }}/.cache/homelab-iac/agent-host"

# Firewall (templates/nftables.conf.j2). The browser terminal's port takes Traefik only; SSH
# takes X-Mansion's LAN (WARP users arrive from Traefik's and the cf-tunnel replicas' addresses,
# all inside it). The studio network (10.77.0.0/16) is refused before anything else.
agent_host_term_port: 7681
# The owner check Traefik asks after Authentik (tasks/main.yml, agent-host-authz): only these
# Authentik usernames get the browser terminal. Empty = nobody. It doesn't trust the outpost's
# provider set-up alone: if this host ever fell back to the domain-wide provider, every
# Authentik user would otherwise get a shell holding the agent's credentials.
agent_host_authz_port: 7682
agent_host_term_owners: []
agent_host_term_from: [10.0.2.5]
agent_host_ssh_from: [10.0.0.0/16]
agent_host_deny_from: [10.77.0.0/16]

# Extra /etc/hosts lines, e.g. a LAN address for a name that otherwise resolves to Cloudflare.
agent_host_extra_hosts: []

agent_host_packages:
  - git
  - jq
  - nftables
  - openssh-client
  - python3-venv
  - rsync
  - tmux
  - unzip

# --- The vault (tasks/vault.yml): livesync-bridge keeps a folder in step with the brain's
# CouchDB, headless (vault: 1-Projects/wintermute/notes/vault-sync). Off unless set per host.
agent_host_vault_sync: false
agent_host_vault_dir: "/home/{{ agent_host_user }}/homelab-brain"
# The agent's memory folder in the vault; Claude Code's memory path links to it.
agent_host_memory_slug: "{{ agent_host_user }}"
# Deno, the release zip checked against its published .sha256sum (the bridge's Dockerfile pin).
agent_host_deno_version: "2.9.7"
agent_host_deno_sha256: c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490
# The bridge has no releases: pinned to a commit, bumped by MR after a scratch-db test.
agent_host_bridge_repo: https://github.com/vrtmrz/livesync-bridge.git
agent_host_bridge_commit: 1c252305bbddcacd200b8560d3bb786afe0906e9
# The vault's LiveSync settings (checked 2026-11-21 in the db's milestone): no E2EE, no path
# obfuscation, case-insensitive names, default chunking.
agent_host_couchdb_url: https://brain.ninjaprivacy.org
agent_host_couchdb_db: homelab-brain
agent_host_couchdb_user: "{{ agent_host_user }}"
# From the control node's environment: labsecret run -e AGENT_HOST_COUCHDB_PASSWORD=<item> -- iac.sh ...
# Without it, the guest's existing config is left as it is.
agent_host_couchdb_password: "{{ lookup('ansible.builtin.env', 'AGENT_HOST_COUCHDB_PASSWORD') }}"
# A local history of the vault, outside it (no dot folder inside the vault), committed daily,
# so a bad sync can be undone. Never pushed anywhere.
agent_host_vault_snapshots: "/home/{{ agent_host_user }}/vault-snapshots.git"
