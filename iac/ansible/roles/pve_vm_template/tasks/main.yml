# The cloud-init templates Terraform clones VMs from (modules/vm). A template on local-lvm
# can only be cloned on its own node, so each node has its own, with its own VMID
# (pve_vm_template_vmids: phoenix 9000, rogue 9001). An existing template is left alone, so
# bumping the image means removing the old templates first.
# They sit in the iac pool so the IaC token may clone them.
# Nodes not in the map (wolverine: LXC guests only, terraform/wolverine) get no template.
- name: This node's template VMID
  ansible.builtin.set_fact:
    pve_vm_template_vmid: "{{ pve_vm_template_vmids[inventory_hostname] }}"
  when: inventory_hostname in pve_vm_template_vmids

- name: Is this node's template already there?
  ansible.builtin.find:
    paths: /etc/pve/nodes
    patterns: "{{ pve_vm_template_vmid }}.conf"
    recurse: true
  register: pve_vm_template_conf
  when: inventory_hostname in pve_vm_template_vmids

- name: Build the VM template
  when:
    - inventory_hostname in pve_vm_template_vmids
    - pve_vm_template_conf.matched == 0
  block:
    - name: Directory for the cloud image
      ansible.builtin.file:
        path: /var/lib/vz/import
        state: directory
        mode: "0755"

    - name: Debian cloud image, checksum-verified
      ansible.builtin.get_url:
        url: "{{ pve_vm_template_url }}"
        dest: "/var/lib/vz/import/{{ pve_vm_template_image }}"
        checksum: "sha512:{{ pve_vm_template_sha512 }}"
        mode: "0644"

    - name: Create the VM with the image as its disk and a cloud-init drive
      ansible.builtin.command:
        argv:
          - qm
          - create
          - "{{ pve_vm_template_vmid }}"
          - --name
          - "{{ pve_vm_template_name }}"
          - --pool
          - "{{ pve_vm_template_pool }}"
          - --ostype
          - l26
          - --cpu
          - x86-64-v2-AES
          - --memory
          - "1024"
          - --net0
          - virtio,bridge=vmbr0,firewall=1
          - --scsihw
          - virtio-scsi-single
          - --scsi0
          - "{{ pve_vm_template_datastore }}:0,import-from=/var/lib/vz/import/{{ pve_vm_template_image }},discard=on,iothread=1"
          - --ide2
          - "{{ pve_vm_template_datastore }}:cloudinit"
          - --boot
          - order=scsi0
          - --serial0
          - socket
          - --vga
          - serial0
      changed_when: true

    - name: Turn it into a template
      ansible.builtin.command: "qm template {{ pve_vm_template_vmid }}"
      changed_when: true
