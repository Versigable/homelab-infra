# studio-gw: the studio network's only router (vault: 1-Projects/game-studio-platform/design/architecture).
# The real lists live in inventory/group_vars/studio_gw.yml.

studio_gw_lan_ip: 10.0.1.150
studio_gw_studio_ip: 10.77.0.1
studio_gw_studio_net: 10.77.0.0/24
# Squid on the studio side; guests use it as their HTTP(S) proxy (group_vars/studio_private.yml).
studio_gw_proxy_port: 3128
# Squid's resolver.
studio_gw_upstream_dns: 10.0.1.1
# SSH to the gateway itself (operators and Ansible; WARP arrives from inside 10.0.0.0/16).
studio_gw_admin_net: 10.0.0.0/16

# Outbound, per class of studio guest: who (sources), which ports (443 for HTTPS, 80 for
# HTTP), and the hostnames they may reach through Squid (a leading dot: the domain and every
# name under it). Nothing else gets out. A class may have its own proxy_port, so that one
# guest can give each local user its own list (role studio_cell pins users to ports). A class
# with any_name: true reaches any hostname on its ports, but never a private, loopback,
# link-local or CGNAT address (the LAN is on the other side of this gateway).
#   forge: {sources: [10.77.0.10], ports: [80, 443], names: [deb.debian.org, ...]}
#   cells_agent: {proxy_port: 3129, sources: [10.77.0.60], ports: [443], any_name: true}
studio_gw_egress: {}

# Every port Squid listens on: the default, plus each class's own.
studio_gw_proxy_ports: >-
  {{ ([studio_gw_proxy_port | int]
      + (studio_gw_egress.values() | selectattr('proxy_port', 'defined') | map(attribute='proxy_port') | map('int') | list))
     | unique | sort }}

# Inbound from the LAN, by DNAT on the gateway's LAN address. proto is tcp unless given:
#   - {name: forge-play, from: 10.0.2.5, port: 3000, to_ip: 10.77.0.10, to_port: 3000}
#   - {name: forge-romm-webrtc, from: 10.0.2.5, port: 7788, to_ip: 10.77.0.10, to_port: 7788, proto: udp}
studio_gw_ingress: []

# Outbound to LAN services studio guests reach directly, not through Squid: by address and
# TCP port, source-NATed to the gateway's LAN address so the LAN side needs no route back:
#   - {name: forge-gameroom-nfs, from: 10.77.0.10, to_ip: 10.0.1.7, port: 2049}
studio_gw_lan_access: []

# Local names dnsmasq answers, as <name>.studio:
#   - {name: studio-forge, ip: 10.77.0.10}
studio_gw_hosts: []

# Local names whose address the gateway looks up on the LAN side and publishes as
# <name>.studio, re-checked every 5 minutes (studio-gw-publish-names.timer). For an outside
# address a guest has to know (the WAN IP a WebRTC server advertises) without the studio
# network getting an upstream resolver: guests still resolve only .studio names. Only a
# public IPv4 that isn't Cloudflare's is published; a failed lookup keeps the last one.
#   - {name: webstation-udp, lookup: webstation-udp.ninjaprivacy.org}
studio_gw_published_names: []
# Where the published names live: a dnsmasq hostsdir, re-read on change without a restart.
studio_gw_hostsdir: /etc/dnsmasq-studio-hosts

# Log every DNS query to the journal.
studio_gw_log_queries: false
