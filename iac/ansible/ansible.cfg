[defaults]
inventory = inventory
roles_path = roles
interpreter_python = /usr/bin/python3
stdout_callback = default
result_format = yaml
forks = 10

[ssh_connection]
pipelining = True
# Guests get new host keys on every rebuild, so they live in their own known_hosts file.
# iac.sh bootstrap forgets a guest's old key before first contact.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts_iac
