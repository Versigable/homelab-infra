# cloud-init creates the ansible user with the operators' keys (modules/vm), so VMs need no
# bootstrap.yml: site.yml reaches them as ansible from the first run.
ansible_user: ansible
# Each operator's own key (iac/keys); IAC_SSH_KEY picks it, ~/.ssh/homelab-iac by default.
ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'IAC_SSH_KEY') | default('~/.ssh/homelab-iac', true) }}"
