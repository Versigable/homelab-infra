# studio-gw (role studio_gw). Vault: 1-Projects/game-studio-platform/design/architecture §3.

# Outbound through Squid, by exact hostname, per class of studio guest. HTTPS is spliced
# only when the TLS SNI is on the same list.
studio_gw_egress:
  forge:
    sources: [10.77.0.10]
    ports: [80, 443]
    names:
      # OS packages and security updates
      - deb.debian.org
      - security.debian.org
      # NVIDIA driver (forge_gpu)
      - developer.download.nvidia.com
      # NVIDIA container toolkit repository (forge_gpu)
      - nvidia.github.io
      # Docker Engine (docker role)
      - download.docker.com
      # Selkies base image (forge_play); ghcr.io redirects blobs to the second name
      - ghcr.io
      - pkg-containers.githubusercontent.com
  hub:
    sources: [10.77.0.20]
    ports: [80, 443]
    names:
      # OS packages and security updates; its services (step 2b) add their own
      - deb.debian.org
      - security.debian.org
  # Every person's cell (role studio_cell). Exact names, seeded from the vendors' docs, plus
  # anything a tool turns out to need from Squid's access log (TCP_DENIED). The one exception
  # is Unity: its CLI, Editor and licensing reach many hosts under its own two domains, so
  # those are allowed whole (a leading dot matches the domain and every name under it).
  cells:
    sources: [10.77.0.60]
    ports: [80, 443]
    names:
      # OS packages and security updates
      - deb.debian.org
      - security.debian.org
      # Claude Code: its apt repository, the API, and the person's sign-in
      - downloads.claude.ai
      - api.anthropic.com
      - claude.ai
      - platform.claude.com
      # Codex: the API and the person's ChatGPT sign-in (the binary comes from the control node)
      - api.openai.com
      - auth.openai.com
      - chatgpt.com
      # Unity, whole (MetaVersig, 2026-10-25). Seen so far: the CLI's apt repository
      # (hub, hub-dist.unity3d.com), Editor releases and downloads (services.api.unity.com,
      # download.unity3d.com, cloudmedia-docs.unity3d.com for the documentation module),
      # sign-in (api.unity.com, core.cloud.unity3d.com) and the licensing client the CLI
      # fetches on first activation (public-stevedore.unity3d.com).
      - .unity3d.com
      - .unity.com
      # Refused on purpose: api2.amplitude.com, the Unity CLI's analytics (not a Unity domain).

# Play streams: Traefik (VM 100) -> studio-gw:3000 -> the Forge's play container.
studio_gw_ingress:
  - name: forge-play
    from: 10.0.2.5
    port: 3000
    to_ip: 10.77.0.10
    to_port: 3000
  # The RomM webstation on the Forge (role forge_webstation): Traefik -> :3040 for players'
  # streams, and RomM on ServiceHub (LXC 103) -> :3040 for the broker API it calls.
  - name: forge-romm-stream
    from: 10.0.2.5
    port: 3040
    to_ip: 10.77.0.10
    to_port: 3040
  - name: forge-romm-broker
    from: 10.0.1.5
    port: 3040
    to_ip: 10.77.0.10
    to_port: 3040

# LAN services reached directly, not through Squid. The Forge's webstation reads the ROM
# library from TrueNAS over NFSv4 (the gameroom share, mounted read-only by nfs_client).
studio_gw_lan_access:
  - name: forge-gameroom-nfs
    from: 10.77.0.10
    to_ip: 10.0.1.7
    port: 2049

studio_gw_hosts:
  - {name: studio-gw, ip: 10.77.0.1}
  - {name: studio-forge, ip: 10.77.0.10}
  - {name: studio-hub, ip: 10.77.0.20}
  - {name: cell-metaversig, ip: 10.77.0.60}
