# Root-only container options, applied on the node by pve_lxc_rootonly.
# keyctl is for Docker inside the unprivileged container.
lxc_features: nesting=1,keyctl=1

# Nextcloud's files live on TrueNAS Twelve_TB_RAIDZ1/nextcloud, which exists only after
# the 12 TB pool rebuild (vault: 5-Decisions/2026-10-17_twelve-tb-pool-raidz1-via-liberry).
# Set this to true once the dataset and its NFS export are in place.
nextcloud_storage_ready: false

lxc_node_nfs_mounts: >-
  {{ [{'src': '10.0.1.7:/mnt/Twelve_TB_RAIDZ1/nextcloud', 'path': '/mnt/nextcloud-data'}]
     if nextcloud_storage_ready else [] }}
lxc_bind_mounts: >-
  {{ [{'id': 'mp0', 'host_path': '/mnt/nextcloud-data', 'guest_path': '/srv/nextcloud-data'}]
     if nextcloud_storage_ready else [] }}

service_layout_name: nextcloud

pg_backup_jobs:
  - name: nextcloud
    container: nextcloud-db
    database: nextcloud
    user: nextcloud
    dir: /home/nextcloud/nextcloud-hub/backups
