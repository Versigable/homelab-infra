# Root-only container options, applied on the node by pve_lxc_rootonly.
# keyctl is for Docker inside the unprivileged container.
lxc_features: nesting=1,keyctl=1

# Nextcloud's files live on TrueNAS <pool>/nextcloud. Since the 2026-10-24 rebuild the
# pool is the RAIDZ1 Twelve_TB_RAIDZ1 (it was Twelve_TB_Mirror; the dataset moved with
# zfs send -R, so only nextcloud_nfs_pool changed)
# (vault: 5-Decisions/2026-10-17_twelve-tb-pool-raidz1-via-liberry).
# nextcloud_storage_ready: false detaches nothing by itself; it only stops Ansible from
# adding the mounts.
nextcloud_storage_ready: true
nextcloud_nfs_pool: Twelve_TB_RAIDZ1

lxc_node_nfs_mounts: >-
  {{ [{'src': '10.0.1.7:/mnt/' ~ nextcloud_nfs_pool ~ '/nextcloud', 'path': '/mnt/nextcloud-data'}]
     if nextcloud_storage_ready else [] }}
# shared=1: the same NFS path exists on every node, so the LXC can migrate (as ServiceHub).
lxc_bind_mounts: >-
  {{ [{'id': 'mp0', 'host_path': '/mnt/nextcloud-data', 'guest_path': '/srv/nextcloud-data', 'options': 'shared=1'}]
     if nextcloud_storage_ready else [] }}
# The pre-start hookscript waits for these before the container may start.
lxc_wait_mounts: "{{ ['/mnt/nextcloud-data'] if nextcloud_storage_ready else [] }}"

service_layout_name: nextcloud

pg_backup_jobs:
  - name: nextcloud
    container: nextcloud-db
    database: nextcloud
    user: nextcloud
    dir: /home/nextcloud/nextcloud-hub/backups
