# Root-only container options, applied on the node by pve_lxc_rootonly. No Docker here, so no
# keyctl; nesting for systemd's own sandboxing in Debian 13.
lxc_features: nesting=1

# Role agent_host (vault: 1-Projects/wintermute). Firekube's Claude Code agent.
agent_host_user: wintermute
agent_host_session: wintermute
agent_host_rc_name: Wintermute
# Keys that may log in as the agent user (and so attach to its tmux session). Firekube's own
# key (Bitwarden "[pubkey] Firekube · ssh", the same key jf accepts for him).
agent_host_login_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFLWlBZkFzikUXvgP6lQkEyuF5Cc5bY6TLCMIQPsZt9t pm"

# SSH also from X-Mansion's home LAN, where Firekube's PC is (routed to the lab without NAT,
# so it arrives as 192.168.77.x, not through WARP). Login is still key-only: the ansible user
# takes the operators' keys, wintermute takes agent_host_login_keys.
agent_host_ssh_from: [10.0.0.0/16, 192.168.77.0/24]

# Authentik usernames allowed into the browser terminal (agent_host's owner check, after
# Authentik's WintermuteForwardAuth provider). Firekube only.
agent_host_term_owners: []
