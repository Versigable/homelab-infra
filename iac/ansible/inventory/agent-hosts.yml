# Hosts that get named agent logins (playbooks/agent-logins.yml). phoenix and rogue come from
# nodes.yml; jf, PBS and the Traefik VM aren't built by Terraform and are listed only here.
# wolverine: shared node that also runs MetaVersig's router (pfSense VM 300); this play only
# adds the agent's user, keys and sudoers file there, and never touches guests or networking.
agent_login_hosts:
  hosts:
    phoenix:
    rogue:
    wolverine:
    jf:
      ansible_host: 10.0.1.8
    pbs:
      ansible_host: 10.0.4.1
    traefik:
      ansible_host: 10.0.2.5
      ansible_port: 2022
