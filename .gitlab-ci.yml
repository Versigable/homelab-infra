stages:
  - deploy

# ============================================================
# Traefik (single service — no split needed)
# ============================================================
deploy-traefik:
  stage: deploy
  tags: ["traefik"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - hosts/traefik/**/*
  script:
    - bash hosts/traefik/scripts/deploy.sh

# ============================================================
# ServiceHub — Per-Service Deploy Jobs
# ============================================================
.servicehub-deploy:
  stage: deploy
  tags: ["servicehub"]
  script:
    - bash hosts/servicehub/scripts/deploy.sh ${SERVICE_KEY}

deploy-wiki:
  extends: .servicehub-deploy
  variables:
    SERVICE_KEY: wiki
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - hosts/servicehub/compose/wiki.yml
        - hosts/servicehub/secrets/wiki.env.sops
        - hosts/servicehub/scripts/deploy.sh

deploy-n8n:
  extends: .servicehub-deploy
  variables:
    SERVICE_KEY: n8n
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - hosts/servicehub/compose/n8n.yml
        - hosts/servicehub/secrets/n8n.env.sops
        - hosts/servicehub/scripts/deploy.sh

